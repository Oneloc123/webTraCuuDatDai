function drawLandBaseTo(ctx){
  LANDMASSES.forEach(m=>{
    const poly=m.map(p=>({x:p[0],y:p[1]}));
    if(!polygonPath(ctx,poly)) return;

    ctx.save();
    ctx.shadowColor='rgba(80,60,30,0.55)';

    ctx.fillStyle='#00000040'; ctx.fill();
    ctx.restore();

    const g=ctx.createLinearGradient(0,0,0,MAP_H);
    g.addColorStop(0,'#e8dcc0');
    g.addColorStop(.5,'#ddd0a8');
    g.addColorStop(1,'#d0c090');
    ctx.fillStyle=g;
    ctx.globalAlpha=.98; ctx.fill(); ctx.globalAlpha=1;

    ctx.save(); ctx.clip();
    drawParchmentNoise(ctx, 0, 0, MAP_W, MAP_H);
    ctx.restore();

    ctx.strokeStyle='#6a5a3a'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.strokeStyle='#ffffff25'; ctx.lineWidth=1; ctx.stroke();
  });

  const v = ctx.createRadialGradient(MAP_W/2, MAP_H/2, MAP_W*0.35, MAP_W/2, MAP_H/2, MAP_W*0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(60,40,20,0.32)');
  ctx.fillStyle = v; ctx.fillRect(0,0,MAP_W,MAP_H);
}
function drawParchmentNoise(ctx, x, y, w, h){
  const rnd = seededRnd(12345);
  ctx.globalAlpha = 0.06;
  for(let i=0;i<3800;i++){
    const px = x + rnd()*w, py = y + rnd()*h;
    const s = 1 + rnd()*2;
    const bright = rnd()>0.5;
    ctx.fillStyle = bright ? '#fff8e0' : '#8a7048';
    ctx.fillRect(px, py, s, s);
  }
  ctx.globalAlpha = 1;
}

/* ===== VÙNG PHE + HOA VĂN ===== */
function drawRegionsTo(ctx){
  const pFid = S.playerFaction;
  const visible = new Set();
  S.regions.forEach(r=>{
    if(r.owner===pFid){ visible.add(r.id); r.neighbors.forEach(n=>visible.add(n)); }
  });
  S.regions.forEach(r=>{
    if(r.poly.length<3) return;
    if(!visible.has(r.id) && r.owner!==pFid){
      polygonPath(ctx, r.poly);
      ctx.fillStyle = 'rgba(60,60,70,0.5)';
      ctx.fill();
      ctx.save(); ctx.clip();
      ctx.globalAlpha=0.35;
      for(let i=0;i<30;i++){
        const a = hash2(r.id*7+i, i*3)*Math.PI*2;
        const rr = hash2(i*5, r.id)*40;
        ctx.beginPath();
        ctx.arc(r.x + Math.cos(a)*rr, r.y + Math.sin(a)*rr, 20+hash2(i,i)*20, 0, Math.PI*2);
        ctx.fillStyle='rgba(180,180,190,0.35)';
        ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.restore();
      return;
    }
    if(r.owner===null){
      polygonPath(ctx, r.poly);
      ctx.fillStyle='rgba(215,200,160,0.4)';
      ctx.fill();
    } else {
      const col = S.factions[r.owner].color;
      const g = ctx.createLinearGradient(r.x-40, r.y-40, r.x+40, r.y+40);
      g.addColorStop(0, hexA(col, 0.32));
      g.addColorStop(1, hexA(col, 0.18));
      polygonPath(ctx, r.poly);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.save(); ctx.clip();
      ctx.globalAlpha = 0.07;
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      for(let k=-100;k<100;k+=10){
        ctx.beginPath();
        ctx.moveTo(r.x-80+k*1.5, r.y-80);
        ctx.lineTo(r.x-80+k*1.5+80, r.y+80);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }
    polygonPath(ctx, r.poly);
    const rOwner = r.owner;
    let borderDiffFaction = false;
    r.neighbors.forEach(nid=>{
      const n = S.regions[nid];
      if(n && n.owner !== rOwner && n.owner !== null && rOwner !== null){
        borderDiffFaction = true;
      }
    });
    if(borderDiffFaction && rOwner!==null){
      ctx.strokeStyle = S.factions[rOwner].color;
      ctx.lineWidth = 3;
    } else {
      ctx.strokeStyle = '#5e4c34';
      ctx.lineWidth = 1.2;
    }
    ctx.stroke();
  });
}
function hexA(hex, alpha){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

/* ===== ĐỊA HÌNH ===== */
function drawTerrainTo(ctx){
  S.regions.forEach(r=>{
    if(r.poly.length<3) return;
    ctx.save();
    polygonPath(ctx, r.poly);
    ctx.clip();
    const bbox = bboxOf(r.poly);
    let baseCol = null;
    if(r.terrain==='mountains') baseCol = '#c8b898';
    else if(r.terrain==='hills') baseCol = '#d0c098';
    else if(r.terrain==='forest') baseCol = '#a8b888';
    else if(r.terrain==='marsh') baseCol = '#b8c0a0';
    else if(r.terrain==='coast') baseCol = '#d8cca8';
    if(baseCol){
      ctx.fillStyle = baseCol;
      ctx.globalAlpha = 0.3;
      ctx.fillRect(bbox.x, bbox.y, bbox.w, bbox.h);
      ctx.globalAlpha = 1;
    }
    const rnd = seededRnd(r.id*9973 + 17);
    const n = r.terrain==='mountains' ? 5 : r.terrain==='forest' ? 8 : 4;
    for(let i=0;i<n;i++){
      const px = bbox.x + rnd()*bbox.w;
      const py = bbox.y + rnd()*bbox.h;
      const s = 0.8 + rnd()*0.6;
      drawTerrainFeature(ctx, r.terrain, px, py, s, rnd);
    }
    ctx.restore();
  });
}
function bboxOf(poly){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  poly.forEach(p=>{ if(p.x<x0)x0=p.x; if(p.y<y0)y0=p.y; if(p.x>x1)x1=p.x; if(p.y>y1)y1=p.y; });
  return {x:x0, y:y0, w:x1-x0, h:y1-y0};
}
function drawTerrainFeature(ctx, terrain, x, y, s, rnd){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(s,s);

  if(terrain==='mountains'){
    const n = 3 + Math.floor(rnd()*3);
    for(let k=0;k<n;k++){
      const ox = (k - (n-1)/2) * 12;
      const h = 18 + rnd()*10;
      ctx.fillStyle='#7a6a5a';
      ctx.beginPath();
      ctx.moveTo(ox, -h);
      ctx.lineTo(ox - 10, 0);
      ctx.lineTo(ox, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#c8b898';
      ctx.beginPath();
      ctx.moveTo(ox, -h);
      ctx.lineTo(ox + 10, 0);
      ctx.lineTo(ox, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#f8f4e8';
      ctx.beginPath();
      ctx.moveTo(ox, -h);
      ctx.lineTo(ox - 2.5, -h + 5);
      ctx.lineTo(ox + 2.5, -h + 5);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#4a3a2a'; ctx.lineWidth=0.6;
      ctx.beginPath();
      ctx.moveTo(ox - 10, 0);
      ctx.lineTo(ox, -h);
      ctx.lineTo(ox + 10, 0);
      ctx.stroke();
    }
  } else if(terrain==='hills'){
    for(let k=0;k<2;k++){
      const ox = (k-1)*16;
      ctx.fillStyle='rgba(60,40,20,0.3)';
      ctx.beginPath(); ctx.arc(ox+2, 3, 12, Math.PI, Math.PI*2); ctx.fill();
      const g = ctx.createLinearGradient(0,-12,0,4);
      g.addColorStop(0,'#d0b888'); g.addColorStop(1,'#8a7345');
      ctx.fillStyle=g;
      ctx.beginPath(); ctx.arc(ox, 0, 12, Math.PI, Math.PI*2); ctx.fill();
      ctx.strokeStyle='#6a5230'; ctx.lineWidth=0.8; ctx.stroke();
      ctx.strokeStyle='#7a9a5a'; ctx.lineWidth=0.8;
      for(let i=0;i<4;i++){
        ctx.beginPath();
        ctx.moveTo(ox-8+i*5, -2);
        ctx.lineTo(ox-7+i*5, -8);
        ctx.stroke();
      }
    }
  } else if(terrain==='forest'){
    const n = 3 + Math.floor(rnd()*2);
    for(let k=0;k<n;k++){
      const ox = (k - n/2)*10 + rnd()*4;
      const oy = rnd()*4 - 2;
      ctx.fillStyle='#4a3a20';
      ctx.fillRect(ox-1.2, oy, 2.4, 10);
      ctx.fillStyle='#2a4a1a';
      ctx.beginPath();
      ctx.moveTo(ox, oy-18); ctx.lineTo(ox-9, oy+1); ctx.lineTo(ox+9, oy+1);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#5a8a3a';
      ctx.beginPath();
      ctx.moveTo(ox, oy-14); ctx.lineTo(ox-6, oy); ctx.lineTo(ox+6, oy);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#1a3a10'; ctx.lineWidth=0.6; ctx.stroke();
    }
  } else if(terrain==='marsh'){
    ctx.fillStyle='rgba(80,110,90,0.6)';
    ctx.beginPath(); ctx.ellipse(0, 0, 16, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(140,180,200,0.55)';
    ctx.beginPath(); ctx.ellipse(-2, -1, 10, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(-8,-2); ctx.lineTo(6,-2); ctx.stroke();
    ctx.strokeStyle='#7a9a5a'; ctx.lineWidth=1;
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.moveTo(-12+i*6, 6);
      ctx.lineTo(-11+i*6, -6);
      ctx.stroke();
    }
  } else if(terrain==='coast'){
    ctx.strokeStyle='rgba(150,200,220,0.7)'; ctx.lineWidth=1.2;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc(0, i*4, 12-i*3, Math.PI*0.9, Math.PI*2.1);
      ctx.stroke();
    }
  } else {
    ctx.strokeStyle='#7a9a5a'; ctx.lineWidth=1;
    for(let i=0;i<5;i++){
      const ox = (i-2)*5;
      ctx.beginPath();
      ctx.moveTo(ox, 4);
      ctx.lineTo(ox+1, -4);
      ctx.stroke();
    }
  }
  ctx.restore();
}

/* ===== SÔNG ===== */
function drawRivers(ctx){
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  RIVER_PATHS.forEach((path)=>{
    ctx.strokeStyle='#5a7a8a'; ctx.lineWidth=3.5;
    ctx.beginPath();
    path.forEach((p,k)=> k===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]));
    ctx.stroke();
    ctx.strokeStyle='#a8c8d8'; ctx.lineWidth=1.8;
    ctx.beginPath();
    path.forEach((p,k)=> k===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]));
    ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=0.6;
    ctx.beginPath();
    path.forEach((p,k)=> k===0?ctx.moveTo(p[0],p[1]):ctx.lineTo(p[0],p[1]));
    ctx.stroke();
  });
  ctx.restore();
}

function drawCastle(ctx, r, now){
  const isCap = r.capital;
  const level = Math.max(r.fort, isCap?3:1);
  const size = 0.35 + level*0.10;        // 0.45 / 0.55 / 0.65 thay vì 0.88 / 1.06 / 1.24

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size, size);

  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, 14, 22, 6, 0, 0, Math.PI*2); ctx.fill();

  const g = ctx.createLinearGradient(0,-14,0,14);
  g.addColorStop(0,'#d0b888'); g.addColorStop(1,'#8a7048');
  ctx.fillStyle = g;
  ctx.fillRect(-20, -6, 40, 18);
  ctx.strokeStyle='#5a4728'; ctx.lineWidth=1; ctx.strokeRect(-20,-6,40,18);

  ctx.fillStyle='#b8a070';
  for(let i=-20;i<20;i+=6) ctx.fillRect(i, -9, 4, 4);

  ctx.fillStyle='#c0a878';
  ctx.fillRect(-24, -14, 8, 26);
  ctx.fillRect(16, -14, 8, 26);
  ctx.strokeStyle='#5a4728';
  ctx.strokeRect(-24,-14,8,26); ctx.strokeRect(16,-14,8,26);

  ctx.fillStyle='#3a2a17';
  ctx.beginPath();
  ctx.moveTo(-5,12); ctx.lineTo(-5,2); ctx.arc(0,2,5,Math.PI,0); ctx.lineTo(5,12);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle='#6a3a2a';
  ctx.beginPath();
  ctx.moveTo(-28,-14);
  ctx.quadraticCurveTo(0,-26, 28,-14);
  ctx.lineTo(26,-17);
  ctx.quadraticCurveTo(0,-28,-26,-17);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#3a1a0a'; ctx.lineWidth=0.8; ctx.stroke();

  ctx.strokeStyle='#3a2a17'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, -32); ctx.stroke();

  if(isCap){
    ctx.fillStyle='#e8c15a';
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a = -Math.PI/2 + i*2*Math.PI/5;
      const a2 = a + Math.PI/5;
      const r1 = 5, r2 = 2;
      if(i===0) ctx.moveTo(Math.cos(a)*r1, -30 + Math.sin(a)*r1);
      else ctx.lineTo(Math.cos(a)*r1, -26 + Math.sin(a)*r1);
      ctx.lineTo(Math.cos(a2)*r2, -26 + Math.sin(a2)*r2);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ===== LỚP ĐỘNG ===== */
function drawAnimatedOverlay(ctx, now){
  ctx.save();
  ctx.globalAlpha = 0.10;
  ctx.strokeStyle = '#8a7a5a';
  ctx.lineWidth = 1.2;
  const t = now * 0.0003;
  for(let y=20;y<MAP_H;y+=28){
    ctx.beginPath();
    for(let x=0;x<MAP_W;x+=12){
      const yy = y + Math.sin(x*0.025 + y*0.05 + t*3)*3;
      if(x===0) ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.5;
  S.regions.forEach(r=>{
    if(r.terrain==='coast' && r.poly.length>=3){
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1.5 + Math.sin(now*0.004 + r.id)*0.5;
      polygonPath(ctx, r.poly);
      ctx.stroke();
    }
  });
  ctx.restore();

  const byName={}; S.regions.forEach(r=>byName[r.name]=r);
  SEA_ROUTES.forEach(([n1,n2], idx)=>{
    const A=byName[n1], B2=byName[n2];
    if(!A||!B2) return;
    if(A.terrain!=='coast' && B2.terrain!=='coast') return;
    const tt = ((now*0.00008 + idx*0.13) % 1);
    const px = A.x + (B2.x-A.x)*tt;
    const py = A.y + (B2.y-A.y)*tt;
    drawSailboat(ctx, px, py, now, idx);
  });
}
function drawSailboat(ctx, x, y, now, seed){
  const bob = Math.sin(now*0.002 + seed)*1.5;
  const dir = Math.cos(now*0.001 + seed)*0.2;
  ctx.save();
  ctx.translate(x, y+bob);
  ctx.rotate(dir);
  ctx.fillStyle='#5a3a1a';
  ctx.beginPath();
  ctx.ellipse(0, 0, 6, 2.2, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle='#3a2a17'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(0,-6); ctx.lineTo(0,1); ctx.stroke();
  ctx.fillStyle='#f0e6cc';
  ctx.beginPath();
  ctx.moveTo(0, -6); ctx.lineTo(6, -1); ctx.lineTo(0, 1); ctx.closePath();
  ctx.fill();
  ctx.strokeStyle='#8a7048'; ctx.lineWidth=0.4; ctx.stroke();
  ctx.restore();
}

function drawSeasonFX(ctx, now){
  const s = S.season;
  ctx.save();
  const t = now*0.001;
  if(s===0){
    ctx.fillStyle = 'rgba(255,180,200,0.85)';
    for(let i=0;i<50;i++){
      const sx = ((i*137 + t*15) % (MAP_W+40)) - 20;
      const sy = ((i*79 + t*25 + Math.sin(t+i)*20) % (MAP_H+40)) - 20;
      ctx.beginPath(); ctx.arc(sx, sy, 2, 0, Math.PI*2); ctx.fill();
    }
  } else if(s===1){
    ctx.globalAlpha = 0.08;
    const g = ctx.createRadialGradient(MAP_W*0.3, MAP_H*0.15, 20, MAP_W*0.3, MAP_H*0.15, MAP_W*0.7);
    g.addColorStop(0,'#fff8c0'); g.addColorStop(1,'rgba(255,248,192,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,MAP_W,MAP_H);
  } else if(s===2){
    ctx.fillStyle = 'rgba(200,140,50,0.8)';
    for(let i=0;i<40;i++){
      const sx = ((i*151 + t*10 + Math.sin(t+i)*15) % (MAP_W+40)) - 20;
      const sy = ((i*83 + t*20) % (MAP_H+40)) - 20;
      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate((t+i)*0.5);
      ctx.beginPath(); ctx.ellipse(0,0,3,1.5,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  } else {
    ctx.fillStyle = 'rgba(240,245,255,0.9)';
    for(let i=0;i<70;i++){
      const sx = ((i*131 + Math.sin(t*0.7+i)*25 + t*6) % (MAP_W+40)) - 20;
      const sy = ((i*97 + t*30) % (MAP_H+40)) - 20;
      ctx.beginPath(); ctx.arc(sx, sy, 2 + (i%3)*0.5, 0, Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

function drawArmyBanner(ctx, army, now){
  const r = S.regions[army.region];
  if(!r) return;
  const isPlayer = army.faction === S.playerFaction;
  const col = S.factions[army.faction] ? S.factions[army.faction].color : '#888';
  const cx = r.x + 26, cy = r.y + 20;
  let dx = 0, dy = 0;
  if(army._fromRegion !== undefined && army._moveT !== undefined){
    const dt = performance.now() - army._moveT;
    if(dt < 400){
      const from = S.regions[army._fromRegion];
      if(from){
        const k = 1 - dt/400;
        dx = (from.x - r.x)*k;
        dy = (from.y - r.y)*k;
      }
    } else { army._fromRegion = undefined; army._moveT = undefined; }
  }
  const bx = cx + dx, by = cy + dy;
  if(army._moveT && performance.now()-army._moveT < 400){
    ctx.save();
    ctx.globalAlpha = 0.5 * (1 - (performance.now()-army._moveT)/400);
    ctx.fillStyle = '#8a7048';
    for(let i=0;i<5;i++){
      ctx.beginPath();
      ctx.arc(bx - 12 + i*6, by + 12, 3+i*0.5, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();
  }
  ctx.save();
  ctx.globalAlpha = army.moved ? 0.55 : 1;
  ctx.strokeStyle = '#3a2a17';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(bx, by - 22);
  ctx.lineTo(bx, by + 8);
  ctx.stroke();
  const wave = Math.sin(now*0.005 + army.id)*1.5;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(bx, by - 22);
  ctx.lineTo(bx + 14 + wave, by - 16);
  ctx.lineTo(bx + 14 + wave, by - 8);
  ctx.lineTo(bx, by - 6);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = isPlayer ? '#fff' : '#1a120a';
  ctx.lineWidth = isPlayer ? 1.8 : 1;
  ctx.stroke();
  ctx.fillStyle = isPlayer ? '#fff8d8' : '#f0e0c0';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(String(army.units.length), bx + 7, by - 14);
  const main = army.units[0];
  if(main){
    ctx.font = '9px serif';
    ctx.fillText(UNIT_TYPES[main.type].icon, bx + 7, by - 4);
  }
  if(army.moved){
    ctx.fillStyle = '#c9b183';
    ctx.beginPath(); ctx.arc(bx + 12, by - 24, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a2a17';
    ctx.font = 'bold 8px sans-serif';
    ctx.fillText('✓', bx + 12, by - 24);
  }
  ctx.restore();
}

function drawCastleFlags(ctx, now){
  S.regions.forEach(r=>{
    if(r.fort<=0 && !r.capital) return;
    if(r.owner===null) return;
    const col = S.factions[r.owner].color;
    const x = r.x, y = r.y - 5 - (0.35 + Math.max(r.fort, r.capital?3:1)*0.10)*32;
    const wave = Math.sin(now*0.005 + r.id)*1.8;
    ctx.save();
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + 7 + wave, y + 3);
    ctx.lineTo(x + 7 + wave, y + 6);
    ctx.lineTo(x, y + 9);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle='#1a120a'; ctx.lineWidth=0.8; ctx.stroke();
    ctx.restore();
  });
}

function drawHoverAndSelection(ctx, now){
  if(hoverRegion !== null && S.regions[hoverRegion]){
    const r = S.regions[hoverRegion];
    if(r.poly.length>=3){
      polygonPath(ctx, r.poly);
      const pulse = 0.5 + 0.4*Math.sin(now*0.006);
      ctx.strokeStyle = `rgba(255,225,120,${pulse})`;
      ctx.lineWidth = 3.5;
      ctx.setLineDash([6,4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  if(S.selected !== null && S.regions[S.selected]){
    const r = S.regions[S.selected];
    if(r.poly.length>=3){
      polygonPath(ctx, r.poly);
      const pulse = 0.7 + 0.3*Math.sin(now*0.008);
      ctx.strokeStyle = `rgba(255,220,80,${pulse})`;
      ctx.lineWidth = 4.5;
      ctx.stroke();
    }
  }
  if(lastCaptureFlash){
    const dt = now - lastCaptureFlash.t;
    if(dt < 1200){
      const r = S.regions[lastCaptureFlash.regionId];
      if(r && r.poly.length>=3){
        const k = dt/1200;
        const rad = k * Math.max(MAP_W, MAP_H)*0.15;
        ctx.save();
        ctx.globalAlpha = (1-k)*0.75;
        const g = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, rad);
        g.addColorStop(0, hexA(lastCaptureFlash.color, 0.9));
        g.addColorStop(1, hexA(lastCaptureFlash.color, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(r.x, r.y, rad, 0, Math.PI*2); ctx.fill();
        ctx.restore();
      }
    } else { lastCaptureFlash = null; }
  }
}

function render(){
  if(!S) return;
  const dpr = mapView.dpr||1, ctx = mapCtx;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,mapCv.width,mapCv.height);

  buildStaticMap();

  ctx.setTransform(dpr*mapView.scale,0,0,dpr*mapView.scale,dpr*mapView.ox,dpr*mapView.oy);

  if(mapStaticCache){
    ctx.drawImage(mapStaticCache, 0, 0, MAP_W, MAP_H);
  }

  if(GAME_SETTINGS.weather){
    const tint = SEASON_TINT[S.season];
    ctx.fillStyle = `rgba(${tint.r},${tint.g},${tint.b},${tint.a})`;
    ctx.fillRect(0,0,MAP_W,MAP_H);
  }

  const now = performance.now();

  if(GAME_SETTINGS.weather) drawAnimatedOverlay(ctx, now);
  if(GAME_SETTINGS.weather) drawSeasonFX(ctx, now);
  drawCastleFlags(ctx, now);
  drawHoverAndSelection(ctx, now);

  const zoom = mapView.scale / mapView.fitScale;
  const far = zoom < 1.05;

  S.regions.forEach(r=>{
    if(r.poly.length<3) return;
    drawRegionLabel(ctx, r, far, now);
  });

  S.armies.forEach(a=>drawArmyBanner(ctx, a, now));

  if(selArmy){
    const from = S.regions[selArmy.region];
    from.neighbors.forEach(nid=>{
      const r = S.regions[nid];
      if(!r.poly.length) return;
      const hostile = r.owner!==null && r.owner!==selArmy.faction;
      ctx.strokeStyle = hostile ? '#ff5252' : '#41d5ff';
      ctx.lineWidth = 4;
      ctx.setLineDash([9,6]);
      polygonPath(ctx, r.poly);
      ctx.stroke();
      ctx.setLineDash([]);
    });
  }

  const pFid = S.playerFaction;
  const visible = new Set();
  S.regions.forEach(r=>{ if(r.owner===pFid){ visible.add(r.id); r.neighbors.forEach(n=>visible.add(n)); }});
  S.regions.forEach(r=>{
    if(visible.has(r.id)) return;
    if(r.poly.length<3) return;
    polygonPath(ctx, r.poly);
    ctx.strokeStyle='rgba(60,50,40,0.4)';
    ctx.lineWidth=1;
    ctx.stroke();
  });

  updateTopbar();
  renderSide();
  renderMinimap();
}
function drawRegionLabel(ctx, r, far, now){
  ctx.textAlign='center'; ctx.textBaseline='middle';
  const z = zoom0();

  // Cỡ chữ nhỏ hơn: 8–11px thay vì 9–15px
  const fs = clamp(11 / Math.max(1, z*0.75), 5, 6);
  const px = r.x, py = r.y - 2;

  // Viền mờ bao quanh chữ (thay vì hộp đục hoàn toàn)
  ctx.font = `700 ${fs}px "Palatino Linotype", Georgia, serif`;
  const textW = ctx.measureText(r.name).width;

  // Vẽ nền mờ chỉ khi zoom đủ lớn
  if(!far){
    ctx.fillStyle = 'rgba(50,35,20,0.45)';
    const padX = 4, padY = 2, h = fs + padY*2;
    roundRect(ctx, px - textW/2 - padX, py - h/2, textW + padX*2, h, 2);
    ctx.fill();
  }

  // Bóng chữ để nổi trên mọi nền
  ctx.lineWidth = 2;
  ctx.strokeStyle = far ? 'rgba(255,248,220,0.6)' : 'rgba(30,20,10,0.75)';
  ctx.strokeText(r.name, px, py);

  ctx.fillStyle = far ? '#2e2416' : '#f5e9cb';
  ctx.fillText(r.name, px, py);

  // Chi tiết nhỏ chỉ hiện khi zoom đủ lớn
  if(!far && z > 1.5){
    ctx.font = `${fs*0.85}px serif`;
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(30,20,10,0.7)';
    const sub = `🪙${r.gold}·🌾${r.food}`;
    ctx.strokeText(sub, px, py + fs + 3);
    ctx.fillStyle = '#f0e2c0';
    ctx.fillText(sub, px, py + fs + 3);
  }
}
function zoom0(){ return mapView.scale / mapView.fitScale; }
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function renderMinimap(){
  if(!miniCtx||!S)return;
  const cw=miniCv.width,ch=miniCv.height,sx=cw/MAP_W,sy=ch/MAP_H;
  miniCtx.setTransform(1,0,0,1,0,0);miniCtx.clearRect(0,0,cw,ch);
  miniCtx.fillStyle='#425261';miniCtx.fillRect(0,0,cw,ch);
  miniCtx.save();miniCtx.scale(sx,sy);
  LANDMASSES.forEach(m=>{const p=m.map(q=>({x:q[0],y:q[1]}));if(!polygonPath(miniCtx,p))return;miniCtx.fillStyle='#b7a273';miniCtx.fill();miniCtx.strokeStyle='#6e5b3f';miniCtx.lineWidth=2;miniCtx.stroke();});
  S.regions.forEach(r=>{
    if(!r.poly.length)return;
    polygonPath(miniCtx,r.poly);
    if(r.owner!==null){
      miniCtx.fillStyle=S.factions[r.owner].color;
      miniCtx.globalAlpha=0.85;
    } else {
      miniCtx.fillStyle='#d8c9a4';
      miniCtx.globalAlpha=0.6;
    }
    miniCtx.fill();
  });
  miniCtx.globalAlpha = 1;
  S.armies.forEach(a=>{const r=S.regions[a.region];if(!r)return;miniCtx.fillStyle=a.faction===S.playerFaction?'#fff':'#1d1820';miniCtx.beginPath();miniCtx.arc(r.x,r.y,6,0,Math.PI*2);miniCtx.fill();});
  const wrap=$('mapwrap'),vw=wrap.clientWidth/mapView.scale,vh=wrap.clientHeight/mapView.scale,vx=-mapView.ox/mapView.scale,vy=-mapView.oy/mapView.scale;
  miniCtx.strokeStyle='#ffe07a';miniCtx.lineWidth=6;miniCtx.strokeRect(vx,vy,vw,vh);miniCtx.restore();
}
function mapTooltipHTML(r){
  const owner=r.owner===null?'Độc lập':S.factions[r.owner].short;
  const army=S.armies.find(a=>a.region===r.id);
  return `<div class="ttTitle">${r.capital?'🏛 ':''}${r.name}</div><b>${owner}</b> · ${terrName(r.terrain)}<br>🪙 ${r.gold} · 🌾 ${r.food} · 🏰 ${r.fort||0}<br>🌾${r.farm||0}  ⚖️${r.market||0}${army?`<br>⚔ ${army.units.length} đơn vị · ${army.general.name}`:''}`;
}
function positionMapTooltip(clientX,clientY,r){
  const el=$('mapTooltip'),wrap=$('mapwrap').getBoundingClientRect();
  el.innerHTML=mapTooltipHTML(r);el.classList.add('show');
  const x=clientX-wrap.left+14,y=clientY-wrap.top+14;
  el.style.left=clamp(x,6,Math.max(6,wrap.width-290))+'px';el.style.top=clamp(y,6,Math.max(6,wrap.height-130))+'px';
}
function updateTopbar(){
  if(!S) return;
  const f = S.factions[S.playerFaction];
  $('uiYear').textContent = S.year;
  $('uiSeason').textContent = SEASONS[S.season];
  $('uiFaction').textContent = f.short;
  $('uiFlag').style.background = f.color;
  const inc = incomeOf(f), fn = inc.food-inc.upkeep;
  $('uiGold').textContent = Math.round(f.gold)+' (+'+inc.gold+')';
  $('uiFood').textContent = Math.round(f.food)+' ('+(fn>=0?'+':'')+fn+')';
  $('uiPrestige').textContent = Math.round(f.prestige);
  $('uiSeed').textContent = S.seed;
}
function setSideTab(tab){
  if(!S) return;
  S.sideTab=tab;
  renderSide();
}
function deselectArmy(){
  if(!S) return;
  selArmy=null;
  S.selected=null;
  S.sideTab='armies';
  sfx('click');
  render();
}
function selectArmyFromList(armyId){
  if(!S) return;
  const a=S.armies.find(x=>x.id===armyId&&x.faction===S.playerFaction);
  if(!a) return;
  if(selArmy && selArmy.id===a.id){
    deselectArmy();
    return;
  }
  selArmy=a;
  S.selected=a.region;
  S.sideTab='armies';
  sfx('click');
  const r=S.regions[a.region];
  if(r) centerMapOnWorld(r.x,r.y);
  render();
}
/* ========================= 10B. RENDER SIDEBAR (TABS) ========================= */
function checkCanRecruit(f){
  if(!selArmy) return false;
  const r = S.regions[selArmy.region];
  if(!r || r.owner !== S.playerFaction) return false;
  if(selArmy.units.length >= ARMY_CAP) return false;
  return ['spear','sword','archer','xbow','lcav','hcav','siege'].some(k=>{
    const c = unitCost(k);
    return f.gold>=c.g && f.food>=c.f;
  });
}

function renderSide(){
  if(!S) return;
  if(selArmy && !S.armies.some(a=>a.id===selArmy.id && a.faction===S.playerFaction)) selArmy=null;
  const f = S.factions[S.playerFaction];
  const tab = S.sideTab || 'overview';

  const unmovedCount = S.armies.filter(a=>a.faction===S.playerFaction && !a.moved).length;
  const canRecruit = checkCanRecruit(f);

  let h = '';
  // --- STICKY: tài nguyên + tabs ---
  h += `<div class="sideSticky">
    <div class="sideFactionBar">
      <span class="sfFlag" style="background:${f.color}"></span>
      <span class="sfName">${f.short}</span>
      <span class="sfStat">🪙${Math.round(f.gold)}</span>
      <span class="sfStat">🌾${Math.round(f.food)}</span>
      <span class="sfStat">👑${Math.round(f.prestige)}</span>
    </div>
    <div class="sideTabs">
      <button class="sideTab ${tab==='overview'?'active':''}" onclick="setSideTab('overview')" title="Tổng quan, cốt truyện, mục tiêu">
        <span class="tabIcon">📜</span>
        <span class="tabLabel">Tổng quan</span>
      </button>
      <button class="sideTab ${tab==='armies'?'active':''}" onclick="setSideTab('armies')" title="Quân đoàn của bạn">
        <span class="tabIcon">⚔</span>
        <span class="tabLabel">Quân đoàn</span>
        ${unmovedCount>0?`<span class="badge green">${unmovedCount}</span>`:''}
      </button>
      <button class="sideTab ${tab==='shop'?'active':''}" onclick="setSideTab('shop')" title="Tuyển quân">
        <span class="tabIcon">🏪</span>
        <span class="tabLabel">Tuyển quân</span>
        ${canRecruit?'<span class="badge gold">+</span>':''}
      </button>
    </div>
  </div>`;

  // --- CONTENT ---
  h += `<div class="sideContent">`;
  if(tab==='armies') h += renderArmyTab(f);
  else if(tab==='shop') h += renderShopTab(f);
  else h += renderOverviewTab(f);
  h += `</div>`;

  $('side').innerHTML = h;
}

/* ---------- TAB 1: TỔNG QUAN ---------- */
function renderOverviewTab(f){
  const chap = currentChapter();
  let h = '';

  h += `<div class="chapterBanner" style="border-left-color:${chap.color};background:linear-gradient(90deg,${chap.color}22,${chap.color}08)">
    <div class="cbTitle">${chap.icon} Chương ${chap.id}: ${chap.name}</div>
    <div class="cbIntro">${chap.intro}</div>
  </div>`;

  // Cốt truyện phe
  const arc = FACTION_ARCS[f.short];
  if(arc && S.factionArc){
    const stages = ['act1','act2','act3'];
    h += `<h3>📖 Cốt truyện phe</h3><div class="card storyCard">`;
    stages.forEach((st,i)=>{
      const a = arc[st];
      const done = i < S.factionArc.stage;
      const cur  = i === S.factionArc.stage;
      h += `<div class="storyStage ${done?'done':cur?'current':'locked'}">
        <span class="ssIcon">${done?'✅':cur?'▶':'🔒'}</span>
        <span class="ssBody"><b>${a.title}</b>
          ${cur?`<div class="hint">${a.goal}</div>`:done?`<div class="hint" style="text-decoration:line-through;opacity:.6">${a.goal}</div>`:''}
        </span>
      </div>`;
    });
    if(S.factionArc.done) h += `<div class="storyReward">🏆 ${arc.reward}</div>`;
    h += `</div>`;
  }

  // Danh khí
  if(S.legendaryItem){
    const it = LEGENDARY_ITEMS.find(x=>x.id===S.legendaryItem);
    if(it){
      h += `<div class="card itemCard">
        <span style="font-size:22px">${it.icon}</span>
        <div><b>${it.name}</b><div class="hint">${it.desc}</div></div>
      </div>`;
    }
  }

  // Mục tiêu
  h += `<h3>🎯 Mục tiêu</h3>`;
  S.objectives.forEach(o=>{
    const done = o.check();
    h += `<div class="card objCard ${done?'objDone':''}">
      <span class="objCheck">${done?'✅':'⬜'}</span> <span>${o.text}</span>
    </div>`;
  });

  // Vùng đang chọn
  if(S.selected!==null && S.regions[S.selected]){
    const r = S.regions[S.selected];
    const isMine = r.owner===S.playerFaction;
    const owner = r.owner===null?'Độc lập':S.factions[r.owner].short;
    h += `<h3>📍 ${r.name}${r.capital?' 🏛':''}</h3>
      <div class="card regionCard" ${isMine?`style="border-left:3px solid ${f.color}"`:''}>
        <div class="t">${owner}${r.capital?' · <span class="pill cap">THỦ ĐÔ</span>':''}</div>
        <div class="regionStats">
          <span class="pill">${terrName(r.terrain)}</span>
          <span class="pill">🪙 ${r.gold}</span>
          <span class="pill">🌾 ${r.food}</span>
          <span class="pill">🏰 ${r.fort||0}</span>
        </div>
        <div style="font-size:11px;margin-top:5px">
          🌾 Đồn điền ${r.farm||0}/3 · ⚖️ Thị trấn ${r.market||0}/3${r.terrain==='coast'?' ★':''}
        </div>
        ${r.garrison?`<div class="hint" style="color:#8b2e2e">⚔ Đồn trú ${r.garrison} (cung thủ núp thành)</div>`:''}
        ${isMine?regionActions(r):''}
      </div>`;
  } else {
    h += `<div class="emptyHint">💡 Click một vùng trên bản đồ để xem chi tiết và xây dựng.</div>`;
  }

  // Phe khác
  h += `<h3>🏳 Chư hầu</h3>`;
  S.factions.forEach(o=>{
    if(o.id===S.playerFaction || !o.alive) return;
    const rel = Math.round(f.relations[o.id]||0);
    const atWar = f.wars.includes(o.id);
    const allied = f.allies.includes(o.id);
    const relColor = rel>20?'#3f8f4a':rel<-20?'#8b2e2e':'#7a6242';
    h += `<div class="card factionMini" onclick="focusFactionCapital(${o.id})">
      <span style="display:inline-block;width:10px;height:10px;background:${o.color};border:1px solid #0006;border-radius:2px"></span>
      <b>${o.short}</b>
      ${atWar?'<span class="pill r">CHIẾN</span>':allied?'<span class="pill b">ĐỒNG MINH</span>':''}
      <div class="hint" style="margin-top:2px">
        Quan hệ <b style="color:${relColor}">${rel>0?'+':''}${rel}</b>
        · ${countRegions(o.id)} vùng · Sức mạnh ${Math.round(factionPower(o.id))}
      </div>
    </div>`;
  });

  // Nhật ký
  h += `<h3>📰 Nhật ký</h3>`;
  if(S.eventLog.length){
    S.eventLog.slice(0,6).forEach(e=>{
      h += `<div class="logEntry">Năm ${e.year}, ${SEASONS[e.season]}: ${e.text}</div>`;
    });
  } else {
    h += `<div class="hint">Chưa có sự kiện nào.</div>`;
  }
  return h;
}

/* ---------- TAB 2: QUÂN ĐOÀN ---------- */
function renderArmyTab(f){
  const myArmies = S.armies.filter(a=>a.faction===S.playerFaction);
  let h = '';
  h += `<div class="tabIntro">
    <b>⚔ Quân đoàn của bạn (${myArmies.length})</b>
    <div class="hint">Click để chọn — rồi click vùng kề bên trên bản đồ để hành quân.</div>
  </div>`;

  if(!myArmies.length){

      const T = UNIT_TYPES[k];
      const off = full || f.gold<costG || f.food<costF;
      const reason = full?'Quân đoàn đầy':f.gold<costG?'Thiếu vàng':f.food<costF?'Thiếu lương':'';
      h += `<div class="shopUnit ${off?'disabled':''}" title="${T.desc}${reason?' · '+reason:''}">

          <span class="suIcon">${T.icon}</span>
          <div>
            <div class="suName">${T.name}</div>
            <div class="suStats">⚔${T.atk} · 🛡${T.def}${T.range>1?' · 🏹'+T.range:''}</div>
          </div>
        </div>
        <button ${off?'disabled':''} onclick="recruit('${k}')">
          <span class="costGold">${costG}🪙</span>
          <span class="costFood">${costF}🌾</span>
        </button>
      </div>`;
    });
    h += `</div>`;
  });

  h += `<div class="hint" style="margin-top:8px;padding:6px;background:#00000006;border-radius:4px">
    💡 Đơn vị sống sót tích lũy XP, đạt 60 XP lên cấp. Tối đa ${ARMY_CAP} đơn vị.</div>`;
  return h;
}

function executeStrategicMove(a,r){
  if(!S || !a || !r) return;
  const from=S.regions[a.region];
  if(!from || !from.neighbors.includes(r.id)) return;
  captureUndo(`di chuyển quân đoàn ${a.general.name}`);
  if(S.season===3&&S.factions[S.playerFaction].trait!=='rus'&&chance(0.4)){
    toast('Mùa đông khắc nghiệt: quân đội di chuyển chậm và hao tổn.');
    if(a.units.length>1&&chance(0.35))a.units.pop();
  }
  a.moved=true; const orig=from.id;
  a._fromRegion=orig; a._moveT=performance.now();
  if(r.owner===S.playerFaction&&!S.armies.some(x=>x.region===r.id&&x.faction!==a.faction)){
    a.region=r.id;S.selected=r.id;render();return;
  }
  a.region=orig;
  resolveArmyMove(a,r,false).then(()=>{
    if(S.armies.includes(a)){ selArmy=a; S.selected=a.region; }
    render(); updateUndoButton();
  });
}
function armyAtWorld(x,y){
  if(!S || !S.armies) return null;
  let hit = null;
  let best = Infinity;

  S.armies.forEach(a=>{
    const r = S.regions[a.region];
    if(!r) return;
    let bx = r.x + 26, by = r.y + 20;
    if(a._fromRegion !== undefined && a._moveT !== undefined){
      const dt = performance.now() - a._moveT;
      if(dt < 400){
        const from = S.regions[a._fromRegion];
        if(from){
          const k = 1 - dt/400;
          bx += (from.x - r.x) * k;
          by += (from.y - r.y) * k;
        }
      }
    }
    const hx = bx + 7, hy = by - 14;
    const dist = Math.hypot(x - hx, y - hy);
    if(dist <= 23 && dist < best){
      best = dist;
      hit = a;
    }
  });

  return hit;
}

function selectArmyOnMap(a){
  if(!S || !a || a.faction!==S.playerFaction) return false;
  selArmy = a;
  S.selected = a.region;

  sfx('click');

  const r = S.regions[a.region];
  if(r) centerMapOnWorld(r.x, r.y);

  render();
  return true;
}

mapCv.addEventListener('click',e=>{
  if(!S||S.over)return;
  if(Math.hypot(e.clientX-mapView.sx,e.clientY-mapView.sy)>6)return;
  const rect=mapCv.getBoundingClientRect();
  const w=toWorld(e.clientX-rect.left,e.clientY-rect.top);

  
  const clickedArmy = armyAtWorld(w.x,w.y);
  if(clickedArmy && clickedArmy.faction===S.playerFaction){
    selectArmyOnMap(clickedArmy);
    return;
  }

  const r=regionAt(w.x,w.y);
  if(!r){deselectArmy();return;}

  const armyInRegion = S.armies.find(a=>a.region===r.id && a.faction===S.playerFaction);
  if(!selArmy && armyInRegion){
    selectArmyOnMap(armyInRegion);
    return;
  }

  if(selArmy){
    if(r.id===selArmy.region){deselectArmy();return;}
    const friendlyOccupied=S.armies.find(a=>a.region===r.id&&a.faction===S.playerFaction&&a.id!==selArmy.id);
    if(friendlyOccupied){
      selectArmyOnMap(friendlyOccupied);
      return;
    }
    const from=S.regions[selArmy.region];
    if(from.neighbors.includes(r.id)){
      if(selArmy.moved){toast('Quân đoàn này đã hành quân trong lượt này.');return;}
      const isHostileTarget = r.owner!==S.playerFaction;
      if(isHostileTarget){
        const enemy = S.armies.find(x=>x.region===r.id&&x.faction!==S.playerFaction&&x.units.length>0);
        const atkPower = armyPower(selArmy);
        const defPower = enemy ? armyPower(enemy) : Math.max(20,(r.garrison||0)*30 + (r.fort||0)*18);
        const ratio = defPower>0 ? atkPower/defPower : 99;
        const verdict = ratio>=1.25?'Ưu thế rõ':ratio>=0.95?'Cân sức':'Bất lợi';
        const garrisonNote = !enemy && ((r.garrison||0)>0 || r.fort>0) ? '<div class="hint" style="margin-top:5px">⚔ Đồn trú: toàn bộ lính phòng thủ sẽ biến thành cung thủ ẩn trong thành — phát bắn đầu +30% sát thương.</div>' : '';
        showDangerousAction(`Tấn công ${r.name}`, `<b>${selArmy.general.name}</b> sẽ giao chiến tại <b>${r.name}</b>.<br>
          Dự đoán: <b>${verdict}</b> · Lực chiến ${Math.round(atkPower)} vs ${Math.round(defPower)} · Tỉ lệ lực ${Math.round(ratio*100)}%.
          ${garrisonNote}
          <div class="hint" style="margin-top:5px">Đây chỉ là dự đoán chiến lược; địa hình, tướng và diễn biến chiến trường vẫn có thể thay đổi kết quả.</div>`,
          ()=>executeStrategicMove(selArmy,r));
        return;
      }
      executeStrategicMove(selArmy,r);
      return;
    }
    S.selected=r.id;render();return;
  }

  S.selected=r.id;
  if(!selArmy) S.sideTab='overview';
  render();
});

function toast(msg){

    z-index:200;font-size:13px;max-width:80%;text-align:center;box-shadow:0 4px 16px #000a;`;

function openDiplomacy(){

  let h = `<h2>🤝 Ngoại Giao</h2>`;

          chron(`${me.short} và ${o.short} ký kết liên minh.`); toast('Liên minh được thiết lập!'); }

      b.textContent = 'Tuyên chiến (-15 uy tín)';

      btns.appendChild(b);

      const b = document.createElement('button');

        if(me.gold<25){ toast('Không đủ vàng.'); return; }

        closeModal(); render();
      };
      btns.appendChild(b);
    }

    b3.onclick = ()=>{
      if(me.gold<30){ toast('Không đủ vàng.'); return; }

      me.relations[o.id]+=25; o.relations[me.id]+=25;
      chron(`Liên hôn giữa ${me.short} và ${o.short} củng cố quan hệ.`);

      closeModal(); render();
    };

function checkObjectives(){
  if(S.over) return;
  const all = S.objectives.every(o=>o.check());
  if(all){ win(`Hoàn thành tất cả mục tiêu của ván đấu!`); return; }
  const totalRegions = S.regions.length;
  if(countRegions(S.playerFaction) >= Math.ceil(totalRegions*0.5)){
    win('Bạn đã thống trị hơn nửa Trung Nguyên!');
  }
}
function checkGameOver(){
  if(S.over || !S) return;
  const f = S.factions[S.playerFaction];
  const myRegions = countRegions(S.playerFaction);
  const myArmies = S.armies.filter(a=>a.faction===S.playerFaction && a.units.length>0);
  if(myRegions===0 && myArmies.length===0){ lose('Bạn đã mất toàn bộ lãnh thổ và quân đội.'); return; }
  if(f.stability<=0){ lose('Nội loạn bùng nổ, cơ nghiệp sụp đổ.'); return; }
}
function win(msg){ S.over = true; showEnd('🏆 CHIẾN THẮNG', msg); }
function lose(msg){ S.over = true; showEnd('💀 THẤT BẠI', msg); }
function showEnd(title, msg){
  const f = S.factions[S.playerFaction];
  let h = `<h2>${title}</h2><p>${msg}</p>`;
  h += `<div class="card"><div class="t">Thống kê ván đấu</div>
    Seed: ${S.seed}<br>
    Năm kết thúc: ${S.year}<br>
    Lãnh thổ: ${countRegions(S.playerFaction)} vùng<br>
    Vàng: ${Math.round(f.gold)} · Uy tín: ${Math.round(f.prestige)}<br>
    Quân đoàn còn lại: ${S.armies.filter(a=>a.faction===S.playerFaction).length}
  </div>`;
  h += `<h3>Biên niên sử toàn ván</h3><div style="max-height:320px;overflow-y:auto">`;
  S.chronicle.forEach(c=>{
    h += `<div class="chr"><span class="yr">Năm ${c.year}, ${SEASONS[c.season]}:</span> ${c.text}</div>`;
  });
  if(!S.chronicle.length) h += `<p class="hint">Không có ghi chép.</p>`;
  h += `</div>`;
  h += `<div class="choices"><button class="pri" id="restartBtn">Chơi ván mới</button></div>`;
  $('endPanel').innerHTML = h;
  $('endOv').classList.remove('hidden');
  $('restartBtn').onclick = ()=>{ $('endOv').classList.add('hidden'); openStart(); };
}

/* ========================= 14. KHỞI ĐỘNG ========================= */
function openStart(){
  const seedDefault = Math.floor(Math.random()*1e9);
  let h = `<h2>⚔ Tam Quốc Trung Hoa</h2>
    <p>Trung Nguyên, năm 190 CN. Đổng Trác khống chế thiên tử, tàn phá Lạc Dương.
    Chư hầu bốn phương nổi dậy thảo phạt. Hãy chọn một phe phái và viết nên cơ nghiệp của riêng bạn.</p>
    <p class="hint">Bản mở rộng: biên giới Weighted Voronoi · đồn trú cung thủ núp thành ·
    quy mô ×4 (32 đơn vị/quân đoàn, chiến trường 24×16) · cung/nỏ đứng sau bộ binh ·
    chủ tướng mạnh nhưng chậm.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px">
      <button class="pri" onclick="continueAutosave()" ${hasAutosave()?'':'disabled'}>▶ Tiếp tục</button>
      <button onclick="renderSaveManager()">💾 Quản lý lưu</button>
      <button onclick="openSettings()">⚙ Cài đặt</button>
      <label>Seed: <input id="seedInput" type="number" value="${seedDefault}" style="width:150px;padding:6px;border:1px solid #b8a57e;border-radius:4px;background:#fff8e5;font-family:inherit"></label>
      <label>Độ khó:
        <select id="diffInput" style="padding:6px;border:1px solid #b8a57e;border-radius:4px;background:#fff8e5;font-family:inherit">
          <option value="0">Dễ</option>
          <option value="1" selected>Thường</option>
          <option value="2">Khó</option>
        </select>
      </label>
      <label style="display:flex;align-items:center;gap:5px"><input id="autoBattleInput" type="checkbox"> Auto-play cả trận đánh</label>
    </div>
    <h3 style="margin-top:14px;color:#5a3f1e">Chọn phe phái của bạn</h3>
    <div class="factions" id="factionPick"></div>`;
  $('startPanel').innerHTML = h;
  $('startOv').classList.remove('hidden');
  const box = $('factionPick');
  FACTION_DEFS.forEach((d,i)=>{
    const el = document.createElement('div');
    el.className='fcard';
    el.innerHTML = `<div class="fn"><span class="sw" style="background:${d.color}"></span>${d.name}</div>
      <div class="fd">Chúa công ${d.king}<br>${d.desc}</div>`;
    el.onclick = ()=>{
      const seed = parseInt($('seedInput').value)||1;
      const diff = parseInt($('diffInput').value)||1;
      const autoB = $('autoBattleInput').checked;
      $('startOv').classList.add('hidden');
      startNewGame(seed, i, diff, autoB);
    };
    box.appendChild(el);
  });
}
function startNewGame(seed, factionIdx, diff, autoB){
  selArmy = null; hoverRegion = null; B = null;
  initGame(seed, factionIdx, diff);
  S.autoBattlePreference = !!autoB;
  undoSnapshot=null;
  mapView.userZoom=false;
  resizeMap();
  render();
  autosaveGame();
  updateUndoButton();
  setTimeout(()=>{
    showModal(`
      <h2>📖 Hướng dẫn nhanh</h2>
      <p><b>Bản đồ chiến lược:</b> Mở tab <b>⚔ Quân đoàn</b> và click vào quân đoàn trong danh sách bên phải để chọn.
      Sau đó click vào vùng kề bên trên bản đồ (viền xanh = di chuyển, viền đỏ = giao chiến).</p>
      <p><b>🏗 Công trình (khi chọn vùng của bạn):</b></p>
      <ul style="margin-left:18px;line-height:1.55">
        <li>🌾 <b>Đồn điền</b> — cung cấp lương thực.</li>
        <li>⚖️ <b>Thị trấn</b> — tăng vàng (ven biển +50%).</li>
        <li>🏰 <b>Quan ải</b> — tăng phòng thủ, HP cổng thành.</li>
        <li>🏛 <b>Đặt thủ đô (80🪙)</b> — +50% thu nhập toàn quốc.</li>
      </ul>
      <p><b>Chiến trường:</b> Lưới 24×16. Quân đoàn tối đa <b>32 đơn vị</b> xếp 3 cột.
      Click đơn vị để chọn (ô xanh = đi, ô đỏ = đánh). Đánh sườn +25%, sau lưng +50%. Kỹ năng hồi 3 lượt.</p>
      <p><b>🏹 Cung/nỏ:</b> Chỉ đi 1 ô/lượt và <b>không thể vượt qua tiền tuyến bộ binh đồng minh</b> —
      luôn ở hàng sau. Nhược điểm: nếu bị kỵ binh vòng ra sau sẽ rất khó thoát.</p>
      <p><b>👑 Chủ tướng:</b> HP 250, ATK 55, DEF 28, sĩ khí 160 — mạnh nhất chiến trường nhưng
      chỉ đi 2 ô/lượt. Kỹ năng "Hiệu triệu" hồi 40 sĩ khí +10 HP cho đồng minh trong bán kính 3.</p>
      <p><b>🏯 Đồn trú:</b> Khi tấn công vùng không có quân đoàn địch, toàn bộ lính phòng thủ
      biến thành cung thủ núp trong thành — phát bắn đầu +30%. Mang máy bắn đá để phá cổng nhanh!</p>
      <p><b>⚡ Nhịp trận:</b> Thanh Momentum 0–100 mỗi bên. Đầy → Tổng tấn công (+15% ATK 1 lượt).</p>
      <p><b>🎮 Auto-play 2 phe (A):</b> Bấm <b>▶ Tự động 2 phe</b> hoặc phím <b>A</b>.</p>
      <p><b>Phím tắt:</b> Space = kết thúc lượt · Esc = hủy chọn · Tab = quân đoàn kế · C = biên niên sử · A = bật/tắt auto-play.</p>
      <div class="choices"><button class="pri" onclick="closeModal()">Bắt đầu trị vì!</button></div>
    `);
  }, 200);
}

/* ========================= 15. SỰ KIỆN ========================= */
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && (e.key==='s'||e.key==='S')){ e.preventDefault(); if(S&&!B) renderSaveManager(); return; }
  if((e.ctrlKey||e.metaKey) && (e.key==='z'||e.key==='Z')){ e.preventDefault(); if(S&&!B) undoAction(); return; }
  if((e.ctrlKey||e.metaKey) && (e.key==='l'||e.key==='L')){ e.preventDefault(); if(S&&!B) renderSaveManager(); return; }
  if(!S) return;
  if(e.key===' '){ e.preventDefault(); if(B){ if(B.active&&B.turn===B.humanSide&&!B.autoPlay) battleNextTurn(); } else if(!S.over) endPlayerTurn(); }
  else if(e.key==='Escape'){
    if(B){ if(B.humanSkillPending){ B.humanSkillPending=null; B.infoDirty=true; } else { B.selected=null; B.infoDirty=true; } }
    else { selArmy=null; S.selected=null; render(); }
  }
  else if(e.key==='Tab'){
    e.preventDefault();
    if(B) return;
    const my = S.armies.filter(a=>a.faction===S.playerFaction && !a.moved);
    if(!my.length) return;
    const idx = my.findIndex(a=>selArmy&&a.id===selArmy.id);
    selArmy = my[(idx+1)%my.length];
    S.selected = selArmy.region;
    S.sideTab = 'armies';
    render();
  }
  else if(e.key==='c'||e.key==='C'){ if(S && !B) openChronicle(); }
  else if(e.key==='a'||e.key==='A'){ if(B && B.active){ toggleAutoPlay(); } }
  else if(!B && (e.key==='+'||e.key==='=')){ const w=$('mapwrap'); setMapZoom(mapView.scale*1.16,w.clientWidth/2,w.clientHeight/2); }
  else if(!B && (e.key==='-'||e.key==='_')){ const w=$('mapwrap'); setMapZoom(mapView.scale*.86,w.clientWidth/2,w.clientHeight/2); }
  else if(!B && (e.key==='0')){ fitMapView(); render(); }
});
$('btnEnd').onclick = ()=>{ if(!B && S && !S.over) endPlayerTurn(); };
$('btnChronicle').onclick = ()=>{ if(S) openChronicle(); };
$('btnDiplo').onclick = ()=>{ if(S && !S.over) openDiplomacy(); };
$('btnSave').onclick = ()=>{ if(S) renderSaveManager(); else openStart(); };
$('btnSettings').onclick = ()=>openSettings();
$('btnUndo').onclick = ()=>undoAction();
$('btnSound').onclick = ()=>{ soundOn = !soundOn; applyGameSettings(); };
window.addEventListener('resize', ()=>{ if(S) resizeMap(); if(B) setupBattleCanvas(); });
applyGameSettings();

/* ========================= 16. KHỞI ĐỘNG ========================= */
openStart();
</script>
