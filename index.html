  {id:'fog',       name:'🌫 Sương dày', text:'Sương dày đặc bất chợt bao phủ.'}
];

function moraleState(u){
  const r = u.mor / Math.max(1,u.maxMor);
  if(r > 0.6) return 'steady';
  if(r > 0.3) return 'wavering';
  return 'panic';
}
function moraleAtkMod(u){
  const st = moraleState(u);
  if(st==='wavering') return -0.15;
  if(st==='panic') return -0.30;
  return 0;
}
function terrainFromRegion(r){
  const g = [];
  for(let y=0;y<BH;y++){
    g.push([]);
    for(let x=0;x<BW;x++){
      let t='plain';
      if(r.terrain==='forest' && chance(0.35)) t='forest';
      else if(r.terrain==='hills' && chance(0.3)) t='hill';
      else if(r.terrain==='mountains' && chance(0.35)) t='hill';
      else if(r.terrain==='marsh' && chance(0.4)) t='marsh';
      else if(chance(0.05)) t='forest';
      g[y].push(t);
    }
  }
  return g;
}
function makeBattleUnit(su, side, x, y, opts){
  const T = UNIT_TYPES[su.type];
  const fid = side===0 ? opts.attacker : opts.defender;
  const gb = opts.genBonus || {atk:0,def:0,mor:0};
  let morBase = T.mor + (gb.mor||0);
  if(side===1 && fid>=0 && S.factions[fid] && S.factions[fid].trait==='reconq') morBase *= 1.15;
  let hp = su.hp || T.hp;
  let maxHp = su.maxHp || T.hp;
  if(fid>=0 && S.factions[fid] && S.factions[fid].trait==='viking' && !T.cav && !T.siege){
    maxHp = Math.round(maxHp*1.1);
    hp = Math.min(hp, maxHp);
  }
  const lv = su.level||1;
  maxHp = Math.round(maxHp * (1 + (lv-1)*0.08));
  hp = Math.round(hp * (1 + (lv-1)*0.08));
  return {
    id: 0, side, type: su.type,
    x, y, px: x*CS, py: y*CS,
    facing: side===0 ? 0 : 2,
    hp, maxHp, mor: Math.round(morBase), maxMor: Math.round(morBase),
    hasMoved:false, hasActed:false, fled:false, fade:1,
    skillCd: 0, buffs: [],
    attackedCount:0, chargeDist:0,
    lungeT: 0, lungeDir: [0,0],
    hitFlash: 0,
    level: lv, xp: su.xp||0,
    srcRef: su, gen: null,
    hidden: false, inFort:false, xpEarned: 0, walkPhase: R()*Math.PI*2, lastX: x, lastY: y
  };
}

function startBattle(attackerArmy, defenderArmy, region, opts){
  opts = opts||{};
  const atkF = attackerArmy.faction;
  const defF = defenderArmy ? defenderArmy.faction : (region.owner!==null?region.owner:-1);
  const grid = terrainFromRegion(region);
  const weather = rollWeather();
  const fieldBattle = !!defenderArmy && !defenderArmy.isGarrison;

  const wall = [];
  for(let y=0;y<BH;y++) wall.push(new Array(BW).fill(0));
  let gate = null;
  const hasFort = !fieldBattle && region.fort > 0;
  if(hasFort){
    const wx = Math.floor(BW*0.62);
    const gy = Math.floor(BH/2) + ri(-1,1);
    for(let y=0;y<BH;y++){
      wall[y][wx] = (y===gy) ? (60 + region.fort*40) : 1;
    }
    gate = { x:wx, y:gy, hp:300 + region.fort*40, maxHp:60 + region.fort*40 };
  }

  B = {
    active:true,
    grid, wall, gate, hasFort,
    fire: Array.from({length:BH},()=>Array(BW).fill(0)),
    weather,
    windDir: pick([[1,0],[-1,0],[0,1],[0,-1]]),
    units: [],
    turn: 0, round: 1,
    attacker: atkF, defender: defF,
    region, attackerArmy, defenderArmy,
    fieldBattle,
    fortLevel: region.fort,
    selected: null,
    log: [], fx: [], projectiles: [],
    shake: { amt: 0 },
    banner: { text:'', t:0, dur:0 },
    hoverTarget: null,
    humanSkillPending: null,
    humanSide: -1,
    resolve: null,
    lastFrame: performance.now(),
    autoPlay: false,
    autoPlayTimer: null,
    autoPlayInitial: !!opts.autoPlay,
    momentum: { 0: 0, 1: 0 },
    momentumUsed: { 0:false, 1:false },
    duelDone: false,
    eventsFired: 0,
    xpMsg: { t:0 },
    slowmo: 0,
    zoomTarget: null
  };

  let uid = 0;
  const place = (army, side)=>{
    const gb = genBonus(army.general);
    // Sắp xếp đội hình: cung/nỏ ra sau cùng (cột xa địch),
    // rồi tới máy bắn đá, kỵ binh, chủ tướng, cuối cùng là bộ binh ở tiền tuyến.
    const SORT_ORDER = { archer:0, xbow:0, siege:1, lcav:2, hcav:2, gen:3, spear:4, sword:4 };
    const list = army.units.slice(0, ARMY_CAP)
      .slice()
      .sort((a,b) => (SORT_ORDER[a.type] ?? 5) - (SORT_ORDER[b.type] ?? 5));
    const COLS = 3;
    const perCol = Math.max(1, Math.ceil(list.length / COLS));
    const yBase = Math.max(0, Math.floor((BH - perCol)/2));
    list.forEach((su,i)=>{
      const colIdx = Math.floor(i / perCol);
      const rowIdx = i % perCol;
      const x = side===0 ? colIdx : (BW-1-colIdx);
      const y = clamp(yBase + rowIdx, 0, BH-1);
      const u = makeBattleUnit(su, side, x, y, {attacker:atkF, defender:defF, genBonus:gb});
      u.id = uid++;
      u.gen = (side===0 ? attackerArmy.general : defenderArmy ? defenderArmy.general : null);
      if(u.type==='archer'||u.type==='xbow'){
        if(B.grid[u.y][u.x]==='forest') u.hidden = true;
      }
      // Đồn trú: toàn bộ cung thủ ẩn trong thành
      if(side===1 && army.isGarrison && (u.type==='archer'||u.type==='xbow')){
        u.hidden = true;
        u.inFort = true;
      }
      B.units.push(u);
    });
  };
  place(attackerArmy, 0);
  if(defenderArmy) place(defenderArmy, 1);

  const occ = new Set();
  B.units.forEach(u=>{
    let k = u.y*BW+u.x;
    if(!occ.has(k)){ occ.add(k); return; }
    for(let r=0;r<BH;r++){
      let done=false;
      for(let c=0;c<BW;c++){
        const nx = u.side===0 ? c : BW-1-c;
        if(u.side===0 && nx>3) continue;
        if(u.side===1 && nx<BW-4) continue;
        const kk = r*BW+nx;
        if(!occ.has(kk)){ u.x=nx; u.y=r; occ.add(kk); done=true; break; }
      }
      if(done) break;
    }
  });

  const PF = S.playerFaction;
  B.humanSide = atkF===PF ? 0 : defF===PF ? 1 : -1;

  if(B.humanSide>=0){
    B.banner = { text: fieldBattle ? `⚔ Hai quân đoàn chạm trán tại ${region.name}!`
                 : (atkF===PF ? `⚔ Quân ta tiến công ${region.name}!` : `🛡 Địch tiến công ${region.name}!`),
                 t: performance.now(), dur: 2200 };
  }

  return new Promise(res=>{
    B.resolve = res;
    if(B.humanSide<0){ autoResolveBattle(); return; }
    sfx('horn');
    openBattleUI();
    startBattleLoop();
    if(B.autoPlayInitial){
      setTimeout(()=>startAutoPlay(), 500);
    } else if(B.humanSide===1){
      setTimeout(aiBattleTurn, 700);
    }
  });
}

let battleRaf = null;
function startBattleLoop(){
  if(battleRaf) return;
  const step = (now)=>{
    if(!B || !B.active){ battleRaf=null; return; }
    try{
      updateBattleAnim(now);
      renderBattle(now);
    }catch(err){
      console.error('Battle render error:', err);
    }
    battleRaf = requestAnimationFrame(step);
  };
  battleRaf = requestAnimationFrame(step);
}
function updateBattleAnim(now){
  const rawDt = Math.min(50, now - (B.lastFrame||now));
  const dt = B.slowmo > 0 ? rawDt * 0.25 : rawDt;
  if(B.slowmo > 0) B.slowmo = Math.max(0, B.slowmo - rawDt);
  B.lastFrame = now;
  B.units.forEach(u=>{
    const tx = u.x*CS, ty = u.y*CS;
    const k = Math.min(1, dt/220);
    u.px += (tx-u.px)*k;
    u.py += (ty-u.py)*k;
    if(Math.abs(u.px-tx)<0.3) u.px = tx;
    if(Math.abs(u.py-ty)<0.3) u.py = ty;
    if(u.hitFlash>0) u.hitFlash = Math.max(0, u.hitFlash - dt);
    if(u.fled) u.fade = Math.max(0, u.fade - dt/700);
    u.walkPhase += dt * 0.012;
  });
  B.projectiles = B.projectiles.filter(p=>{ p.t += dt; return p.t < p.dur; });
  B.fx = B.fx.filter(f=>{ f.t += dt; return f.t < f.dur; });
  if(B.shake.amt>0) B.shake.amt = Math.max(0, B.shake.amt - rawDt*0.06);
  if(B.banner.t && now - B.banner.t > B.banner.dur) B.banner.t = 0;
  if(B.xpMsg.t && now - B.xpMsg.t > 1500) B.xpMsg.t = 0;
}

function moveCostAt(x,y,u){
  const t = B.grid[y][x];
  if(t==='river') return Infinity;
  if(t==='marsh') return B.weather.id==='rain' ? 3 : 2;
  if(t==='forest') return 1.5;
  if(t==='bridge') return 1;
  return 1;
}
function unitMoveRange(u){
  const T = UNIT_TYPES[u.type];
  let m = T.move;
  if(B.weather.id==='snow') m = Math.max(1, m-1);
  if(u.buffs.some(b=>b.id==='withdraw')) m += 2;
  return m;
}
function unitRangeOf(u){
  const T = UNIT_TYPES[u.type];
  let r = T.range;
  if(r<=1) return r;
  if(B.grid[u.y][u.x]==='hill') r++;
  if(B.weather.id==='fog') r = Math.max(1, r-1);
  const fid = u.side===0 ? B.attacker : B.defender;
  if(fid>=0 && S.factions[fid] && S.factions[fid].trait==='archer' && u.type==='archer') r++;
  return r;
}
function isWallTile(x,y){ return B.wall && B.wall[y] && B.wall[y][x] > 0; }
function isGateTile(x,y){ return B.gate && B.gate.x===x && B.gate.y===y; }
function passableFor(x,y,u){
  if(B.grid[y][x]==='river') return false;
  if(isWallTile(x,y) && !isGateTile(x,y) && u.type!=='archer') return false;
  if(isGateTile(x,y) && B.gate.hp>0) return false;
  const o = unitAt(x,y);
  if(o && o.side!==u.side) return false;
  return true;
}
function enemyZOCAt(x,y,mySide){
  return B.units.some(o=>o.side!==mySide && !o.fled && o.hp>0 && Math.abs(o.x-x)+Math.abs(o.y-y)<=1);
}

/* Tiền tuyến = vị trí xa nhất về phía địch của các đơn vị cận chiến đồng minh.
   Cung/nỏ không được vượt qua đường này. */
function archerFrontlineLimit(u){
  const allies = B.units.filter(o =>
    o.side === u.side && !o.fled && o.hp > 0 &&
    o.type !== 'archer' && o.type !== 'xbow' && o.type !== 'siege'
  );
  if(!allies.length) return null;
  if(u.side === 0){
    return Math.min(...allies.map(a => a.x));
  } else {
    return Math.max(...allies.map(a => a.x));
  }
}

function reachable(u){
  const maxM = unitMoveRange(u);
  const ignoreZoc = (u.type==='lcav');
  const dist = new Map();
  const start = u.y*BW+u.x;
  dist.set(start, 0);
  const results = new Set();
  const queue = [[0, u.x, u.y]];
  while(queue.length){
    queue.sort((a,b)=>a[0]-b[0]);
    const [d,x,y] = queue.shift();
    if(d > (dist.get(y*BW+x) ?? Infinity)) continue;
    if(d>0){
      const occ = unitAt(x,y);
      if(!occ) results.add(y*BW+x);
      if(occ) continue;
      if(!ignoreZoc && enemyZOCAt(x,y,u.side)) continue;
    }
    for(const [dx,dy] of DIR_VEC){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=BW||ny>=BH) continue;
      if(!passableFor(nx,ny,u)) continue;
      const c = d + moveCostAt(nx,ny,u);
      if(c > maxM + 0.001) continue;
      const k = ny*BW+nx;
      if((dist.get(k) ?? Infinity) > c + 0.001){
        dist.set(k, c);
        queue.push([c,nx,ny]);
      }
    }
  }
  // Cung/nỏ không được vượt tiền tuyến
  if(u.type === 'archer' || u.type === 'xbow'){
    const lim = archerFrontlineLimit(u);
    if(lim !== null){
      const curX = u.x;
      const bound = u.side === 0 ? Math.max(lim, curX) : Math.min(lim, curX);
      const filtered = new Set();
      results.forEach(k => {
        const x = k % BW;
        if(u.side === 0 ? x <= bound : x >= bound) filtered.add(k);
      });
      return filtered;
    }
  }
  return results;
}
function unitAt(x,y){
  return B.units.find(u=>!u.fled && u.hp>0 && u.x===x && u.y===y);
}
function dirTo(a,b){
  const dx = b.x-a.x, dy = b.y-a.y;
  if(Math.abs(dx) >= Math.abs(dy)) return dx>=0 ? 0 : 2;
  return dy>=0 ? 1 : 3;
}
function relAngleOf(defender, attacker){
  return ((dirTo(defender, attacker) - defender.facing) + 4) % 4;
}
function angleMod(rel){
  if(rel===2) return { mult: 1.5, mor: 14, label:'SAU LƯNG' };
  if(rel===1 || rel===3) return { mult: 1.25, mor: 7, label:'SƯỜN' };
  return { mult: 1.0, mor: 0, label:'' };
}
function spearWallBonus(u){
  if(!UNIT_TYPES[u.type].spear) return 0;
  let n = 0;
  for(const [dx,dy] of DIR_VEC){
    const o = unitAt(u.x+dx, u.y+dy);
    if(o && o.side===u.side && UNIT_TYPES[o.type].spear) n++;
  }
  return Math.min(8, n*3);
}
function supportDefBonus(u){
  if(UNIT_TYPES[u.type].cav || UNIT_TYPES[u.type].siege) return 0;
  let n = 0;
  for(const [dx,dy] of DIR_VEC){
    const o = unitAt(u.x+dx, u.y+dy);
    if(o && o.side===u.side && !o.fled && !UNIT_TYPES[o.type].siege) n++;
  }
  return Math.min(6, n*2);
}
function losBlocked(a, b){
  let x0=a.x, y0=a.y, x1=b.x, y1=b.y;
  const dx = Math.abs(x1-x0), dy = Math.abs(y1-y0);
  const sx = x0<x1?1:-1, sy = y0<y1?1:-1;
  let err = dx-dy;
  let steps = 0;
  while(true){
    if(!(x0===a.x&&y0===a.y) && !(x0===x1&&y0===y1)){
      if(B.grid[y0][x0]==='forest') return true;
    }
    if(x0===x1 && y0===y1) break;
    const e2 = 2*err;
    if(e2 > -dy){ err -= dy; x0 += sx; }
    if(e2 < dx){ err += dx; y0 += sy; }
    if(++steps>64) break;
  }
  return false;
}
function predictDamage(a, d, opts){
  opts = opts||{};
  return computeDamage(a, d, true, opts);
}
function computeDamage(a, d, isPredict, opts){
  opts = opts||{};
  const TA = UNIT_TYPES[a.type], TD = UNIT_TYPES[d.type];
  let mult = 1;
  const at = B.grid[a.y][a.x];
  if(at==='hill') mult *= 1.15;
  if(TA.cav && a.chargeDist>=3) mult *= 1.5;
  if(TA.cav && (a.side===0?B.attacker:B.defender)>=0){
    const f = S.factions[a.side===0?B.attacker:B.defender];
    if(f && f.trait==='horse' && a.type==='lcav') mult *= 1.15;
  }
  if(d.attackedCount>0) mult *= 1.25;
  const braced = d.buffs.some(b=>b.id==='brace');
  if(TD.spear && TA.cav){ mult *= braced ? 0.4 : 0.65; }
  if(TA.spear && TD.cav) mult *= 1.5;
  let angMod = { mult:1, mor:0, label:'' };
  if(TA.range<=1 && !TA.siege){
    angMod = angleMod(relAngleOf(d, a));
    mult *= angMod.mult;
  }
  mult *= (1 + moraleAtkMod(a));
  if(B.weather.id==='rain' && (a.type==='archer'||a.type==='xbow') && TA.range>1) mult *= 0.8;
  if(a.buffs.some(b=>b.id==='power_slash')) mult *= 1.5;
  if(TA.siege && a.buffs.some(b=>b.id==='fire_stone') && d.side===1 && B.fortLevel>0) mult *= 1.5;
  if(a.hidden){ mult *= 1.30; }
  const genA = B.units.find(x=>x.side===a.side && x.type==='gen' && !x.fled && x.hp>0);
  if(genA && Math.abs(genA.x-a.x)+Math.abs(genA.y-a.y)<=2) mult *= 1.08;
  if(d.side===1 && B.fortLevel>0 && !TA.siege) mult *= (1 - 0.12*B.fortLevel);
  if(TA.siege && B.fortLevel>0) mult *= 1.35;
  if(B.momentumCharge && B.momentumCharge[a.side]) mult *= 1.15;
  let def = TD.def;
  const dt = B.grid[d.y][d.x];
  if(dt==='forest') def *= 1.35;
  if(dt==='hill') def *= 1.22;
  if(dt==='marsh') def *= 0.85;
  def += spearWallBonus(d);
  def += supportDefBonus(d);
  if(d.side===1 && B.fortLevel>0) def *= (1+0.25*B.fortLevel);
  if(a.buffs.some(b=>b.id==='pierce')) def *= 0.5;
  let dmg = Math.max(3, TA.atk*mult - def);
  if(!isPredict) dmg *= 0.85 + R()*0.3;
  const critChance = 0.12 + (a.buffs.some(b=>b.id==='power_slash')?0.15:0);
  const crit = !isPredict && R() < critChance;
  if(crit) dmg *= 1.6;
  return { dmg: Math.max(2, Math.round(dmg)), crit, angMod };
}
function doAttack(a, d, opts){
  opts = opts||{};
  if(!a || !d || d.fled || d.hp<=0) return;
  const TA = UNIT_TYPES[a.type];
  const res = computeDamage(a, d, false, opts);
  const dmg = res.dmg;
  const crit = res.crit;
  const angMod = res.angMod || {mult:1, mor:0, label:''};

  if(TA.range<=1 && !TA.siege){
    a.facing = dirTo(a, d);
    if(!d.fled && d.hp>0) d.facing = dirTo(d, a);
  }

  if(a.hidden){
    a.hidden = false;
    addFx(a.x, a.y, a.inFort ? '🏯 PHỤC KÍCH!' : '🌿 MAI PHỤC!', '#a8e0a0', 1.3);
    a.inFort = false;
  }

  if(TA.range<=1 && !TA.siege){
    const dx = Math.sign(d.x - a.x), dy = Math.sign(d.y - a.y);
    a.lungeT = performance.now();
    a.lungeDir = [dx, dy];
    applyDamage(a, d, dmg, crit, angMod);
    sfx(TA.cav ? 'charge' : (TA.spear?'spear':'sword'));
  } else if(TA.siege){
    launchProjectile(a, d, 'stone');
    setTimeout(()=>{
      if(!B || !B.active) return;
      applyDamage(a, d, dmg, crit, angMod);
      if(B.grid[d.y][d.x]==='forest') setFire(d.x, d.y);
      sfx('stone');
    }, 260);
  } else {
    launchProjectile(a, d, 'arrow');
    setTimeout(()=>{
      if(!B || !B.active) return;
      applyDamage(a, d, dmg, crit, angMod);
      sfx('bow');
    }, 240);
  }
  a.hasActed = true;
  a.buffs = a.buffs.filter(b=> !['power_slash','pierce','fire_stone','withdraw_ready','brace_ready','knockback'].includes(b.id));
  if(TA.cav && (d.fled||d.hp<=0) && !a.chainedOnce){
    const adjacent = B.units.find(o=>o.side!==a.side && !o.fled && o.hp>0 && Math.abs(o.x-a.x)+Math.abs(o.y-a.y)<=unitRangeOf(a));
    if(adjacent){
      a.chainedOnce = true;
      addFx(a.x, a.y, '⚡ LIÊN HOÀN', '#ffb84a', 1.1);
      setTimeout(()=>{
        if(!B || !B.active) return;
        if(a.fled || a.hp<=0) return;
        const r2 = computeDamage(a, adjacent, false);
        applyDamage(a, adjacent, Math.max(2, Math.round(r2.dmg*0.6)), false, {mult:1,mor:0,label:''});
      }, 280);
    }
  }
}
function applyDamage(a, d, dmg, crit, angMod){
  if(!d || d.fled || d.hp<=0) return;
  d.hp -= dmg;
  d.hitFlash = 320;
  const col = crit ? '#ffd75a' : (angMod && angMod.mult>1 ? '#ff9a3c' : '#ffffff');
  addFx(d.x, d.y, (crit?'✦':'')+'-'+dmg, col, crit?1.5:1);
  d.mor -= Math.round(dmg*0.28 + ri(0,4) + (angMod?angMod.mor:0));
  d.attackedCount++;
  if(crit || d.type==='gen' && d.hp<=0){ B.shake.amt = Math.min(14, B.shake.amt + (crit?7:12)); B.slowmo = 150; }

  if(angMod && angMod.label && !crit){
    addFx(d.x, d.y-0.5, angMod.label==='SAU LƯNG' ? 'ĐÁNH LƯNG!' : 'ĐÁNH SƯỜN!', '#ffd75a', 0.9);
  }
  const TA = UNIT_TYPES[a.type], TD = UNIT_TYPES[d.type];
  const sideCls = a.side===B.humanSide ? 'l0' : 'l1';
  let note = '';
  if(angMod && angMod.label) note = ' ['+angMod.label+']';
  if(crit) note += ' [CHÍ MẠNG]';
  if(UNIT_TYPES[a.type].cav && a.chargeDist>=3) note += ' [XUNG PHONG]';
  blog(`<span class="${sideCls}">${TA.icon} ${TA.name}</span> → ${TD.icon} ${TD.name}: <b>${dmg}</b>${note}`, a.side);

  const attSide = a.side;
  if(crit || angMod.mult>1){
    B.momentum[attSide] = clamp(B.momentum[attSide] + (crit?7:4), 0, 100);
  }

  if(a.buffs.some(b=>b.id==='fire_stone') && a.type==='siege'){
    if(B.grid[d.y][d.x]==='forest') setFire(d.x, d.y);
  }

  const dist = Math.abs(a.x-d.x)+Math.abs(a.y-d.y);
  const canCounter = d.hp>0 && d.mor>20 && !d.fled && unitRangeOf(d)>=dist && !TD.siege;
  if(canCounter){
    let cDmg = Math.max(1, Math.round(computeDamage(d, a, false).dmg * 0.35));
    if(d.buffs.some(b=>b.id==='brace') && UNIT_TYPES[a.type].cav){
      cDmg = Math.round(cDmg * 2.5);
      addFx(d.x, d.y, 'PHẢN ĐÒN!', '#ffd75a', 1.2);
    }
    a.hp -= cDmg;
    a.hitFlash = 250;
    addFx(a.x, a.y, '-'+cDmg, '#ff6b5a', 0.9);
    a.mor -= Math.round(cDmg*0.2);
  }

  if(a.type==='hcav' && a.buffs.some(b=>b.id==='knockback') && a.chargeDist>=3 && d.hp>0){
    const dx = Math.sign(d.x - a.x), dy = Math.sign(d.y - a.y);
    const nx = d.x + dx, ny = d.y + dy;
    if(nx>=0 && ny>=0 && nx<BW && ny<BH && !unitAt(nx,ny) && B.grid[ny][nx]!=='river'){
      d.x = nx; d.y = ny;
      addFx(nx, ny, 'HẤT LÙI', '#ffb84a', 1.0);
    }
  }

  if(d.hp<=0){
    d.hp = 0; d.fled = true;
    addFx(d.x, d.y, '☠', '#ff5a5a', 1.4);
    blog(`${TD.icon} ${TD.name} bị tiêu diệt!`, d.side);
    a.mor = Math.min(a.maxMor, a.mor+6);
    B.momentum[a.side] = clamp(B.momentum[a.side] + 10, 0, 100);
    B.momentum[d.side] = clamp(B.momentum[d.side] - 6, 0, 100);
    a.xpEarned = (a.xpEarned||0) + 30;
    maybeLevelUp(a);
    if(d.type==='gen'){
      B.units.forEach(u=>{ if(u.side===d.side) u.mor -= 40; });
      blog(`👑 Chủ tướng phe ${d.side===0?'tấn công':'phòng thủ'} đã tử trận! Toàn phe -40 sĩ khí!`);
      B.shake.amt = 18; B.slowmo = 400;
      B.momentum[a.side] = clamp(B.momentum[a.side] + 25, 0, 100);
      B.momentum[d.side] = clamp(B.momentum[d.side] - 30, 0, 100);
    }
  } else if(d.mor<=0){
    d.fled = true;
    addFx(d.x, d.y, '🏳', '#dddddd', 1.2);
    blog(`${TD.icon} ${TD.name} bỏ chạy khỏi chiến trường!`, d.side);
    B.momentum[a.side] = clamp(B.momentum[a.side] + 6, 0, 100);
    B.momentum[d.side] = clamp(B.momentum[d.side] - 4, 0, 100);
  }

  if(a.hp<=0){ a.hp=0; a.fled=true; addFx(a.x, a.y, '☠', '#ff5a5a', 1.4); blog(`${TA.icon} ${TA.name} của ta bị tiêu diệt!`, a.side); }
  else if(a.mor<=0){ a.fled=true; addFx(a.x, a.y, '🏳', '#dddddd', 1.2); blog(`${TA.icon} ${TA.name} của ta bỏ chạy!`, a.side); }

  if(d.fled){
    B.units.forEach(u=>{
      if(u.side===d.side && !u.fled && u.hp>0 && Math.abs(u.x-d.x)+Math.abs(u.y-d.y)<=1){
        u.mor -= 8;
        if(u.mor<=0){ u.fled=true; blog(`${UNIT_TYPES[u.type].icon} ${UNIT_TYPES[u.type].name} hoảng loạn bỏ chạy!`, u.side); }
      }
    });
  }

  if(a.buffs.some(b=>b.id==='withdraw') && !a.fled && a.hp>0){
    a.hasMoved = false;
    a.buffs = a.buffs.filter(b=>b.id!=='withdraw');
    blog(`💨 ${UNIT_TYPES[a.type].icon} ${UNIT_TYPES[a.type].name} rút lui chiến thuật (có thể đi tiếp).`, a.side);
  }

  checkBattleEnd();
  B.infoDirty = true;
}
function maybeLevelUp(u){
  const threshold = 60 + (u.level-1)*40;
  if((u.xpEarned||0) >= threshold){
    u.level++;
    u.xpEarned = 0;
    u.maxHp = Math.round(u.maxHp * 1.1);
    u.hp = Math.min(u.maxHp, u.hp + Math.round(u.maxHp*0.2));
    u.skillCd = Math.max(0, u.skillCd - 1);
    addFx(u.x, u.y, '★ THĂNG CẤP!', '#ffd75a', 1.4);
    blog(`★ ${UNIT_TYPES[u.type].icon} ${UNIT_TYPES[u.type].name} thăng cấp ${u.level}!`, u.side);
    sfx('levelup');
    B.xpMsg = { t: performance.now(), text: `${UNIT_TYPES[u.type].icon} thăng cấp ${u.level}!` };
  }
}
function distToGate(u){
  if(!B.gate) return Infinity;
  return Math.abs(u.x - B.gate.x) + Math.abs(u.y - B.gate.y);
}
function attackGate(u){
  if(!B || !B.gate || B.gate.hp <= 0) return;
  const T = UNIT_TYPES[u.type];
  let base;
  if(T.siege) base = T.atk * 1.5;
  else if(T.cav) base = T.atk * 0.25;
  else if(T.range>1) base = T.atk * 0.35;
  else base = T.atk * 0.4;
  if(u.buffs.some(b=>b.id==='fire_stone')) base *= 1.5;
  const dmg = Math.max(1, Math.round(base * (0.85 + R()*0.3)));
  B.gate.hp = Math.max(0, B.gate.hp - dmg);
  addFx(B.gate.x, B.gate.y, '-'+dmg, '#ffb84a', 1.1);
  sfx(T.siege ? 'stone' : 'gate');
  u.hasActed = true;
  u.xpEarned = (u.xpEarned||0) + 15;
  maybeLevelUp(u);
  const sideCls = u.side===B.humanSide ? 'l0' : 'l1';
  blog(`<span class="${sideCls}">${T.icon} ${T.name}</span> đập cổng: <b>${dmg}</b>`, u.side);
  B.momentum[u.side] = clamp(B.momentum[u.side] + 3, 0, 100);
  if(B.gate.hp <= 0){
    addFx(B.gate.x, B.gate.y, '💥 CỔNG VỠ!', '#ff5a5a', 1.6);
    blog(`💥 Cổng thành đã vỡ! Quân tấn công có thể tràn vào.`, -1);
    B.shake.amt = 16;
    B.momentum[u.side] = clamp(B.momentum[u.side] + 15, 0, 100);
  }
  u.buffs = u.buffs.filter(b => b.id !== 'fire_stone');
  B.infoDirty = true;
  checkBattleEnd();
}
function launchProjectile(a, d, type){
  B.projectiles.push({
    x0: a.x*CS+CS/2, y0: a.y*CS+CS/2,
    x1: d.x*CS+CS/2, y1: d.y*CS+CS/2,
    t: 0, dur: type==='stone'?300:240, type
  });
}
function addFx(x,y,txt,col,scale){
  B.fx.push({ x, y, txt, col, scale: scale||1, t: 0, dur: 950 });
}
function setFire(x,y){
  if(B.fire[y][x] === 0){
    B.fire[y][x] = 2;
    addFx(x, y, '🔥', '#ff8a3c', 1.2);
  }
}
function spreadFire(){
  const add = [];
  const dryBonus = B.weather.id==='clear' ? 1.4 : B.weather.id==='rain' ? 0 : 1;
  if(B.weather.id==='rain'){
    for(let y=0;y<BH;y++) for(let x=0;x<BW;x++){
      if(B.fire[y][x]>0) B.fire[y][x] = Math.max(0, B.fire[y][x]-2);
    }
  } else {
    const wind = B.windDir;
    for(let y=0;y<BH;y++) for(let x=0;x<BW;x++){
      if(B.fire[y][x]>0 && B.grid[y][x]==='forest'){
        for(const [dx,dy] of DIR_VEC){
          const isWind = (dx===wind[0] && dy===wind[1]);
          const p = isWind ? 0.6 : 0.25;
          const nx=x+dx, ny=y+dy;
          if(nx<0||ny<0||nx>=BW||ny>=BH) continue;
          if(B.fire[ny][nx]>0) continue;
          if(B.grid[ny][nx]!=='forest') continue;
          if(chance(p*dryBonus)) add.push([nx,ny]);
        }
      }
    }
    add.forEach(([x,y])=>setFire(x,y));
    for(let y=0;y<BH;y++) for(let x=0;x<BW;x++) if(B.fire[y][x]>0) B.fire[y][x]--;
  }
  B.units.forEach(u=>{
    if(u.fled||u.hp<=0) return;
    if(B.fire[u.y][u.x]>0){
      const dmg = 12 + ri(0,6);
      u.hp -= dmg;
      addFx(u.x, u.y, '-'+dmg, '#ff8a3c', 1.0);
      u.mor -= 6;
      if(u.hp<=0){ u.hp=0; u.fled=true; blog(`${UNIT_TYPES[u.type].icon} bị thiêu chết trong biển lửa!`, u.side); }
    }
  });
  if(B.hasFort){
    for(let y=0;y<BH;y++) for(let x=0;x<BW;x++){
      if(B.wall[y][x]>0 && !isGateTile(x,y)){
        for(const [dx,dy] of [[-1,0],[-1,-1],[-1,1]]){
          const u = unitAt(x+dx,y+dy);
          if(u && u.side===0 && chance(0.25)){
            const dmg = ri(5,10);
            u.hp -= dmg; u.mor -= 3;
            addFx(u.x, u.y, '-'+dmg+' 🛢', '#ff6b3c', 0.9);
            if(u.hp<=0){ u.hp=0; u.fled=true; blog(`Đơn vị bị dầu sôi thiêu chết!`, u.side); }
          }
        }
      }
    }
  }
}

function tryRandomBattleEvent(){
  if(!B || !B.active) return;
  if(B.round < 4) return;
  if(B.eventsFired >= 2) return;
  if(!chance(0.15)) return;
  B.eventsFired++;
  const ev = pick(BATTLE_EVENTS);
  B.banner = { text: ev.name + ' — ' + ev.text, t: performance.now(), dur: 1500 };
  blog(`⚡ ${ev.name}: ${ev.text}`, -1);
  sfx('horn');
  if(ev.id==='reinforce'){
    const s0 = B.units.filter(u=>u.side===0 && !u.fled && u.hp>0).length;
    const s1 = B.units.filter(u=>u.side===1 && !u.fled && u.hp>0).length;
    const weakSide = s0 < s1 ? 0 : 1;
    const x = weakSide===0 ? 0 : BW-1;
    let yy = -1;
    for(let y=0;y<BH;y++){ if(!unitAt(x,y)){ yy=y; break; } }
    if(yy<0) return;
    const t = pick(['spear','sword','archer']);
    const su = newStrategicUnit(t);
    const u = makeBattleUnit(su, weakSide, x, yy, {attacker:B.attacker, defender:B.defender, genBonus:{}});
    u.id = 900+B.eventsFired;
    B.units.push(u);
    addFx(x, yy, '🚩 VIỆN BINH', '#7fd3ff', 1.4);
    sfx('reinforce');
  } else if(ev.id==='wind'){
    B.windDir = pick([[1,0],[-1,0],[0,1],[0,-1]]);
    for(let y=0;y<BH;y++) for(let x=0;x<BW;x++){
      if(B.fire[y][x]>0){
        const nx = x + B.windDir[0], ny = y + B.windDir[1];
        if(nx>=0&&ny>=0&&nx<BW&&ny<BH&&B.grid[ny][nx]==='forest') setFire(nx,ny);
      }
    }
  } else if(ev.id==='thunder'){
    const n = ri(1,2);
    for(let k=0;k<n;k++){
      const x = ri(0,BW-1), y = ri(0,BH-1);
      addFx(x, y, '⚡', '#ffff80', 1.6);
      B.shake.amt = 12;
      const u = unitAt(x,y);
      if(u){ const dmg = ri(15,30); u.hp -= dmg; u.mor -= 5; addFx(x,y,'-'+dmg,'#ffff80',1.0); if(u.hp<=0){u.hp=0;u.fled=true;blog(`⚡ Sấm sét đánh trúng ${UNIT_TYPES[u.type].name}!`, u.side);} }
    }
    sfx('thunder');
  } else if(ev.id==='fog'){
    B.weather = WEATHERS.fog;
  }
  B.infoDirty = true;
}

function checkBattleEnd(){
  if(!B || !B.active) return;
  const s0 = B.units.filter(u=>u.side===0 && !u.fled && u.hp>0);
  const s1 = B.units.filter(u=>u.side===1 && !u.fled && u.hp>0);
  if(s0.length===0 && s1.length===0){ endBattle(1); return; }
  if(s0.length===0){ endBattle(1); return; }
  if(s1.length===0){ endBattle(0); return; }
}
function endBattle(winnerSide){
  if(!B || !B.active) return;
  B.active = false;
  if(B.autoPlayTimer){ clearTimeout(B.autoPlayTimer); B.autoPlayTimer = null; }
  B.autoPlay = false;

  const atkSurv = B.units.filter(u=>u.side===0 && !u.fled && u.hp>0);
  const defSurv = B.units.filter(u=>u.side===1 && !u.fled && u.hp>0);

  const carryOver = (surv)=>{
    return surv.map(u=>{
      const hp = Math.max(1, Math.round(u.hp));
      const src = u.srcRef || {};
      const xp = (src.xp||0) + 15 + (u.xpEarned||0);
      let lv = src.level||1;
      let vx = xp, veteran = src.veteran||false;
      while(vx>=60){ lv++; vx-=60; veteran = true; }
      return {type:u.type, hp, maxHp:u.maxHp, level:lv, xp:vx, veteran};
    });
  };
  if(B.attackerArmy) B.attackerArmy.units = carryOver(atkSurv);
  if(B.defenderArmy) B.defenderArmy.units = carryOver(defSurv);

  const region = B.region;
  const atkF = B.attacker, defF = B.defender;
  let title, text;
  if(winnerSide===0){
    title = '🏆 Chiến thắng!';
    text = `Quân của bạn đã đánh tan địch tại <b>${region.name}</b>.`;
    const oldOwner = region.owner;
    region.owner = atkF;
    if(B.defenderArmy){ S.armies = S.armies.filter(a=>a.id!==B.defenderArmy.id); }
    region.garrison = 0;
    if(B.attackerArmy) B.attackerArmy.region = region.id;
    if(atkF>=0) chron(`Năm ${S.year}, ${SEASONS[S.season]}: ${S.factions[atkF].short} chiến thắng tại ${region.name}.`);
    if(B.attackerArmy){
      B.attackerArmy.general.xp += 25;
      if(B.attackerArmy.general.xp>=100){ B.attackerArmy.general.level++; B.attackerArmy.general.xp=0; }
    }
    if(region.capital && oldOwner !== null && oldOwner !== atkF){
      const oldF = S.factions[oldOwner];
      oldF.stability = clamp(oldF.stability - 25, 0, 100);
      oldF.prestige = Math.max(0, oldF.prestige - 30);
      oldF.gold = Math.round(oldF.gold * 0.7);
      oldF.vassalLoyalty = clamp(oldF.vassalLoyalty - 20, 0, 100);
      chron(`💀 ${oldF.name} mất thủ đô ${region.name}! Triều đình chấn động.`);
      logEvent(`💀 Thủ đô ${region.name} của ${oldF.short} thất thủ!`, oldOwner);
      region.capital = false;
      const remaining = S.regions.filter(r=>r.owner===oldOwner);
      if(remaining.length){
        const newCap = remaining.slice().sort((a,b)=> (b.gold+b.food+b.fort*3) - (a.gold+a.food+a.fort*3))[0];
        newCap.capital = true;
        oldF.capitalRegion = newCap.id;
        oldF.capital = newCap.name;
        chron(`🏛 ${oldF.name} dời đô đến ${newCap.name}.`);
        logEvent(`🏛 ${oldF.short} dời đô đến ${newCap.name}.`, oldOwner);
      } else {
        oldF.capitalRegion = -1;
      }
    } else if(region.capital){
      region.capital = false;
    }
  } else {
    title = '💀 Thất bại!';
    text = `Quân của bạn bị đẩy lùi khỏi <b>${region.name}</b>.`;
    if(B.attackerArmy){
      if(B.attackerArmy.units.length===0){
        S.armies = S.armies.filter(a=>a.id!==B.attackerArmy.id);
        text += ' Quân đoàn bị xóa sổ.';
      } else {
        const home = region.neighbors.map(i=>S.regions[i]).find(r=>r.owner===atkF);
        if(home) B.attackerArmy.region = home.id;
      }
      if(chance(0.3)){ B.attackerArmy.general.wounded = true; text += ` Chủ tướng ${B.attackerArmy.general.name} bị thương.`; }
      if(chance(0.12)){ S.armies = S.armies.filter(a=>a.id!==B.attackerArmy.id); text += ` Chủ tướng ${B.attackerArmy.general.name} bị bắt!`; }
    }
    if(atkF>=0) chron(`Năm ${S.year}, ${SEASONS[S.season]}: ${S.factions[atkF].short} thất bại tại ${region.name}.`);
  }
  if(B.humanSide===1){
    if(B.fieldBattle){
      if(winnerSide===1){ title='🏆 Thắng giao chiến dã chiến!'; text=`Quân đoàn của bạn đã đánh tan đối phương tại <b>${region.name}</b>.`; }
      else { title='💀 Thất bại dã chiến!'; text=`Quân đoàn của bạn bị đánh bật khỏi <b>${region.name}</b>.`; }
    }else{
      if(winnerSide===1){ title='🏆 Phòng thủ thành công!'; text=`Bạn đã đẩy lùi quân địch tại <b>${region.name}</b>.`; }
      else { title='💀 Vùng đã thất thủ!'; text=`<b>${region.name}</b> rơi vào tay địch.`; }
    }
  }
  invalidateStaticMap();
  render();
  if(B.humanSide<0){
    logEvent(`⚔ ${fname(atkF)} ${winnerSide===0?'chiếm':'thất bại tại'} ${region.name}`, atkF);
    const rs=B.resolve; B=null; rs&&rs(); return;
  }
  showBattleResult(title, text, winnerSide);
}
function showBattleResult(title, text, winner){
  sfx(winner===B.humanSide?'win':'lose');
  const html = `<h2>${title}</h2><p>${text}</p>
    <div class="bl" style="max-height:180px">${B.log.map(l=>'<div>'+l+'</div>').join('')}</div>
    <div class="choices"><button class="pri" id="okb">Tiếp tục</button></div>`;
  $('battlePanel').innerHTML = html;
  $('okb').onclick = ()=>{
    $('battleOv').classList.add('hidden');
    const rs = B.resolve;
    B = null;
    render();
    checkGameOver();
    rs && rs();
  };
}

function battleNextTurn(){
  if(!B || !B.active) return;
  const next = 1 - B.turn;
  spreadFire();
  B.units.forEach(u=>{
    if(u.side===next && !u.fled){
      u.hasMoved=false; u.hasActed=false; u.attackedCount=0; u.chargeDist=0;
      u.chainedOnce = false;
      if(u.skillCd>0) u.skillCd--;
      u.buffs = u.buffs.filter(b=>{
        b.turns = (b.turns||1) - 1;
        return b.turns > 0;
      });
      if((u.type==='archer'||u.type==='xbow') && B.grid[u.y][u.x]==='forest'){
        const near = B.units.some(o=>o.side!==u.side && !o.fled && o.hp>0 && Math.abs(o.x-u.x)+Math.abs(o.y-u.y)<=1);
        if(!near) u.hidden = true;
      }
      // Cung thủ núp trong thành: tự lộ diện khi địch kề bên
      if(u.hidden && u.inFort){
        const near = B.units.some(o=>o.side!==u.side && !o.fled && o.hp>0
          && Math.abs(o.x-u.x)+Math.abs(o.y-u.y)<=1);
        if(near){ u.hidden = false; u.inFort = false; }
      }
    }
  });
  B.turn = next;
  B.selected = null;
  B.humanSkillPending = null;
  B.hoverTarget = null;
  if(next===0) B.round++;
  if(B.momentumCharge) B.momentumCharge = {0:false, 1:false};

  if(next===0) tryRandomBattleEvent();

  const playerManual = (next === B.humanSide) && !B.autoPlay;
  if(playerManual){
    blog('— Lượt của bạn —');
    B.infoDirty = true;
    checkBattleEnd();
  } else {
    const who = (next === B.humanSide) ? 'BẠN (AUTO)' : 'ĐỊCH (AI)';
    blog(`— Lượt ${who} —`);
    B.infoDirty = true;
    checkBattleEnd();
    if(B.active) setTimeout(aiBattleTurn, 450);
  }
}

function startAutoPlay(){
  if(!B || !B.active) return;
  if(B.autoPlay) return;
  B.autoPlay = true;
  B.infoDirty = true;
  lastInfoHTML = '';
  renderBattleInfo();
  if(B.autoPlayTimer){ clearTimeout(B.autoPlayTimer); B.autoPlayTimer = null; }
  if(B.turn === B.humanSide){
    B.selected = null;
    B.humanSkillPending = null;
    aiBattleTurn();
  }
}
function stopAutoPlay(){
  if(!B) return;
  B.autoPlay = false;
  if(B.autoPlayTimer){ clearTimeout(B.autoPlayTimer); B.autoPlayTimer = null; }
  B.infoDirty = true;
  lastInfoHTML = '';
  renderBattleInfo();
}
function toggleAutoPlay(){

}
function useMomentumAttack(side){
  if(!B || !B.active) return;
  if(B.momentum[side] < 100) return;
  if(B.momentumUsed[side]) return;
  B.momentumUsed[side] = true;
  B.momentum[side] = 0;
  B.momentumCharge = B.momentumCharge || {0:false,1:false};
  B.momentumCharge[side] = true;
  B.banner = { text: '⚡ TỔNG TẤN CÔNG! Toàn quân +15% ATK lượt này.', t: performance.now(), dur: 1800 };
  blog(`⚡ Phe ${side===0?'tấn công':'phòng thủ'} phát động TỔNG TẤN CÔNG!`, side);
  sfx('cheer');
  B.infoDirty = true;
}
function canDuel(){
  if(!B || !B.active || B.duelDone) return false;
  const g0 = B.units.find(u=>u.type==='gen' && u.side===0 && !u.fled && u.hp>0);
  const g1 = B.units.find(u=>u.type==='gen' && u.side===1 && !u.fled && u.hp>0);
  if(!g0 || !g1) return false;
  return Math.abs(g0.x-g1.x)+Math.abs(g0.y-g1.y)<=2;
}
function duelOdds(){
  const g0 = B.units.find(u=>u.type==='gen' && u.side===0 && !u.fled && u.hp>0);
  const g1 = B.units.find(u=>u.type==='gen' && u.side===1 && !u.fled && u.hp>0);
  if(!g0||!g1) return 0.5;
  const b0 = g0.gen ? genBonus(g0.gen) : {atk:0};
  const b1 = g1.gen ? genBonus(g1.gen) : {atk:0};
  const p0 = (g0.hp/g0.maxHp)*10 + (b0.atk||0)*40 + (g0.gen?.level||1)*5;
  const p1 = (g1.hp/g1.maxHp)*10 + (b1.atk||0)*40 + (g1.gen?.level||1)*5;
  return p0/(p0+p1);
}
function doDuel(){
  if(!canDuel()) return;
  B.duelDone = true;
  const odds = duelOdds();
  const humanSide = B.humanSide;
  const humanWins = R() < (humanSide===0 ? odds : 1-odds);
  const winnerSide = humanWins ? humanSide : 1-humanSide;
  const loserSide = 1-winnerSide;
  B.banner = { text: '⚔ ĐƠN ĐẤU TƯỚNG!', t: performance.now(), dur: 1600 };
  blog(`⚔ Đơn đấu tướng! Tỉ lệ thắng của phe ta: ${Math.round((humanSide===0?odds:1-odds)*100)}%`, -1);
  sfx('duel');
  B.units.forEach(u=>{
    if(u.side===loserSide && !u.fled) u.mor -= 40;
    if(u.side===winnerSide && !u.fled) u.mor = Math.min(u.maxMor, u.mor+15);
  });
  blog(`Đơn đấu kết thúc! Phe ${winnerSide===0?'tấn công':'phòng thủ'} thắng — phe thua -40 sĩ khí.`, -1);
  const loserGen = B.units.find(u=>u.type==='gen' && u.side===loserSide && !u.fled && u.hp>0);
  if(loserGen){
    loserGen.hp -= 40;
    loserGen.hitFlash = 400;
    addFx(loserGen.x, loserGen.y, '-40', '#ff5a5a', 1.6);
    if(loserGen.hp<=0){ loserGen.hp=0; loserGen.fled=true; }
  }
  B.shake.amt = 18;
  B.slowmo = 500;
  checkBattleEnd();
  B.infoDirty = true;
}

function battleCellFromEvent(e){
  const cv = $('battleCanvas');
  if(!cv) return null;
  const rect = cv.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width * cv.width;
  const py = (e.clientY - rect.top) / rect.height * cv.height;

  const scaleX = cv.width / (BW*CS);
  const scaleY = cv.height / (BH*CS);
  const scale = Math.min(scaleX, scaleY);
  const offX = (cv.width - BW*CS*scale)/2;
  const offY = (cv.height - BH*CS*scale)/2;
  const wx = (px - offX) / scale;
  const wy = (py - offY) / scale;
  const x = Math.floor(wx / CS);
  const y = Math.floor(wy / CS);
  if(x<0||y<0||x>=BW||y>=BH) return null;
  return {x,y};
}

function onBattleClick(e){
  if(!B || !B.active) return;
  if(B.autoPlay){ stopAutoPlay(); }
  const cell = battleCellFromEvent(e);
  if(!cell) return;
  const {x,y} = cell;
  const mySide = B.humanSide;
  if(B.turn!==mySide) return;

  if(B.humanSkillPending){
    const sel = B.selected;
    if(!sel){ B.humanSkillPending=null; B.infoDirty=true; return; }
    const sk = SKILLS[sel.type];
    if(sk.type==='target' && sel.type==='archer'){
      const dist = Math.abs(x-sel.x)+Math.abs(y-sel.y);
      if(dist<=unitRangeOf(sel)+1){
        useArrowRain(sel, x, y);
        B.humanSkillPending = null;
        B.infoDirty = true;
        return;
      }
    }
    B.humanSkillPending = null;
    B.infoDirty = true;
    return;
  }

  const target = unitAt(x,y);
  const sel = B.selected;

  if(target && target.side===mySide && !target.fled){
    if(target.hasMoved && target.hasActed) B.selected=null;
    else B.selected = target;
    B.infoDirty = true;
    return;
  }

  if(sel){
    if(!target && B.hasFort && B.gate && B.gate.hp > 0
       && sel.side === 0 && x === B.gate.x && y === B.gate.y && !sel.hasActed){
      const d = Math.abs(x-sel.x)+Math.abs(y-sel.y);
      if(d <= unitRangeOf(sel)){
        attackGate(sel);
        if(sel.fled || sel.hp<=0) B.selected = null;
        else if(sel.hasMoved && sel.hasActed) B.selected = null;
        B.infoDirty = true;
        return;
      }
    }
    if(target && target.side!==mySide && !sel.hasActed){
      const d = Math.abs(target.x-sel.x)+Math.abs(target.y-sel.y);
      if(d<=unitRangeOf(sel)){
        doAttack(sel, target);
        if(sel.fled || sel.hp<=0) B.selected = null;
        else if(sel.hasMoved && sel.hasActed) B.selected = null;
        B.infoDirty = true;
        return;
      }
    }
    if(!sel.hasMoved){
      const rs = reachable(sel);
      if(rs.has(y*BW+x)){
        const dist = Math.abs(x-sel.x)+Math.abs(y-sel.y);
        sel.chargeDist = dist;
        if(dist>0){
          const dx = x-sel.x, dy = y-sel.y;
          if(Math.abs(dx)>=Math.abs(dy)) sel.facing = dx>=0?0:2;
          else sel.facing = dy>=0?1:3;
        }
        sel.x = x; sel.y = y;
        sel.hasMoved = true;
        blog(`${UNIT_TYPES[sel.type].icon} di chuyển tới (${x},${y})`, sel.side);
        B.infoDirty = true;
        return;
      }
    }
  }
  B.selected = null;
  B.infoDirty = true;
}
function onBattleMove(e){
  if(!B || !B.active || !B.selected) return;
  if(B.autoPlay) return;
  const cell = battleCellFromEvent(e);
  if(!cell) return;
  const {x,y} = cell;
  const t = unitAt(x,y);
  let newHover = null;
  if(t && t.side!==B.selected.side && (!t.hidden || t.inFort)) newHover = t.id;
  else if(!t && B.gate && B.gate.hp>0 && x===B.gate.x && y===B.gate.y && B.selected.side===0) newHover = 'gate';
  if(newHover !== B.hoverTarget){ B.hoverTarget = newHover; B.infoDirty = true; }
}
function useSkill(){
  if(!B || !B.active) return;
  if(B.autoPlay){ stopAutoPlay(); }
  const sel = B.selected;
  if(!sel || sel.fled || sel.hp<=0) return;
  if(sel.side!==B.humanSide || B.turn!==B.humanSide) return;

    B.humanSkillPending = sel.type;

function activateSelfSkill(u){
  const sk = SKILLS[u.type];

  sfx('skill');
  switch(u.type){
    case 'spear':
      u.buffs.push({ id:'brace', turns:2 });
      addFx(u.x, u.y, '🛡 KẾT TRẬN', '#7fd3ff', 1.2); break;
    case 'sword':

      u.mor -= 10;
      addFx(u.x, u.y, '💥 TRẢM KÍCH', '#ffd75a', 1.2); break;
    case 'xbow':

      addFx(u.x, u.y, '🎯 PHÁ GIÁP', '#c78aff', 1.2); break;
    case 'lcav':
      u.buffs.push({ id:'withdraw', turns:2 });
      addFx(u.x, u.y, '💨 DU KÍCH', '#a8e0a0', 1.2); break;
    case 'hcav':
      u.buffs.push({ id:'knockback', turns:2 });
      addFx(u.x, u.y, '🐎 ĐỘT KÍCH', '#ffb84a', 1.2); break;
    case 'siege':
      u.buffs.push({ id:'fire_stone', turns:1 });
      addFx(u.x, u.y, '🔥 HỎA THẠCH', '#ff8a3c', 1.2); break;
    case 'gen':
      B.units.forEach(o=>{
        if(o.side===u.side && !o.fled && o.hp>0 && Math.abs(o.x-u.x)+Math.abs(o.y-u.y)<=3){
          o.mor = Math.min(o.maxMor, o.mor + 40);
          o.hp = Math.min(o.maxHp, o.hp + 10);
          addFx(o.x, o.y, '+40', '#7fd3ff', 1.0);
        }
      });
      addFx(u.x, u.y, '📣 HIỆU TRIỆU', '#ffd75a', 1.4); break;
  }
  u.skillCd = SKILLS[u.type].cd;
  u.hasActed = true;
  B.infoDirty = true;
  checkBattleEnd();
}
function useArrowRain(u, cx, cy){
  const sk = SKILLS.archer;
  sfx('bow');
  addFx(cx, cy, '🌧 VẠN TIỄN', '#a8e0a0', 1.4);
  const targets = B.units.filter(o=>o.side!==u.side && !o.fled && o.hp>0
    && Math.abs(o.x-cx)<=1 && Math.abs(o.y-cy)<=1);
  targets.forEach(t=>{
    const dx = Math.abs(t.x-u.x)+Math.abs(t.y-u.y);
    if(dx<=unitRangeOf(u)+1){
      const dmg = Math.max(2, Math.round(computeDamage(u, t, false).dmg * 0.65));
      applyDamage(u, t, dmg, false, {mult:1, mor:0, label:''});
    }
  });
  u.skillCd = sk.cd;
  u.hasActed = true;
  B.infoDirty = true;
  checkBattleEnd();
}

function aiBattleTurn(){
  if(!B || !B.active) return;
  const aiSide = B.turn;
  if(aiSide === B.humanSide && !B.autoPlay) return;
  const my = B.units.filter(u=>u.side===aiSide && !u.fled && u.hp>0);
  if(B.momentum[aiSide] >= 100 && !B.momentumUsed[aiSide] && chance(0.8)){
    useMomentumAttack(aiSide);
  }
  if(canDuel() && chance(0.6)){
    const odds = duelOdds();
    const myOdds = aiSide===0 ? odds : 1-odds;
    if(myOdds > 0.55) doDuel();
  }
  let idx = 0;
  function step(){
    if(!B || !B.active || B.turn!==aiSide) return;
    if(aiSide === B.humanSide && !B.autoPlay){ B.infoDirty = true; return; }
    if(idx>=my.length){
      B.autoPlayTimer = setTimeout(()=>{
        B.autoPlayTimer = null;
        if(!B || !B.active || B.turn!==aiSide) return;
        if(aiSide === B.humanSide && !B.autoPlay) return;
        battleNextTurn();
      }, 200);
      return;
    }
    const u = my[idx++];
    if(u.fled||u.hp<=0){ step(); return; }
    aiUnitAct(u);
    B.infoDirty = true;
    B.autoPlayTimer = setTimeout(step, Math.max(15, 180/GAME_SETTINGS.battleSpeed));
  }
  step();
}
function aiUnitAct(u){
  const T = UNIT_TYPES[u.type];
  const diff = S.difficulty;
  const personality = (u.gen && u.gen.personality) || 'aggressive';
  const aggr = personality==='aggressive' ? 1.2 : personality==='defensive' ? 0.7 : 1;
  const cautious = personality==='defensive' ? 1.3 : personality==='cunning' ? 1.1 : 0.9;

  if(moraleState(u)==='panic'){
    if(chance(0.55)){
      const dirs = shuffle(DIR_VEC.slice());
      for(const [dx,dy] of dirs){
        const nx=u.x+dx, ny=u.y+dy;
        if(nx<0||ny<0||nx>=BW||ny>=BH) continue;
        if(unitAt(nx,ny)) continue;
        if(B.grid[ny][nx]==='river') continue;
        u.x=nx; u.y=ny; u.hasMoved=true;
        blog(`${T.icon} hoảng loạn rút lui.`, u.side);
        return;
      }
    }
  }
  if(personality==='defensive' && u.hp < u.maxHp*0.3 && !u.hasMoved){
    const enemies = B.units.filter(o=>o.side!==u.side && !o.fled && o.hp>0);
    const rs = reachable(u);
    let best=null,bestScore=-1e9;
    rs.forEach(k=>{
      const x=k%BW, y=Math.floor(k/BW);
      let minDist = 99;
      enemies.forEach(e=>{ minDist = Math.min(minDist, Math.abs(e.x-x)+Math.abs(e.y-y)); });
      const s = minDist*2 - (B.grid[y][x]==='hill'?2:0);
      if(s>bestScore){bestScore=s;best={x,y};}
    });
    if(best && (best.x!==u.x||best.y!==u.y)){
      u.x=best.x; u.y=best.y; u.hasMoved=true;
      blog(`${T.icon} địch rút về phòng thủ.`, u.side);
      return;
    }
  }
  if(u.skillCd===0 && !u.hasActed && chance((diff===2?0.65:0.4)*aggr)){
    let used = false;
    const enemies = B.units.filter(o=>o.side!==u.side && !o.fled && o.hp>0);
    const finisher = enemies.find(e=>e.hp < e.maxHp*0.3 && Math.abs(e.x-u.x)+Math.abs(e.y-u.y)<=unitRangeOf(u));
    if(u.type==='sword' && finisher){ activateSelfSkill(u); used = true; }
    if(!used && u.type==='gen'){
      const lowMor = B.units.some(o=>o.side===u.side && !o.fled && o.mor < o.maxMor*0.6);
      if(lowMor || chance(0.4)){ activateSelfSkill(u); used = true; }
    }
    if(!used && u.type==='spear' && enemies.some(e=>UNIT_TYPES[e.type].cav && Math.abs(e.x-u.x)+Math.abs(e.y-u.y)<=3)){
      activateSelfSkill(u); used = true;
    }
    if(!used && u.type==='sword'){
      const t = enemies.find(e=>Math.abs(e.x-u.x)+Math.abs(e.y-u.y)<=1);
      if(t){ activateSelfSkill(u); used = true; }
    }
    if(!used && u.type==='xbow'){
      const t = enemies.find(e=>e.def>12 && Math.abs(e.x-u.x)+Math.abs(e.y-u.y)<=unitRangeOf(u));
      if(t){ activateSelfSkill(u); used = true; }
    }
    if(!used && u.type==='hcav' && u.chargeDist>=3 && enemies.some(e=>Math.abs(e.x-u.x)+Math.abs(e.y-u.y)<=1)){
      activateSelfSkill(u); used = true;
    }
    if(!used && u.type==='lcav' && chance(0.3)){
      activateSelfSkill(u); used = true;
    }
    if(!used && u.type==='archer' && enemies.length>=2 && diff===2 && chance(0.5)){
      const center = enemies[0];
      const inR = Math.abs(center.x-u.x)+Math.abs(center.y-u.y);
      if(inR <= unitRangeOf(u)+1){
        useArrowRain(u, center.x, center.y);
        return;
      }
    }
    if(!used && u.type==='siege' && B.fortLevel>0){
      activateSelfSkill(u);
    }
  }
  const enemies = B.units.filter(o=>o.side!==u.side && !o.fled && o.hp>0 && !o.hidden);

  if(B.fieldBattle){
    if(!enemies.length) return;
    const scoredField = enemies.map(e=>({e,d:Math.abs(e.x-u.x)+Math.abs(e.y-u.y), hp:e.hp})).sort((a,b)=>{
      if(a.hp < a.e.maxHp*0.3 && b.hp >= b.e.maxHp*0.3) return -1;
      if(b.hp < b.e.maxHp*0.3 && a.hp >= a.e.maxHp*0.3) return 1;
      return a.d-b.d;
    });
    if(!u.hasActed){
      for(const {e,d} of scoredField){
        if(d<=unitRangeOf(u)){ doAttack(u,e); return; }
      }
    }
    if(!u.hasMoved){
      const tgt=scoredField[0].e;
      const rs=reachable(u);
      let best=null,bestScore=-1e9;
      rs.forEach(k=>{
        const x=k%BW,y=Math.floor(k/BW);
        const d=Math.abs(tgt.x-x)+Math.abs(tgt.y-y);
        let score=-d*4;
        if(d<=unitRangeOf(u)) score+=20;
        if(UNIT_TYPES[u.type].cav){
          const adj = enemies.filter(e=>UNIT_TYPES[e.type].spear && Math.abs(e.x-x)+Math.abs(e.y-y)<=1).length;
          score -= adj*8;
        }
        score+=R()*0.2;
        if(score>bestScore){bestScore=score;best={x,y};}
      });
      if(best){
        u.chargeDist=Math.abs(best.x-u.x)+Math.abs(best.y-u.y);
        if(u.chargeDist>0){
          const dx=best.x-u.x,dy=best.y-u.y;
          u.facing=Math.abs(dx)>=Math.abs(dy)?(dx>=0?0:2):(dy>=0?1:3);
        }
        u.x=best.x;u.y=best.y;u.hasMoved=true;
        blog(`${T.icon} địch lao lên nghênh chiến.`,u.side);
      }
    }
    if(!u.hasActed){
      const after=enemies.filter(e=>!e.fled&&e.hp>0).sort((a,b)=>
        (Math.abs(a.x-u.x)+Math.abs(a.y-u.y))-(Math.abs(b.x-u.x)+Math.abs(b.y-u.y))
      );
      for(const e of after){
        if(Math.abs(e.x-u.x)+Math.abs(e.y-u.y)<=unitRangeOf(u)){doAttack(u,e);return;}
      }
    }
    return;
  }

  const attackerSide = (u.side === 0);
  const gateAlive = B.hasFort && B.gate && B.gate.hp > 0;
  const needBreakGate = attackerSide && gateAlive;
  if(needBreakGate){
    const enemyInRange = enemies.some(e => Math.abs(e.x-u.x)+Math.abs(e.y-u.y) <= unitRangeOf(u));
    if(!enemyInRange){
      const dg = distToGate(u);
      if(dg <= unitRangeOf(u) && !u.hasActed){
        attackGate(u);
        return;
      }
      if(!u.hasMoved){
        const rs = reachable(u);
        let best = null, bestScore = -1e9;
        rs.forEach(k=>{
          const x=k%BW, y=Math.floor(k/BW);
          const d = Math.abs(x-B.gate.x) + Math.abs(y-B.gate.y);
          let s = -d * 2.5;
          if(d <= 1) s += 30;
          let adj = 0;
          enemies.forEach(e=>{ if(Math.abs(e.x-x)+Math.abs(e.y-y)<=1) adj++; });
          s -= adj*1.5;
          if(u.type!=='lcav' && enemyZOCAt(x,y,u.side)) s -= 4;
          if(s > bestScore){ bestScore = s; best = {x,y}; }
        });
        if(best && (best.x !== u.x || best.y !== u.y)){
          u.chargeDist = Math.abs(best.x-u.x)+Math.abs(best.y-u.y);
          const dx = best.x-u.x, dy = best.y-u.y;
          if(Math.abs(dx)>=Math.abs(dy)) u.facing = dx>=0?0:2;
          else u.facing = dy>=0?1:3;
          u.x = best.x; u.y = best.y; u.hasMoved = true;
          blog(`${T.icon} địch tiến tới cổng thành.`, u.side);
        }
        if(!u.hasActed && distToGate(u) <= unitRangeOf(u)){
          attackGate(u);
          return;
        }
      }
      if(!u.hasActed && distToGate(u) > unitRangeOf(u)){
        return;
      }
    }
  }
  if(!enemies.length) return;
  const scored = enemies.map(e=>{
    let s = 0;
    if(e.type==='archer'||e.type==='xbow') s += 25;
    if(e.type==='gen') s += 30;
    if(e.type==='siege') s += 20;
    s += (1 - e.hp/e.maxHp)*40;
    s -= (Math.abs(e.x-u.x)+Math.abs(e.y-u.y))*3;
    if(e.hp < e.maxHp*0.3) s += 50;
    if(diff===2){
      const ang = relAngleOf(e, u);
      if(ang===2) s += 25;
      else if(ang===1 || ang===3) s += 12;
    }
    s += R()*8;
    return {e, s};
  }).sort((a,b)=>b.s-a.s);
  if(!u.hasActed){
    for(const {e} of scored){
      const d = Math.abs(e.x-u.x)+Math.abs(e.y-u.y);
      if(d<=unitRangeOf(u)){ doAttack(u, e); return; }
    }
  }
  if(!u.hasMoved){
    const tgt = scored[0].e;
    const rs = reachable(u);
    let best = null, bestScore = -1e9;
    rs.forEach(k=>{
      const x=k%BW, y=Math.floor(k/BW);
      let s = -(Math.abs(tgt.x-x)+Math.abs(tgt.y-y));
      if(B.grid[y][x]==='forest'||B.grid[y][x]==='hill') s += 1.2;
      let adj=0;
      enemies.forEach(e=>{ if(Math.abs(e.x-x)+Math.abs(e.y-y)<=1) adj++; });
      s -= adj*1.5;
      if(UNIT_TYPES[u.type].cav){
        const sp = enemies.filter(e=>UNIT_TYPES[e.type].spear && Math.abs(e.x-x)+Math.abs(e.y-y)<=1).length;
        s -= sp*8;
      }
      if(u.type!=='lcav' && enemyZOCAt(x,y,u.side)) s -= 4;
      if(s>bestScore){ bestScore=s; best={x,y}; }
    });
    if(best){
      u.chargeDist = Math.abs(best.x-u.x)+Math.abs(best.y-u.y);
      if(u.chargeDist>0){
        const dx = best.x-u.x, dy = best.y-u.y;
        if(Math.abs(dx)>=Math.abs(dy)) u.facing = dx>=0?0:2;
        else u.facing = dy>=0?1:3;
      }
      u.x=best.x; u.y=best.y; u.hasMoved=true;
      blog(`${T.icon} địch di chuyển.`, u.side);
    }
  }
  if(!u.hasActed){
    for(const {e} of scored){
      const d = Math.abs(e.x-u.x)+Math.abs(e.y-u.y);
      if(d<=unitRangeOf(u)){ doAttack(u,e); return; }
    }
  }
}

function autoResolveBattle(){
  if(!B || !B.active) return;
  if(B.autoPlayTimer){ clearTimeout(B.autoPlayTimer); B.autoPlayTimer = null; }
  B.autoPlay = false;
  const p0 = B.units.filter(u=>u.side===0&&!u.fled).reduce((s,u)=>s+UNIT_TYPES[u.type].atk*1.2+u.hp/4+u.mor/8,0);
  const p1 = B.units.filter(u=>u.side===1&&!u.fled).reduce((s,u)=>s+UNIT_TYPES[u.type].atk*1.2+u.hp/4+u.mor/8,0);
  const defBonus = B.fieldBattle ? 1 : 1 + 0.18*B.fortLevel;
  const r0 = p0 * (0.8+R()*0.4);
  const r1 = p1 * (0.8+R()*0.4) * defBonus;
  const winner = r0>r1 ? 0 : 1;
  const ratio = Math.min(r0,r1)/Math.max(r0,r1);
  B.units.forEach(u=>{
    if(u.side===winner) { if(chance(ratio*0.8)) u.hp = Math.max(5, u.hp*ratio); }
    else { u.hp = 0; u.fled = true; }
  });
  blog('⚡ Tự động giải quyết trận đánh.', -1);
  endBattle(winner);
}

function setupBattleCanvas(){
  const cv = $('battleCanvas');
  if(!cv) return;
  const wrap = cv.parentElement;
  const w = Math.max(240, Math.floor(wrap.clientWidth || 960));
  const h = Math.max(180, Math.floor(wrap.clientHeight || (w*(BH/BW))));
  const dpr = Math.max(1, Math.min(3, window.devicePixelRatio||1));
  const targetW = Math.round(w*dpr), targetH = Math.round(h*dpr);
  if(cv.width!==targetW) cv.width = targetW;
  if(cv.height!==targetH) cv.height = targetH;
  cv.style.width = '100%';
  cv.style.height = '100%';
}

function drawUnitSprite(ctx, u, cx, cy, scale){
  const T = UNIT_TYPES[u.type];
  const side = u.side;
  const col = side===B.humanSide ? '#3355a8' : '#b23a3a';
  const colDark = side===B.humanSide ? '#1a2a5a' : '#6a1a1a';
  const colSkin = '#e8c39c';
  const walkY = Math.sin(u.walkPhase)*2;
  const facing = u.facing;
  const flip = (facing===2) ? -1 : 1;
  let lx = 0, ly = 0;
  if(u.lungeT){
    const e = performance.now() - u.lungeT;
    if(e < 350){
      const pr = e/350;
      const push = Math.sin(pr*Math.PI) * 14;
      lx = u.lungeDir[0] * push;
      ly = u.lungeDir[1] * push;
    } else { u.lungeT = 0; }
  }
  ctx.save();
  ctx.translate(cx + lx, cy + ly + walkY);
  ctx.scale(flip*scale, scale);
  ctx.globalAlpha = u.fled ? u.fade : (u.hidden && u.inFort ? 0.35 : 1);

  ctx.beginPath();
  ctx.ellipse(0, 20-walkY, 15, 5, 0, 0, Math.PI*2);
  ctx.fillStyle='#00000044'; ctx.fill();

  ctx.strokeStyle = colDark;
  ctx.lineWidth = 1.5;

  ctx.fillStyle = colDark;
  ctx.beginPath(); ctx.ellipse(-6, 16, 4, 3, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6, 16, 4, 3, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(-9, -6); ctx.lineTo(9, -6); ctx.lineTo(10, 14); ctx.lineTo(-10, 14); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c9b183';
  ctx.beginPath();
  ctx.moveTo(-8, -4); ctx.lineTo(8, -4); ctx.lineTo(7, 6); ctx.lineTo(-7, 6); ctx.closePath();
  ctx.fill();

  ctx.fillStyle = colSkin;
  ctx.beginPath(); ctx.arc(0, -14, 7, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = colDark; ctx.stroke();
  ctx.fillStyle = colDark;
  ctx.beginPath();
  ctx.arc(0, -14, 7.5, Math.PI*0.95, Math.PI*0.05, false);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#000';
  const eyeX = facing===0 ? 3 : facing===2 ? -3 : 0;
  ctx.beginPath(); ctx.arc(eyeX, -13, 1.2, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 2;
  if(u.type==='spear'){
    ctx.beginPath(); ctx.moveTo(6, -4); ctx.lineTo(20, -28); ctx.stroke();
    ctx.fillStyle='#e8c15a';
    ctx.beginPath(); ctx.moveTo(20,-28); ctx.lineTo(24,-32); ctx.lineTo(19,-32); ctx.closePath(); ctx.fill();
  } else if(u.type==='sword'){
    ctx.beginPath(); ctx.moveTo(5, -6); ctx.lineTo(16, -22); ctx.stroke();
    ctx.strokeStyle='#8b2e2e'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(16,-22); ctx.lineTo(20,-26); ctx.stroke();
  } else if(u.type==='archer'){
    ctx.strokeStyle='#8b6a3e'; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.arc(10, -6, 9, -Math.PI*0.7, Math.PI*0.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(10,-6+8); ctx.lineTo(10,-6-8); ctx.stroke();
  } else if(u.type==='xbow'){
    ctx.strokeStyle='#8b6a3e'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(2, -2); ctx.lineTo(16, -10); ctx.stroke();
    ctx.strokeStyle='#666'; ctx.beginPath(); ctx.moveTo(10, -12); ctx.lineTo(10, -4); ctx.stroke();
  } else if(u.type==='lcav'){
    ctx.fillStyle = '#8b6a3e';
    ctx.beginPath(); ctx.ellipse(0, 16, 14, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = colDark;
    ctx.beginPath(); ctx.ellipse(-12, 10, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(6, -4); ctx.lineTo(20, -24); ctx.stroke();
  } else if(u.type==='hcav'){
    ctx.fillStyle = '#6a4a2a';
    ctx.beginPath(); ctx.ellipse(0, 16, 16, 7, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = colDark;
    ctx.beginPath(); ctx.ellipse(-13, 10, 6, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4a4a4a';
    ctx.beginPath(); ctx.ellipse(6, 14, 8, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(6, -4); ctx.lineTo(22, -28); ctx.stroke();
  } else if(u.type==='siege'){
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(-14, -4, 28, 18);
    ctx.strokeStyle='#2a1a0a';
    ctx.strokeRect(-14,-4,28,18);
    ctx.strokeStyle='#8b6a3e'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(8, -18); ctx.stroke();
    ctx.fillStyle='#666';
    ctx.beginPath(); ctx.arc(8,-18,4,0,Math.PI*2); ctx.fill();
  } else if(u.type==='gen'){
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(-10, -6); ctx.lineTo(10, -6); ctx.lineTo(11, 16); ctx.lineTo(-11, 16); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8b2e2e';
    ctx.beginPath(); ctx.moveTo(-9, -5); ctx.lineTo(-13, 14); ctx.lineTo(-4, 14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#e8c15a';
    ctx.beginPath();
    ctx.moveTo(-9, -18); ctx.lineTo(0, -26); ctx.lineTo(9, -18); ctx.lineTo(6, -14); ctx.lineTo(-6, -14); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#3a2a17'; ctx.lineWidth=1.6;
    ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(-8, -34); ctx.stroke();
    const wave = Math.sin(performance.now()*0.008 + u.id)*2;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(-8, -34); ctx.lineTo(2+wave, -30); ctx.lineTo(-8, -26); ctx.closePath();
    ctx.fill();
  }

  if(u.hitFlash > 0){
    ctx.globalAlpha = (u.hitFlash/320)*0.7;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = u.fled ? u.fade : (u.hidden && u.inFort ? 0.35 : 1);
  }

  ctx.restore();
}
function drawWeatherFX(ctx, cv, now){
  if(!GAME_SETTINGS.weather || !B.weather) return;
  const W = cv.width, H = cv.height;
  if(B.weather.id==='rain'){
    ctx.save();
    ctx.strokeStyle = 'rgba(180,210,240,0.55)';
    ctx.lineWidth = 1.2;
    const t = now * 0.4;
    for(let i=0;i<80;i++){
      const x = ((i*97 + t*0.7) % (W+40)) - 20;
      const y = ((i*61 + t*1.5) % (H+40)) - 20;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x-2, y+12); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(60,90,140,0.10)';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  } else if(B.weather.id==='snow'){
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const t = now * 0.15;
    for(let i=0;i<60;i++){
      const x = ((i*83 + t*0.5 + Math.sin(t+i)*10) % (W+20)) - 10;
      const y = ((i*47 + t) % (H+20)) - 10;
      ctx.beginPath(); ctx.arc(x, y, 1.8 + (i%3)*0.4, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(220,235,255,0.12)';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  } else if(B.weather.id==='fog'){
    ctx.save();
    ctx.fillStyle = 'rgba(230,230,220,0.22)';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  } else if(B.weather.id==='clear'){
    ctx.save();
    ctx.globalAlpha = 0.10;
    const g = ctx.createRadialGradient(W*0.3,H*0.1,20,W*0.3,H*0.1,W*0.6);
    g.addColorStop(0,'#fff8c0'); g.addColorStop(1,'rgba(255,248,192,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}

function renderBattle(now){
  if(!B || !B.active || !battleCtx) return;
  now = now || performance.now();
  const ctx = battleCtx;
  const cv = $('battleCanvas');
  if(!cv || !cv.width || !cv.height) return;
  const scaleX = cv.width / (BW*CS);
  const scaleY = cv.height / (BH*CS);
  const scale = Math.min(scaleX, scaleY);
  const offX = (cv.width - BW*CS*scale)/2;
  const offY = (cv.height - BH*CS*scale)/2;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  let sx=0, sy=0;
  if(B.shake.amt>0){ sx = (R()-0.5)*B.shake.amt; sy = (R()-0.5)*B.shake.amt; }
  ctx.setTransform(scale,0,0,scale,offX+sx*scale,offY+sy*scale);

  for(let y=0;y<BH;y++){
    for(let x=0;x<BW;x++){
      const t = B.grid[y][x];
      let c1 = '#8fae63', c2 = '#7a9b52';
      if(t==='forest'){ c1='#4e7a3a'; c2='#3a5a28'; }
      else if(t==='hill'){ c1='#a08a55'; c2='#8a7345'; }
      else if(t==='marsh'){ c1='#6f8a72'; c2='#5a7260'; }
      else if(t==='river'){ c1='#4a6a8a'; c2='#3a5a7a'; }
      const g = ctx.createLinearGradient(x*CS, y*CS, x*CS, y*CS+CS);
      g.addColorStop(0, c1); g.addColorStop(1, c2);
      ctx.fillStyle = g;
      ctx.fillRect(x*CS, y*CS, CS, CS);
      ctx.globalAlpha = 0.08;
      ctx.fillStyle = '#000';
      for(let k=0;k<3;k++){
        const nx = x*CS + hash2(x*7+k, y*11)*CS;
        const ny = y*CS + hash2(x*13+k, y*17)*CS;
        ctx.fillRect(nx, ny, 2, 2);
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle='rgba(0,0,0,0.08)';
      ctx.strokeRect(x*CS+.5,y*CS+.5,CS-1,CS-1);
      if(t==='forest'){
        for(let k=0;k<2;k++){
          const tx=x*CS+10+k*16, ty=y*CS+28-(k%2)*4;
          ctx.fillStyle='#2a4a1a';
          ctx.beginPath(); ctx.moveTo(tx,ty-14); ctx.lineTo(tx-6,ty+1); ctx.lineTo(tx+6,ty+1); ctx.closePath(); ctx.fill();
          ctx.fillStyle='#5a8a3a';
          ctx.beginPath(); ctx.moveTo(tx,ty-11); ctx.lineTo(tx-4,ty-1); ctx.lineTo(tx+4,ty-1); ctx.closePath(); ctx.fill();
          ctx.fillStyle='#4a3a20';
          ctx.fillRect(tx-1, ty, 2, 2);
        }
      } else if(t==='hill'){
        const tx=x*CS+CS/2, ty=y*CS+CS*0.75;
        ctx.fillStyle='rgba(80,60,30,0.35)';
        ctx.beginPath(); ctx.ellipse(tx+1,ty+1,10,6,0,Math.PI,Math.PI*2); ctx.fill();
        ctx.fillStyle='#b8a070';
        ctx.beginPath(); ctx.arc(tx,ty,9,Math.PI,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#7a6242'; ctx.lineWidth=1; ctx.stroke();
      } else if(t==='marsh'){
        ctx.fillStyle='rgba(120,180,200,0.35)';
        ctx.beginPath(); ctx.arc(x*CS+14,y*CS+26,5,0,Math.PI*2); ctx.arc(x*CS+28,y*CS+15,4,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#7a9a5a'; ctx.lineWidth=1.2;
        for(let k=0;k<3;k++){
          const bx = x*CS+6+k*12, by = y*CS+12;
          ctx.beginPath(); ctx.moveTo(bx, by+8); ctx.lineTo(bx+2, by-3); ctx.stroke();
        }
      } else if(t==='plain'){
        const wind = Math.sin(now*0.002 + x*0.5 + y*0.3)*1.5;
        ctx.strokeStyle='rgba(80,120,50,0.4)'; ctx.lineWidth=1;
        for(let k=0;k<3;k++){
          const bx = x*CS+6+k*10, by = y*CS+CS-6;
          ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx+2+wind, by-5); ctx.stroke();
        }
      }
      if(t==='plain' && hash2(x*3,y*5) < 0.15){
        ctx.strokeStyle='rgba(120,90,50,0.35)'; ctx.lineWidth=5;
        ctx.beginPath(); ctx.moveTo(x*CS, y*CS+CS/2); ctx.lineTo(x*CS+CS, y*CS+CS/2); ctx.stroke();
      }
      if(B.fire[y][x]>0){
        const ff = 0.35 + 0.2*B.fire[y][x];
        ctx.fillStyle='rgba(255,120,40,'+ff+')';
        ctx.fillRect(x*CS, y*CS, CS, CS);
        ctx.font='20px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('🔥', x*CS+CS/2, y*CS+CS/2 + Math.sin(now*0.01+x)*2);
      }
    }
  }
  if(B.hasFort && B.wall && B.wall.length === BH){
    for(let y=0;y<BH;y++){
      for(let x=0;x<BW;x++){
        if(B.wall[y][x]>0){
          if(isGateTile(x,y)){
            const ratio = B.gate.hp / B.gate.maxHp;
            const g = ctx.createLinearGradient(x*CS, y*CS, x*CS, y*CS+CS);
            g.addColorStop(0, ratio>0?'#7a5a3a':'#3a2a17');
            g.addColorStop(1, ratio>0?'#5a3a1a':'#2a1a0a');
            ctx.fillStyle = g;
            ctx.fillRect(x*CS, y*CS, CS, CS);
            ctx.strokeStyle='#2a1a0a'; ctx.lineWidth=2;
            ctx.strokeRect(x*CS+2, y*CS+2, CS-4, CS-4);
            for(let k=0;k<CS;k+=8){
              ctx.beginPath(); ctx.moveTo(x*CS+k, y*CS+2); ctx.lineTo(x*CS+k, y*CS+CS-2); ctx.stroke();
            }
            ctx.fillStyle='#00000066'; ctx.fillRect(x*CS+6, y*CS-10, CS-12, 5);
            ctx.fillStyle = ratio>0.5?'#5dd35d': ratio>0.25?'#e8c15a':'#c56a5a';
            ctx.fillRect(x*CS+6, y*CS-10, (CS-12)*Math.max(0,ratio), 5);
            ctx.font='9px sans-serif'; ctx.fillStyle='#f5ecd6'; ctx.textAlign='center'; ctx.textBaseline='middle';
            ctx.fillText(B.gate.hp>0?('Cổng '+Math.round(B.gate.hp)):'ĐÃ VỠ', x*CS+CS/2, y*CS+CS/2);
          } else {
            const g = ctx.createLinearGradient(x*CS, y*CS, x*CS, y*CS+CS);
            g.addColorStop(0, '#8a8a8a'); g.addColorStop(1, '#4a4a4a');
            ctx.fillStyle = g;
            ctx.fillRect(x*CS, y*CS, CS, CS);
            ctx.fillStyle='#9a9a9a';
            for(let k=0;k<CS;k+=12) ctx.fillRect(x*CS+k, y*CS-3, 7, 5);
            ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=1;
            for(let k=0;k<CS;k+=12) ctx.strokeRect(x*CS+k, y*CS, 12, CS/2);
            ctx.strokeStyle='#2a2a2a'; ctx.lineWidth=1.5;
            ctx.strokeRect(x*CS+.5, y*CS+.5, CS-1, CS-1);
          }
        }
      }
    }
  }
  const sel = B.selected;
  if(sel && !sel.fled && sel.hp>0 && sel.side===B.humanSide && B.turn===sel.side && !B.humanSkillPending && !B.autoPlay){
    if(!sel.hasMoved){
      const rs = reachable(sel);
      rs.forEach(k=>{
        const x=k%BW, y=Math.floor(k/BW);
        ctx.fillStyle='rgba(60,140,220,0.35)';
        ctx.fillRect(x*CS,y*CS,CS,CS);
        ctx.strokeStyle='rgba(120,200,255,0.5)';
        ctx.strokeRect(x*CS+2,y*CS+2,CS-4,CS-4);
      });
    }
    if(!sel.hasActed){
      B.units.forEach(o=>{
        if(o.fled||o.hp<=0||o.side===sel.side) return;
        if(o.hidden && !o.inFort) return;
        const d=Math.abs(o.x-sel.x)+Math.abs(o.y-sel.y);
        if(d<=unitRangeOf(sel)){
          ctx.fillStyle='rgba(210,50,50,0.45)';
          ctx.fillRect(o.x*CS,o.y*CS,CS,CS);
          ctx.strokeStyle='rgba(255,120,120,0.6)';
          ctx.strokeRect(o.x*CS+2,o.y*CS+2,CS-4,CS-4);
          if(B.hoverTarget===o.id){
            const pred = predictDamage(sel, o);
            const critPct = 12 + (sel.buffs.some(b=>b.id==='power_slash')?15:0);
            const pct = Math.round(pred.dmg / o.maxHp * 100);
            ctx.fillStyle='#1a1208ee'; ctx.fillRect(o.x*CS-50, o.y*CS-42, 120, 40);
            ctx.fillStyle='#f5ecd6'; ctx.font='bold 11px sans-serif';
            ctx.textAlign='center'; ctx.textBaseline='top';
            ctx.fillText('~'+pred.dmg+' sát thương ('+pct+'%)', o.x*CS+CS/2, o.y*CS-38);
            ctx.fillStyle='#e8c15a';
            ctx.fillText(critPct+'% chí mạng', o.x*CS+CS/2, o.y*CS-26);
            const TA = UNIT_TYPES[sel.type], TD = UNIT_TYPES[o.type];
            const better = (TA.spear && TD.cav) || (TA.cav && !TD.spear) || (TD.spear && !TA.cav);
            const worse = (TD.spear && TA.cav);
            ctx.fillStyle = worse ? '#ff6b5a' : better ? '#7fd35d' : '#aaa';
            ctx.fillText(worse ? '✗ Bất lợi' : better ? '✓ Lợi thế' : '—', o.x*CS+CS/2, o.y*CS-14);
          }
        }
      });
      if(sel.side===0 && B.hasFort && B.gate && B.gate.hp>0){
        const d = Math.abs(B.gate.x-sel.x)+Math.abs(B.gate.y-sel.y);
        if(d <= unitRangeOf(sel)){
          ctx.fillStyle='rgba(255,180,60,0.55)';
          ctx.fillRect(B.gate.x*CS, B.gate.y*CS, CS, CS);
        }
      }
    }
  }
  if(B.humanSkillPending && sel && sel.type==='archer'){
    const range = unitRangeOf(sel)+1;
    for(let y=0;y<BH;y++) for(let x=0;x<BW;x++){
      if(Math.abs(x-sel.x)+Math.abs(y-sel.y)<=range){
        ctx.fillStyle='rgba(120,200,80,0.25)';
        ctx.fillRect(x*CS,y*CS,CS,CS);
      }
    }
  }
  B.projectiles.forEach(p=>{
    const t = p.t / p.dur;
    const x = p.x0 + (p.x1-p.x0)*t;
    const arc = Math.sin(t*Math.PI) * (p.type==='stone'?40:24);
    const y = p.y0 + (p.y1-p.y0)*t - arc;
    if(p.type==='arrow'){
      ctx.strokeStyle='#e8d7a0'; ctx.lineWidth=2;
      ctx.beginPath();
      const dx = p.x1-p.x0, dy = p.y1-p.y0;
      const len = Math.hypot(dx,dy) || 1;
      const ux = dx/len*8, uy = dy/len*8;
      ctx.moveTo(x-ux, y-uy); ctx.lineTo(x+ux, y+uy);
      ctx.stroke();
    } else {
      const g = ctx.createRadialGradient(x,y,1,x,y,8);
      g.addColorStop(0,'#ffcc66'); g.addColorStop(1,'#5a5a5a');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x,y,6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='#3a3a3a'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle='rgba(255,140,40,0.6)';
      ctx.beginPath(); ctx.arc(x - Math.sign(p.x1-p.x0)*6, y - Math.sign(p.y1-p.y0)*6 + 4, 3, 0, Math.PI*2); ctx.fill();
    }
  });
  B.units.forEach(u2=>{
    if(u2.fade<=0) return;
    if(u2.hidden && u2.side!==B.humanSide && !u2.inFort){
      const near = B.units.some(o=>o.side===B.humanSide && !o.fled && o.hp>0 && Math.abs(o.x-u2.x)+Math.abs(o.y-u2.y)<=1);
      if(!near) return;
    }
    const cx = u2.px + CS/2, cy = u2.py + CS/2;
    drawUnitSprite(ctx, u2, cx, cy, 0.78);

    const hpw = 30;
    ctx.fillStyle='#00000077'; ctx.fillRect(cx-hpw/2, cy-28, hpw, 4);
    ctx.fillStyle = u2.hp/u2.maxHp > 0.5 ? '#5dd35d' : u2.hp/u2.maxHp > 0.25 ? '#e8c15a' : '#c56a5a';
    ctx.fillRect(cx-hpw/2, cy-28, hpw*clamp(u2.hp/u2.maxHp,0,1), 4);
    const mState = moraleState(u2);
    const mCol = mState==='steady' ? '#e8c15a' : mState==='wavering' ? '#e8944a' : '#c55a5a';
    ctx.fillStyle='#00000077'; ctx.fillRect(cx-hpw/2, cy+20, hpw, 3);
    ctx.fillStyle=mCol; ctx.fillRect(cx-hpw/2, cy+20, hpw*clamp(u2.mor/u2.maxMor,0,1), 3);

    if(u2.id===sel?.id){
      ctx.strokeStyle='#ffe680'; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(cx,cy,19,0,Math.PI*2); ctx.stroke();
    }
    if(u2.level>=2){
      ctx.font='10px serif'; ctx.fillStyle='#ffd75a'; ctx.textAlign='right'; ctx.textBaseline='top';
      ctx.fillText('★'+u2.level, cx+16, cy-30);
    }
    if(!u2.fled && u2.hp>0){
      const dv = DIR_VEC[u2.facing];
      ctx.strokeStyle='#ffe680'; ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(cx + dv[0]*16, cy + dv[1]*16);
      ctx.lineTo(cx + dv[0]*23, cy + dv[1]*23);
      ctx.stroke();
    }
    let icX = cx - 18;
    const icY = cy - 34;
    if(u2.buffs.length){
      u2.buffs.forEach(b=>{
        ctx.font='10px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText(b.id==='brace'?'🛡':b.id==='power_slash'?'💥':b.id==='pierce'?'🎯':b.id==='withdraw'?'💨':b.id==='knockback'?'🐎':b.id==='fire_stone'?'🔥':'★', icX, icY);
        icX += 11;
      });
    }
    if(moraleState(u2)==='panic'){
      ctx.font='11px serif'; ctx.fillText('😱', icX, icY);
      icX += 11;
    }
    if(u2.hidden && u2.inFort){
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.font='18px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('🏯', cx, cy - 2);
      ctx.restore();
    } else if(u2.hidden){
      ctx.font='11px serif'; ctx.fillText('🌿', icX, icY);
    }
  });
  B.fx.forEach(f=>{
    const p = f.t/f.dur;
    ctx.globalAlpha = Math.max(0,1-p);
    ctx.font = `bold ${Math.round(16*f.scale)}px sans-serif`;
    ctx.textAlign='center'; ctx.lineWidth=3; ctx.strokeStyle='#000'; ctx.fillStyle=f.col;
    const px=f.x*CS+CS/2, py=f.y*CS+6-p*26;
    ctx.strokeText(f.txt, px, py); ctx.fillText(f.txt, px, py);
    ctx.globalAlpha=1;
  });

  ctx.setTransform(1,0,0,1,0,0);
  drawWeatherFX(ctx, cv, now);

  const roundBadge = $('battleRoundBadge');
  if(roundBadge) roundBadge.textContent = `Lượt ${B.round} · ${B.turn===B.humanSide && !B.autoPlay ? 'BẠN' : 'AI'}`;
  const banner = $('battleBanner');
  if(banner){
    if(B.banner.t){
      banner.textContent = B.banner.text;
      const e = performance.now() - B.banner.t;
      const a = e < 400 ? e/400 : e > B.banner.dur-500 ? Math.max(0,(B.banner.dur-e)/500) : 1;
      banner.style.opacity = a;
    } else { banner.style.opacity = 0; }
  }
  const wt = $('weatherTag');
  if(wt){ const w = B.weather; wt.textContent = `${w.icon} ${w.name}`; wt.title = w.desc; }
  if(B.infoDirty) renderBattleInfo();
}

/* ========================= 9. DI CHUYỂN CHIẾN LƯỢC ========================= */
async function resolveArmyMove(army, targetRegion, isAI){
  const from = S.regions[army.region];
  if(!from.neighbors.includes(targetRegion.id)) return;
  const enemyArmy = S.armies.find(a=>a.region===targetRegion.id && a.faction!==army.faction && a.units.length>0);
  if(targetRegion.owner===army.faction){
    army.region = targetRegion.id;
    if(isAI) return;
    render();
    return;
  }
  if(targetRegion.owner===null){
    const gp = (targetRegion.garrison||0);
    const myPower = armyPower(army);
    if(gp*30 < myPower*0.6 || gp===0){
      targetRegion.owner = army.faction;
      targetRegion.garrison = 0;
      army.region = targetRegion.id;
      chron(`${S.factions[army.faction].short} sáp nhập ${targetRegion.name}.`);
      logEvent(`🏳 ${targetRegion.name} đầu hàng ${S.factions[army.faction].short}.`, army.faction);
      invalidateStaticMap();
      render();
      return;
    }
    const count = Math.min(16, 2 + Math.max(1,gp)*2);
    const defArmy = {
      id: S.nextArmyId++, faction:-1, region:targetRegion.id,
      general: newGeneral(),
      units: Array.from({length:count}, ()=>newStrategicUnit('archer')),
      moved:true,
      isGarrison:true
    };
    await startBattle(army, defArmy, targetRegion, {autoPlay: S.autoBattlePreference});
    return;
  }
  const defFaction = targetRegion.owner;
  if(!S.factions[army.faction].wars.includes(defFaction)){ declareWar(army.faction, defFaction); }
  if(enemyArmy){
    await startBattle(army, enemyArmy, targetRegion, {autoPlay: S.autoBattlePreference});
  } else {
    const count = Math.min(16, 2 + targetRegion.fort*3);
    const defArmy = {
      id: S.nextArmyId++, faction:defFaction, region:targetRegion.id,
      general: newGeneral(),
      units: Array.from({length:count}, ()=>newStrategicUnit('archer')),
      moved:true,
      isGarrison:true
    };
    await startBattle(army, defArmy, targetRegion, {autoPlay: S.autoBattlePreference});
  }
}

const mapCv = $('map');
const mapCtx = mapCv.getContext('2d');
const miniCv = $('mapMiniCanvas');
const miniCtx = miniCv ? miniCv.getContext('2d') : null;
let mapTransform = {scale:1, ox:0, oy:0, dpr:1};
let mapView = {scale:1, ox:0, oy:0, dpr:1, fitScale:1, userZoom:false, dragging:false, sx:0, sy:0, startOx:0, startOy:0, lastPointer:null};
let mapPointer = {x:0,y:0,inside:false};
const MAP_W=1000, MAP_H=700;

const CACHE_SCALE = 2;
let mapStaticCache = null;
let mapStaticOwnerKey = '';
let lastCaptureFlash = null;
function invalidateStaticMap(){ mapStaticCache = null; mapStaticOwnerKey = ''; }
function ownerKeyOf(){
  if(!S) return '';
  return S.regions.map(r=>r.owner===null?'n':r.owner).join(',');
}
function buildStaticMap(){
  if(!S) return;
  const key = ownerKeyOf();
  if(mapStaticCache && key === mapStaticOwnerKey) return;
  const cv = document.createElement('canvas');
  cv.width = MAP_W * CACHE_SCALE;
  cv.height = MAP_H * CACHE_SCALE;
  const c = cv.getContext('2d');
  c.setTransform(CACHE_SCALE,0,0,CACHE_SCALE,0,0);
  drawSeaTo(c);
  drawLandBaseTo(c);
  drawRegionsTo(c);
  drawTerrainTo(c);
  drawRivers(c);
  drawCastlesTo(c);
  mapStaticCache = cv;
  mapStaticOwnerKey = key;
}

function polygonPath(ctx, poly){
  if(!poly || poly.length<3) return false;
  ctx.beginPath(); ctx.moveTo(poly[0].x,poly[0].y);
  for(let i=1;i<poly.length;i++) ctx.lineTo(poly[i].x,poly[i].y);
  ctx.closePath(); return true;
}
function fitMapView(){
  const wrap=$('mapwrap');
  const w=Math.max(1,wrap.clientWidth), h=Math.max(1,wrap.clientHeight);
  const fit=Math.min(w/MAP_W,h/MAP_H);
  mapView.fitScale=fit;
  mapView.scale=fit;
  mapView.ox=(w-MAP_W*fit)/2;
  mapView.oy=(h-MAP_H*fit)/2;
  mapView.userZoom=false;
  syncMapTransform();
}
function syncMapTransform(){
  const wrap=$('mapwrap'); const w=wrap.clientWidth, h=wrap.clientHeight;
  mapView.scale=clamp(mapView.scale,mapView.fitScale*0.72,Math.max(mapView.fitScale*2.2,mapView.fitScale+0.35));
  const margin=120;
  const minOx = w-MAP_W*mapView.scale-margin, maxOx=margin;
  const minOy = h-MAP_H*mapView.scale-margin, maxOy=margin;
  if(mapView.scale<=mapView.fitScale+0.001){ mapView.ox=(w-MAP_W*mapView.scale)/2; mapView.oy=(h-MAP_H*mapView.scale)/2; }
  else { mapView.ox=clamp(mapView.ox,minOx,maxOx); mapView.oy=clamp(mapView.oy,minOy,maxOy); }
  mapTransform={scale:mapView.scale,ox:mapView.ox,oy:mapView.oy,dpr:mapView.dpr};
  const z=Math.round(mapView.scale/mapView.fitScale*100);
  const zr=$('mapZoomReadout'); if(zr) zr.textContent=z+'%';
}
function resizeMap(){
  const wrap=$('mapwrap');
  const dpr=Math.max(1,Math.min(3,window.devicePixelRatio||1));
  const w=Math.max(1,wrap.clientWidth), h=Math.max(1,wrap.clientHeight);
  mapCv.width=Math.round(w*dpr); mapCv.height=Math.round(h*dpr);
  mapCv.style.width=w+'px'; mapCv.style.height=h+'px';
  mapView.dpr=dpr;
  if(!mapView.userZoom) fitMapView(); else syncMapTransform();
  render();
}
function toWorld(px,py){
  return {x:(px-mapView.ox)/mapView.scale,y:(py-mapView.oy)/mapView.scale};
}
function setMapZoom(next, px, py){
  const old=mapView.scale;
  const min=mapView.fitScale*0.72, max=Math.max(mapView.fitScale*2.2,mapView.fitScale+0.35);
  next=clamp(next,min,max);
  if(Math.abs(next-old)<0.0001) return;
  const wpt=toWorld(px,py);
  mapView.scale=next;
  mapView.ox=px-wpt.x*next;
  mapView.oy=py-wpt.y*next;
  mapView.userZoom=true;
  syncMapTransform(); render();
}
function centerMapOnWorld(x,y,zoom){
  const wrap=$('mapwrap');
  if(zoom) { mapView.scale=clamp(zoom,mapView.fitScale*0.72,mapView.fitScale*2.2); mapView.userZoom=true; }
  mapView.ox=wrap.clientWidth/2-x*mapView.scale;
  mapView.oy=wrap.clientHeight/2-y*mapView.scale;
  syncMapTransform(); render();
}

/* ===== BIỂN ===== */
function drawSeaTo(ctx){
  const w=MAP_W,h=MAP_H;
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#d8ceb0');
  g.addColorStop(.3,'#d0c5a2');
  g.addColorStop(.7,'#c8bc98');
  g.addColorStop(1,'#c0b490');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);

  ctx.save(); ctx.globalAlpha=.09; ctx.strokeStyle='#8a7a5a'; ctx.lineWidth=1;
  for(let y=18;y<h;y+=24){
    ctx.beginPath();
    for(let x=0;x<w;x+=16){
      const yy=y+Math.sin(x*.025+y*.07)*2.5;
      if(x===0)ctx.moveTo(x,yy); else ctx.lineTo(x,yy);
    }
    ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = 0.15;
  ctx.strokeStyle = '#8a6a3a';
  LANDMASSES.forEach(m=>{
    const poly=m.map(p=>({x:p[0],y:p[1]}));
    if(!polygonPath(ctx,poly)) return;
    ctx.lineWidth = 6;
    ctx.stroke();
  });
  ctx.restore();

  drawCornerOrnaments(ctx, w, h);
}
function drawCornerOrnaments(ctx, w, h){
  ctx.save();
  ctx.strokeStyle='#7a6242'; ctx.lineWidth=2;
  const s = 70;
  ctx.beginPath();
  ctx.moveTo(20, 20+s); ctx.lineTo(20,20); ctx.lineTo(20+s, 20);
  ctx.moveTo(w-20-s, 20); ctx.lineTo(w-20,20); ctx.lineTo(w-20,20+s);
  ctx.moveTo(20, h-20-s); ctx.lineTo(20,h-20); ctx.lineTo(20+s, h-20);
  ctx.moveTo(w-20-s, h-20); ctx.lineTo(w-20,h-20); ctx.lineTo(w-20,h-20-s);
  ctx.stroke();
  ctx.fillStyle = '#b8860b';
  [[20,20],[w-20,20],[20,h-20],[w-20,h-20]].forEach(([x,y])=>{
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
  });
  ctx.strokeStyle='#7a6242'; ctx.lineWidth=1;
  ctx.strokeRect(12,12,w-24,h-24);
  ctx.strokeRect(16,16,w-32,h-32);
  ctx.restore();
  drawCompassRose(ctx, 60, 60, 28);
}
function drawCompassRose(ctx, cx, cy, r){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle='#2a2018'; ctx.globalAlpha=0.9;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle='#b8860b'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4;
    const len = (i%2===0) ? r*0.85 : r*0.55;
    ctx.strokeStyle = (i===0) ? '#e8c15a' : '#c9b183';
    ctx.lineWidth = (i%2===0) ? 1.6 : 1;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.lineTo(Math.sin(a)*len, -Math.cos(a)*len);
    ctx.stroke();
  }
  ctx.fillStyle='#e8c15a';
  ctx.font='bold 11px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('N', 0, -r-8);
  ctx.restore();
}
