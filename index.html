<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tam Quốc Trung Hoa — Đổng Trác Loạn Kinh</title>
<style>
:root{
  --parch:#e9dcbe; --parch2:#d8c7a0; --ink:#3a2a17; --ink2:#6d5638;
  --gold:#b8860b; --blood:#8b2e2e; --sea:#bdb192; --line:#7a6242;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:#15110b;color:var(--ink);
  font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  font-size:14px;user-select:none;
}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}

#topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:6px 10px;background:linear-gradient(#3a2c1a,#241a0e);
  border-bottom:2px solid var(--gold);color:#e8dcbe;font-size:13px;min-height:44px;
}
#topbar .tb{display:flex;align-items:center;gap:4px;background:#00000033;padding:3px 8px;border-radius:4px;border:1px solid #ffffff1a}
#topbar .lbl{color:#b39b6d;font-size:11px;letter-spacing:.5px}
#topbar .val{color:#f2e6c8;font-weight:bold}
#topbar #btnUndo{background:linear-gradient(#d8b7a6,#b8795f);color:#32170f}
#topbar #btnUndo:disabled{filter:grayscale(.7);opacity:.38}
body{font-size:calc(14px * var(--font-scale,1))}
body.reduced-motion *,body.reduced-motion *::before,body.reduced-motion *::after{
  animation-duration:.001ms!important;animation-iteration-count:1!important;
  transition-duration:.001ms!important;scroll-behavior:auto!important;
}
#factionTag{display:flex;align-items:center;gap:6px}
#factionTag .sw{width:14px;height:14px;border:1px solid #000;border-radius:2px}
.spacer{flex:1}
button{
  font-family:inherit;font-size:13px;cursor:pointer;
  background:linear-gradient(#c9b183,#9e8354);color:#2a1d0d;
  border:1px solid #6b5432;border-radius:4px;padding:6px 12px;
  box-shadow:0 1px 0 #ffffff44 inset,0 1px 2px #0006;transition:.12s;
}
button:hover{filter:brightness(1.1)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
button.pri{background:linear-gradient(#d9a441,#a8761c);color:#20160a}
button.dng{background:linear-gradient(#c56a5a,#8b2e2e);color:#fff}
button.sk{background:linear-gradient(#7fa85c,#4d7a35);color:#0e1a08}
button.auto{background:linear-gradient(#d4741f,#8b2e2e);color:#fff;animation:pulse 1.6s infinite}
button.bld{background:linear-gradient(#a8c98a,#6a9e4a);color:#1a2a0a;font-size:11.5px;padding:4px 7px}
button.cap{background:linear-gradient(#e8c15a,#b8860b);color:#2a1d0d;font-size:11.5px;padding:4px 7px}
button.mom{background:linear-gradient(#e8c15a,#a8761c);color:#2a1d0d;animation:pulse 1.2s infinite}
button.duel{background:linear-gradient(#b25a2e,#7a2e1a);color:#fff}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}

#main{flex:1;display:flex;min-height:0;position:relative}
#mapwrap{flex:1;position:relative;min-width:0;background:var(--sea);overflow:hidden}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#map.isPanning{cursor:grabbing}
#side{
  width:330px;flex:none;background:linear-gradient(#efe3c6,#ddcda6);
  border-left:2px solid var(--line);overflow-y:auto;padding:10px;
}
#side h3{font-size:14px;color:#5a3f1e;border-bottom:1px solid #b8a57e;margin:10px 0 6px;padding-bottom:3px;letter-spacing:.5px}
#side h3:first-child{margin-top:0}
.card{background:#00000008;border:1px solid #b8a57e;border-radius:5px;padding:7px 9px;margin-bottom:7px;font-size:13px;line-height:1.45}
.card .t{font-weight:bold;color:#4a3418}
.pill{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;background:#00000012;border:1px solid #0000001a;margin:1px 2px 1px 0}
.pill.g{background:#c9a22733;border-color:#c9a22766}
.pill.r{background:#8b2e2e33;border-color:#8b2e2e66}
.pill.b{background:#3355a833;border-color:#3355a866}
.pill.w{background:#7a5a1f33;border-color:#7a5a1f66}
.pill.cap{background:#e8c15a55;border-color:#b8860b88;font-weight:bold}
.hint{font-size:11.5px;color:#7a6242;font-style:italic}
.bldGrid{display:grid;grid-template-columns:1fr;gap:4px;margin-top:6px}

.ov{position:fixed;inset:0;background:#0b0805cc;display:flex;align-items:center;justify-content:center;
    z-index:50;padding:14px;backdrop-filter:blur(2px)}
.ov.hidden{display:none}
.panel{
  background:linear-gradient(#f3e8cd,#e0d0aa);border:3px double var(--line);border-radius:8px;
  max-width:820px;width:100%;max-height:92vh;overflow-y:auto;padding:18px 20px;
  box-shadow:0 12px 40px #000a;
}
.panel h2{font-size:20px;color:#4a3418;margin-bottom:10px;letter-spacing:.5px}
.panel p{margin:7px 0;line-height:1.55}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.choices button{text-align:left;padding:10px 14px;font-size:13.5px;line-height:1.4}
.factions{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin-top:10px}
.fcard{border:2px solid #b8a57e;border-radius:6px;padding:9px;cursor:pointer;background:#00000006;transition:.12s}
.fcard:hover{border-color:var(--gold);background:#c9a22722;transform:translateY(-2px)}
.fcard .fn{font-weight:bold;font-size:14px;display:flex;align-items:center;gap:7px}
.fcard .sw{width:16px;height:16px;border:1px solid #0008;border-radius:2px;flex:none}
.fcard .fd{font-size:11.5px;color:#6d5638;margin-top:5px;line-height:1.35}

#battleOv{padding:10px}
#battleOv .panel{
  max-width:min(1440px,99vw);width:min(1440px,99vw);
  height:min(96dvh,940px);max-height:96dvh;
  padding:11px 12px;overflow:hidden;display:flex;flex-direction:column;gap:8px;
}
#battlePanel{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;overflow:hidden}
#battleWrap{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,360px);
  gap:12px;align-items:stretch;min-height:0;flex:1 1 auto;overflow:hidden;
}
#battleCanvasWrap{
  width:100%;min-width:0;min-height:0;position:relative;
  background:radial-gradient(circle at 50% 45%,#5e6e4a,#26301f 78%);
  border:2px solid #5e472b;border-radius:8px;overflow:hidden;
  box-shadow:inset 0 0 0 1px #ffffff12,0 8px 24px #0007;
}
#battleCanvas{display:block;width:100%!important;height:100%!important;max-width:none;max-height:none;touch-action:none;cursor:crosshair}
#battleInfo{
  width:auto;min-width:0;max-height:100%;overflow:auto;padding:8px;
  background:linear-gradient(180deg,#f2e7cf,#dfceaa);border:1px solid #b39a6c;border-radius:7px;
  box-shadow:inset 0 0 14px #00000008;font-size:12.5px;
}
#battleInfo .card{background:#fff8e322}
#battleInfo .autoBadge{position:sticky;top:0;z-index:5;
  background:linear-gradient(90deg,#d4741f,#8b2e2e);color:#fff;text-align:center;
  padding:4px;border-radius:5px;font-weight:bold;letter-spacing:1px;margin-bottom:6px;
  animation:pulse 1.4s infinite;box-shadow:0 2px 8px #0006}
#battleInfo .pauseBadge{position:sticky;top:0;z-index:5;
  background:linear-gradient(90deg,#3f8f4a,#2a6a35);color:#fff;text-align:center;
  padding:4px;border-radius:5px;font-weight:bold;letter-spacing:1px;margin-bottom:6px;
  box-shadow:0 2px 8px #0006}
.battleTitlebar{display:flex;align-items:center;gap:9px;padding:7px 9px;
  background:linear-gradient(90deg,#332512,#1f170e);border:1px solid #8e6c36;border-radius:7px;color:#f6e9cb;box-shadow:0 3px 12px #0005}
.battleTitlebar .btMain{font-weight:700;font-size:16px;letter-spacing:.25px}
.battleTitlebar .btSub{font-size:10.5px;color:#c9b48b}
.battleTitlebar .btRound{margin-left:auto;padding:4px 8px;border:1px solid #b8860b;border-radius:5px;background:#0005;font-size:11px;color:#ffe6a2}
.battleArenaBadge{position:absolute;left:10px;bottom:10px;z-index:5;padding:5px 8px;border-radius:5px;
  background:#1b130bd9;border:1px solid #b8860b;color:#f4e6c8;font-size:10.5px;box-shadow:0 3px 10px #0007;pointer-events:none}
.unitRow{display:flex;justify-content:space-between;padding:3px 5px;border-radius:3px;margin-bottom:3px;font-size:12px;background:#00000008}
.bl{max-height:185px;overflow-y:auto;font-size:11.5px;line-height:1.4;color:#5a4526;background:#00000006;border:1px solid #c0ad86;border-radius:4px;padding:6px;margin-top:8px}
.bl .l0{color:#3355a8}
.bl .l1{color:#8b2e2e}
.morBar{height:5px;background:#00000022;border-radius:3px;overflow:hidden;margin:2px 0}
.morBar>div{height:100%}
.hpBar{height:7px;background:#00000022;border-radius:3px;overflow:hidden;margin:2px 0}
.hpBar>div{height:100%;background:#5dd35d}
.banner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-size:30px;color:#f5ecd6;text-shadow:0 2px 14px #000,0 0 24px #b8860b;font-weight:bold;letter-spacing:2px;
  transition:opacity .8s;opacity:0}
.weatherTag{position:absolute;top:8px;right:10px;background:#1a1208cc;color:#f2e6c8;padding:4px 10px;border-radius:5px;font-size:12px;border:1px solid #b8860b;pointer-events:none}
.skillRow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.skillRow button{min-height:34px;font-size:12px;padding:6px 8px}
.fieldBadge{display:inline-block;padding:2px 6px;border-radius:10px;background:#6a8c4a33;border:1px solid #6a8c4a66;font-weight:bold;color:#385526}
.momBar{height:10px;background:#00000033;border-radius:5px;overflow:hidden;margin:4px 0;position:relative;border:1px solid #00000022}
.momBar>div{height:100%;transition:width .3s}
.momFill0{background:linear-gradient(90deg,#3355a8,#7fa8e8)}
.momFill1{background:linear-gradient(90deg,#b23a3a,#e88a7a)}
.momLabel{position:absolute;inset:0;text-align:center;font-size:9px;color:#fff;line-height:10px;text-shadow:0 0 4px #000;font-weight:bold}

.chr{font-size:13px;line-height:1.6;border-left:3px solid #b8a57e;padding-left:10px;margin:8px 0;color:#4a3418}
.chr .yr{color:#8b2e2e;font-weight:bold}

.mapHud{position:absolute;top:10px;left:10px;z-index:8;display:flex;gap:7px;align-items:flex-start;pointer-events:none}
.mapHud>*{pointer-events:auto}
.mapControlBox{display:flex;gap:4px;padding:5px;background:#24190dcc;border:1px solid #b8860b;border-radius:7px;box-shadow:0 4px 14px #0007;backdrop-filter:blur(3px)}
.mapControlBox button{width:34px;height:32px;padding:0;font-size:17px;background:linear-gradient(#e9d6a8,#ae935f);border-color:#624a2d}
.mapZoomReadout{min-width:54px;color:#f6ead0;display:flex;align-items:center;justify-content:center;font:700 11px Georgia,serif}
.mapLegend{padding:7px 9px;background:#24190dcc;color:#f6ead0;border:1px solid #b8860b;border-radius:7px;box-shadow:0 4px 14px #0007;max-width:250px;font-size:11px;line-height:1.35;backdrop-filter:blur(3px)}
.mapLegend strong{display:block;margin-bottom:4px;color:#ffe49b;letter-spacing:.4px}
.legendRow{display:flex;align-items:center;gap:6px;margin:2px 0}
.legendDot{width:12px;height:12px;border-radius:3px;border:1px solid #0008;flex:none}
.mapMini{position:absolute;left:10px;bottom:10px;width:210px;aspect-ratio:10/7;border:2px solid #b8860b;border-radius:7px;overflow:hidden;box-shadow:0 5px 18px #0008;background:#1a2330cc;z-index:7}
#mapMiniCanvas{display:block;width:100%;height:100%;cursor:pointer}
.mapTooltip{position:absolute;z-index:9;min-width:190px;max-width:270px;padding:8px 10px;background:#25190feF;color:#f4e6c8;border:1px solid #b8860b;border-radius:7px;box-shadow:0 8px 24px #0009;pointer-events:none;font-size:11.5px;line-height:1.4;opacity:0;transform:translateY(4px);transition:opacity .08s,transform .08s}
.mapTooltip.show{opacity:1;transform:translateY(0)}
.mapTooltip .ttTitle{font-weight:700;font-size:13px;color:#ffe29a;margin-bottom:3px}
.mapCompass{position:absolute;right:12px;top:12px;z-index:7;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#24190dcc;color:#f5e5bf;border:1px solid #b8860b;box-shadow:0 4px 14px #0007;font:700 14px Georgia,serif;pointer-events:none}
.mapCompass:before{content:'▲';position:absolute;top:3px;color:#e8c15a;font-size:14px}
.mapCompass span{font-size:10px;margin-top:20px}


.deselectArmyBtn{display:block;width:100%;margin-top:6px;padding:5px 7px;background:linear-gradient(#d8b7a6,#b8795f);color:#32170f;border-color:#87523f;font-size:11.5px}

/* ===== SIDEBAR MỚI ===== */
#side{
  width:340px;flex:none;
  background:linear-gradient(#efe3c6,#ddcda6);
  border-left:2px solid var(--line);
  overflow-y:auto;
  padding:0;
}

/* Sticky vùng đầu: tài nguyên + tabs */
.sideSticky{
  position:sticky;top:0;z-index:7;
  padding:8px 10px 8px;
  background:linear-gradient(#efe3c6 0%,#efe3c6 78%,#efe3c6dd 94%,#efe3c600 100%);
  box-shadow:0 4px 10px #00000010;
}
.sideContent{padding:6px 10px 12px}

/* Thanh tài nguyên */
.sideFactionBar{
  display:flex;align-items:center;gap:6px;
  padding:5px 8px;margin-bottom:6px;
  background:#00000008;border:1px solid #c9b486;border-radius:5px;
  font-size:11.5px;
}
.sfFlag{width:12px;height:12px;border:1px solid #0008;border-radius:2px;flex:none}
.sfName{font-weight:bold;color:#4a3418;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfStat{color:#6d5638;white-space:nowrap;font-variant-numeric:tabular-nums}

/* 3 Tab chính */
.sideTabs{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
}
.sideTab{
  position:relative;font-family:inherit;cursor:pointer;
  border:1px solid #9e8658;
  background:linear-gradient(#e6d7b7,#c9b486);
  color:#3a2a17;
  padding:8px 4px 7px;border-radius:6px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  transition:.12s;
}
.sideTab:hover{filter:brightness(1.06);transform:translateY(-1px)}
.sideTab:active{transform:translateY(0)}
.sideTab.active{
  background:linear-gradient(#e8c15a,#a8761c);
  border-color:#76551d;color:#24170a;
  box-shadow:0 0 0 1px #fff5 inset,0 2px 6px #0002;
}
.tabIcon{font-size:16px;line-height:1}
.tabLabel{font-size:10px;font-weight:bold;letter-spacing:.2px}

/* Badge thông báo */
.sideTab .badge{
  position:absolute;top:-5px;right:-5px;
  min-width:17px;height:17px;padding:0 5px;
  border-radius:9px;font-size:9.5px;font-weight:bold;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid #efe3c6;box-shadow:0 1px 3px #0006;
  line-height:1;
}
.badge.green{background:linear-gradient(#7fa85c,#4d7a35);color:#fff}
.badge.gold{background:linear-gradient(#e8c15a,#a8761c);color:#24170a}
.badge.red{background:linear-gradient(#e04a3a,#8b2e2e);color:#fff}

/* Banner chương */
.chapterBanner{
  border-left:4px solid #b8860b;border-radius:5px;
  padding:8px 10px;margin-bottom:10px;
}
.cbTitle{font-weight:bold;font-size:12.5px;color:#4a3418}
.cbIntro{font-size:11px;color:#6d5638;line-height:1.4;margin-top:3px}

/* Story arc */
.storyCard{padding:6px 8px}
.storyStage{display:flex;gap:7px;padding:6px 0;font-size:12px;align-items:flex-start}
.storyStage + .storyStage{border-top:1px dashed #c9b486}
.storyStage.locked{opacity:.5}
.storyStage.done{opacity:.65}
.storyStage.current{font-weight:bold}
.ssIcon{flex:none;font-size:12px;line-height:1.3}
.ssBody{flex:1;line-height:1.4}
.storyReward{
  margin-top:6px;padding:5px 7px;
  background:#c9a22722;border-radius:4px;
  font-size:11.5px;color:#8b2e2e;font-weight:bold;
}

/* Danh khí */
.itemCard{
  display:flex;gap:9px;align-items:center;
  background:linear-gradient(#c9a22722,#c9a22710);
  border:1px solid #b8860b;
}

/* Mục tiêu */
.objCard{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;line-height:1.4}
.objCard.objDone{background:#8fbf6a22;border-color:#7fa85c}
.objCheck{flex:none;font-size:13px}

/* Chi tiết vùng */
.regionCard{padding:8px 10px}
.regionStats{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}

/* Phe khác */
.factionMini{cursor:pointer;transition:.12s}
.factionMini:hover{border-color:#9a741f;background:#c9a22718}

/* Nhật ký */
.logEntry{
  font-size:11.5px;line-height:1.4;padding:5px 8px;margin-bottom:4px;
  background:#00000006;border-radius:4px;border-left:2px solid #c9b486;
}

/* Header nhỏ cho tab */
.tabIntro{
  padding:7px 9px;margin-bottom:8px;
  background:#00000006;border-radius:5px;
  font-size:12px;line-height:1.4;
}
.emptyCard{padding:14px;text-align:center;font-size:12.5px}
.emptyHint{
  padding:10px 12px;background:#00000006;border-radius:5px;
  font-size:11.5px;text-align:center;font-style:italic;
}

/* Chi tiết quân đoàn đang chọn */
.armyDetail{padding:10px;margin-bottom:8px}
.armyDetailStats{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0}
.armyRoster{
  display:flex;flex-wrap:wrap;gap:3px;margin:6px 0;
  padding:5px;background:#00000008;border-radius:4px;
}
.armyRoster.small{padding:3px;margin:5px 0 0}
.unitChip{
  display:inline-block;font-size:11px;line-height:1;
  padding:2px 4px;background:#00000010;border-radius:3px;
}
.armyActions{display:flex;gap:5px;margin-top:7px}
.armyActions button{flex:1;font-size:11.5px}

/* Thẻ quân đoàn trong danh sách */
.armyCard{padding:8px 10px;cursor:pointer;transition:.12s}
.armyCard:hover{border-color:#9a741f;background:#c9a22718;transform:translateY(-1px)}
.armyCard.selected{
  border-color:#b8860b;background:#c9a22722;
  box-shadow:inset 3px 0 #b8860b;
}
.acHeader{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:12.5px}
.acBody{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  font-size:11.5px;margin-top:3px;color:#6d5638;
}

/* Shop: bộ chọn quân đoàn */
.armyPicker{display:grid;grid-template-columns:1fr;gap:6px}
.armyPickCard{
  padding:8px 10px;border:1px solid #c9b486;border-radius:5px;
  cursor:pointer;transition:.12s;background:#00000006;
}
.armyPickCard:hover{border-color:#9a741f;background:#c9a22718}
.armyPickCard.disabled{opacity:.55;cursor:not-allowed}
.armyPickCard.disabled:hover{border-color:#c9b486;background:#00000006}

/* Shop grid */
.shopHeader{
  padding:8px 10px;margin-bottom:8px;
  background:linear-gradient(#f5ecd6,#e8dbb8);
  border:1px solid #c9b486;border-radius:5px;
}
.shopWallet{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.shopGroup{
  font-size:11px;margin:9px 0 4px;color:#5a3f1e;letter-spacing:.5px;
  border-bottom:1px dashed #c9b486;padding-bottom:3px;
}
.shopGrid{display:grid;grid-template-columns:1fr;gap:5px}
.shopUnit{
  display:flex;align-items:center;justify-content:space-between;
  gap:6px;padding:6px 8px;
  border:1px solid #c9b486;border-radius:5px;
  background:#00000008;transition:.12s;
}
.shopUnit:hover{background:#c9a22718;border-color:#9a741f}
.shopUnit.disabled{opacity:.55}
.shopUnit.disabled:hover{background:#00000008;border-color:#c9b486}
.suInfo{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.suIcon{font-size:18px;flex:none}
.suName{font-weight:bold;font-size:12px;color:#4a3418}
.suStats{font-size:10px;color:#7a6242;margin-top:1px}
.shopUnit button{
  padding:5px 8px;font-size:11px;
  display:flex;flex-direction:column;gap:0;
  line-height:1.15;min-width:54px;
}
.costGold{color:#8b5a1f;font-weight:bold}
.costFood{color:#3f7a2a;font-weight:bold;font-size:10px}

@media (max-width:820px){

function mulberry32(a){
  a = (a>>>0) || 1;
  const fn = function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  fn.getState = ()=>a>>>0;
  fn.setState = v=>{ a=(v>>>0)||1; };
  return fn;
}

/* ========================= 3. SINH BẢN ĐỒ ========================= */
function clipHalf(poly, a, b){
  if(poly.length===0) return poly;
  const out=[];
  const aw = a.w||1, bw = b.w||1;
  const t = aw / (aw + bw);
  const mx = a.x + (b.x-a.x)*t;
  const my = a.y + (b.y-a.y)*t;
  const nx = b.x-a.x, ny = b.y-a.y;
  const f = p => (p.x-mx)*nx + (p.y-my)*ny;
  for(let i=0;i<poly.length;i++){
    const P=poly[i], Q=poly[(i+1)%poly.length];
    const fp=f(P), fq=f(Q);
    if(fp<=1e-9) out.push(P);
    if((fp<-1e-9 && fq>1e-9)||(fp>1e-9 && fq<-1e-9)){
      const tt=fp/(fp-fq);
      out.push({x:P.x+(Q.x-P.x)*tt, y:P.y+(Q.y-P.y)*tt});
    }
  }
  return out;
}
function distPointSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1;
  const l2=dx*dx+dy*dy;
  let t = l2===0?0:((px-x1)*dx+(py-y1)*dy)/l2;
  t=clamp(t,0,1);
  const cx=x1+t*dx, cy=y1+t*dy;
  return Math.hypot(px-cx,py-cy);
}
function onBoundary(poly, p, tol){
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    if(distPointSeg(p.x,p.y,a.x,a.y,b.x,b.y) < tol) return true;
  }
  return false;
}
function pointInPoly(poly, px, py){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x, yi=poly[i].y, xj=poly[j].x, yj=poly[j].y;
    if(((yi>py)!==(yj>py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function buildMap(){
  const regions = REGION_DEFS.map((d,i)=>({
    id:i, name:d[0], x:d[1], y:d[2], land:d[3], terrain:d[4],
    gold:d[5], food:d[6], fort:d[7],
    weight: d[8] || 1.0,
    owner:null, poly:[], neighbors:[], seaLinks:[], dev:0,
    farm:0, market:0, capital:false
  }));
  for(let i=0;i<regions.length;i++){
    const r = regions[i];
    let poly = LANDMASSES[r.land].map(p=>({x:p[0],y:p[1]}));
    for(let j=0;j<regions.length;j++){
      if(i===j) continue;
      const o = regions[j];
      if(o.land !== r.land) continue;
      poly = clipHalf(poly, {x:r.x,y:r.y,w:r.weight}, {x:o.x,y:o.y,w:o.weight});
      if(poly.length===0) break;
    }
    if(poly.length<3){
      poly=[];
      for(let k=0;k<6;k++){
        const a=k/6*Math.PI*2;
        poly.push({x:r.x+Math.cos(a)*26, y:r.y+Math.sin(a)*26});
      }
    }
    r.poly = poly;
  }
  for(let i=0;i<regions.length;i++){
    for(let j=i+1;j<regions.length;j++){
      const a=regions[i], b=regions[j];
      if(a.land!==b.land) continue;
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d>200) continue;
      const aw = a.weight, bw = b.weight;
      const t = aw/(aw+bw);
      const mx = a.x + (b.x-a.x)*t;
      const my = a.y + (b.y-a.y)*t;
      const P={x:mx,y:my};
      if(onBoundary(a.poly,P,2.2) && onBoundary(b.poly,P,2.2)){
        a.neighbors.push(j); b.neighbors.push(i);
      }
    }
  }
  const byName = {};
  regions.forEach(r=>byName[r.name]=r);
  SEA_ROUTES.forEach(([n1,n2])=>{
    const a=byName[n1], b=byName[n2];
    if(!a||!b) return;
    if(!a.neighbors.includes(b.id)) a.neighbors.push(b.id);
    if(!b.neighbors.includes(a.id)) b.neighbors.push(a.id);
    a.seaLinks.push(b.id); b.seaLinks.push(a.id);
  });
  return regions;
}

      reinforce:[440,.5,'triangle']
    }[k]||[400,.05,'sine'];
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
    o.type=P[2]; o.frequency.value=P[0];
    g.gain.setValueAtTime(.07*GAME_SETTINGS.sfxVolume,t); g.gain.exponentialRampToValueAtTime(.001,t+P[1]);

function fireTimelineEvents(){
  if(!S) return false;
  const f = S.factions[S.playerFaction];
  const notFired = TIMELINE_EVENTS.filter(ev =>
    ev.year === S.year && !S.timelineFired.includes(ev.id)
  );
  if(!notFired.length) return false;
  const ev = notFired[0];
  S.timelineFired.push(ev.id);
  if(ev.worldFx) ev.worldFx();
  chron(`📜 [${ev.title}] ${ev.text}`);
  logEvent(ev.title, -1);
  const isPlayerChoice = ev.playerChoice && ev.playerChoice(f);
  if(isPlayerChoice && ev.choices){
    const html = `<h2>${ev.title}</h2><p>${ev.text}</p>
      <div class="hint">${currentChapter().icon} Chương ${currentChapter().id}: ${currentChapter().name}</div>
      <div class="choices" id="tlChoices"></div>`;
    showModal(html, ()=>{
      const box = $('tlChoices');
      ev.choices.forEach(c=>{
        const b = document.createElement('button');
        b.textContent = c.text;
        b.onclick = ()=>{ c.fx(f); chron(`${f.short}: ${c.text}`); closeModal(); render(); };
        box.appendChild(b);
      });
    });
    sfx('horn');
    return true;
  }
  // Sự kiện không có lựa chọn → banner lớn
  toast(`📜 ${ev.title}`);
  sfx('horn');
  return true;
}

function checkFactionArc(){
  if(!S) return;
  const f = S.factions[S.playerFaction];
  const arc = FACTION_ARCS[f.short];
  if(!arc) return;
  if(!S.factionArc) S.factionArc = { stage:0, done:false };
  if(S.factionArc.done) return;
  const stages = ['act1','act2','act3'];
  const stage = stages[S.factionArc.stage];
  if(!stage) return;
  const act = arc[stage];
  if(act && act.check && act.check()){
    S.factionArc.stage++;
    chron(`⭐ [${f.short}] HOÀN THÀNH: ${act.title}`);
    logEvent(`⭐ ${act.title}`, f.id);
    toast(`⭐ Cốt truyện: ${act.title}`);
    f.prestige+=25; f.stability=clamp(f.stability+10,0,100);
    sfx('levelup');
    if(S.factionArc.stage>=3){
      S.factionArc.done = true;
      chron(`🏆 [${f.short}] Hoàn thành toàn bộ cốt truyện phe! ${arc.reward}`);
      f.prestige+=50;
      if(f.short==='Tào Tháo') f.trait='reconq';
      if(f.short==='Tôn Kiên') f.trait='viking';
      if(f.short==='Lưu Bị') f.trait='viking';
    }
  }
}

function grantLegendaryItem(){
  if(!S || S.legendaryItem) return;
  const f = S.factions[S.playerFaction];
  const candidates = LEGENDARY_ITEMS.filter(it=>it.cond && it.cond(f));
  if(!candidates.length) return;
  const it = pick(candidates);
  S.legendaryItem = it.id;
  chron(`💎 ${f.short} đạt được danh khí: ${it.icon} ${it.name} — ${it.desc}`);
  logEvent(`💎 Nhận ${it.name}!`, f.id);
  toast(`💎 Danh khí: ${it.name}!`);
  sfx('levelup');
  if(it.apply){
    if(f.short==='Tôn Kiên'||f.short==='Viên Thuật'||f.short==='Lưu Yên') it.apply(f);
    else {
      // Gán cho quân đoàn mạnh nhất
      const my = S.armies.filter(a=>a.faction===S.playerFaction).sort((a,b)=>armyPower(b)-armyPower(a));
      if(my.length) it.apply(my[0]);
    }
  }
}

function generalBondBonus(general, enemyGeneral){
  if(!general || !enemyGeneral) return 1;
  const b = CHARACTER_BONDS[general.name];
  if(!b) return 1;
  if(b.rival === enemyGeneral.name) return 1.15; // +15% khi đối đầu tử địch
  if(b.friend === enemyGeneral.name) return 0.95;
  return 1;
}

function getEndingType(){
  if(!S) return 'defeat';
  const f = S.factions[S.playerFaction];
  const regions = countRegions(S.playerFaction);
  const totalRegions = S.regions.length;
  const ratio = regions/totalRegions;
  const year = S.year;
  const arc = S.factionArc || { stage:0, done:false };

  if(ratio >= 0.85){
    if(year <= 215) return 'rapid_unification';   // Thống nhất nhanh
    if(year <= 240) return 'unification';          // Thống nhất
    return 'slow_conquest';                        // Thôn tính từ từ
  }
  if(ratio >= 0.5) {
    if(arc.done) return 'hegemon';                 // Bá chủ với cốt truyện hoàn chỉnh
    return 'regional_lord';                        // Vua một cõi
  }
  if(arc.done) return 'legendary_hero';            // Anh hùng huyền thoại
  return 'survivor';                               // Kẻ sống sót
}

/* ========================= 4B. LƯU / TẢI, CÀI ĐẶT & HOÀN TÁC ========================= */
function cloneGameState(){
  return JSON.parse(JSON.stringify(S));
}
function makeSavePayload(){
  return {
    version:1,
    game:cloneGameState(),
    rngState:rng && rng.getState ? rng.getState() : null,
    savedAt:new Date().toISOString()
  };
}
function encodeSave(payload){
  const bytes = new TextEncoder().encode(JSON.stringify(payload));
  let bin='';
  for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function decodeSave(text){
  const bin=atob(String(text).trim());
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
function writeStorage(key,payload){
  try{
    localStorage.setItem(key, encodeSave(payload));
    return true;
  }catch(e){
    toast('Không thể ghi bộ nhớ trình duyệt. Hãy thử xuất mã lưu.');
    return false;
  }
}
function readStorage(key){
  try{
    const raw=localStorage.getItem(key);
    return raw ? decodeSave(raw) : null;
  }catch(e){ return null; }
}
function hasAutosave(){
  try{ return !!localStorage.getItem(AUTOSAVE_KEY); }catch(e){ return false; }
}
function autosaveGame(){
  if(!S || B || S.over) return;
  writeStorage(AUTOSAVE_KEY, makeSavePayload());
}
function restoreGamePayload(payload){
  if(!payload || payload.version!==1 || !payload.game) throw new Error('Mã lưu không hợp lệ');
  S = payload.game;
  rng = mulberry32(S.seed||1);
  if(payload.rngState!=null && rng.setState) rng.setState(payload.rngState);
  genObjectives();
  B=null; selArmy=null; hoverRegion=null; undoSnapshot=null;
  mapView.userZoom=false;
  invalidateStaticMap();
  resizeMap();
  render();
  updateUndoButton();
  toast(`Đã tải ván: năm ${S.year} — ${SEASONS[S.season]}`);
}
function saveToSlot(slot){
  if(!S){ toast('Chưa có ván đấu để lưu.'); return; }
  const idx=Number(slot)-1;
  if(idx<0||idx>2) return;
  if(writeStorage(SAVE_SLOT_KEYS[idx],makeSavePayload())){
    toast(`Đã lưu vào Ô ${slot}.`);
    renderSaveManager();
  }
}
function loadFromSlot(slot){
  const idx=Number(slot)-1;
  if(idx<0||idx>2) return;
  const payload=readStorage(SAVE_SLOT_KEYS[idx]);
  if(!payload){ toast(`Ô ${slot} đang trống.`); return; }
  try{
    restoreGamePayload(payload);
    closeModal();
    $('startOv').classList.add('hidden');
  }catch(e){ toast('Bộ lưu bị hỏng hoặc không tương thích.'); }
}
function continueAutosave(){
  const payload=readStorage(AUTOSAVE_KEY);
  if(!payload){ toast('Chưa có bản lưu tự động.'); return; }
  try{
    restoreGamePayload(payload);
    $('startOv').classList.add('hidden');
  }catch(e){ toast('Bản lưu tự động không hợp lệ.'); }
}
function deleteSlot(slot){
  try{ localStorage.removeItem(SAVE_SLOT_KEYS[Number(slot)-1]); }catch(e){}
  renderSaveManager();
}
function exportSave(){
  if(!S){ toast('Chưa có ván đấu để xuất.'); return; }
  const code=encodeSave(makeSavePayload());
  const ta=$('saveExportText');
  if(ta){ ta.value=code; ta.select(); }
  toast('Đã tạo mã lưu Base64.');
}
function importSave(){
  const ta=$('saveExportText');
  if(!ta || !ta.value.trim()){ toast('Hãy dán mã lưu trước.'); return; }
  try{
    const payload=decodeSave(ta.value);
    restoreGamePayload(payload);
    closeModal();
    $('startOv').classList.add('hidden');
  }catch(e){ toast('Mã lưu không hợp lệ hoặc đã bị hỏng.'); }
}
function renderSaveManager(){
  let h='<h2>💾 Lưu / Tải ván</h2>';
  h+='<p class="hint">Tự động lưu sau mỗi lượt. Ba ô dưới đây là lưu thủ công.</p>';
  SAVE_SLOT_KEYS.forEach((key,i)=>{
    const payload=readStorage(key);
    const stamp=payload&&payload.savedAt ? new Date(payload.savedAt).toLocaleString('vi-VN') : 'Trống';
    const year=payload&&payload.game ? `${payload.game.year} CN — ${SEASONS[payload.game.season]}` : '';
    h+=`<div class="card" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <div style="flex:1;min-width:180px"><b>Ô ${i+1}</b><br><span class="hint">${stamp}${year?' · '+year:''}</span></div>
      <button class="pri" onclick="saveToSlot(${i+1})" ${S?'':'disabled'}>Lưu</button>

  h+=`<h3>📦 Sao lưu bằng mã</h3>
    <textarea id="saveExportText" rows="4" style="width:100%;resize:vertical;padding:7px;border:1px solid #b8a57e;border-radius:5px;background:#fff8e5;font-family:monospace;font-size:11px" placeholder="Bấm Xuất mã để tạo Base64 hoặc dán mã để nhập..."></textarea>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">
      <button class="pri" onclick="exportSave()" ${S?'':'disabled'}>Xuất mã</button>
      <button onclick="importSave()">Nhập mã</button>
    </div>
    <p class="hint" style="margin-top:6px">Mã lưu chứa trạng thái chiến lược và trạng thái RNG để tiếp tục nhất quán theo seed.</p>
    <div class="choices"><button onclick="closeModal()">Đóng</button></div>`;
  showModal(h);
}
function captureUndo(label){
  if(!S || B || S.over) return;
  undoSnapshot={label,state:cloneGameState(),rngState:rng.getState?rng.getState():null,armyId:selArmy&&selArmy.id!=null?selArmy.id:null};
  updateUndoButton();
}
function undoAction(){
  if(!undoSnapshot || !S || B) return;
  try{
    const snap=undoSnapshot;
    S=snap.state;
    rng=mulberry32(S.seed||1);
    if(snap.rngState!=null) rng.setState(snap.rngState);
    genObjectives();
    selArmy=snap.armyId==null?null:S.armies.find(a=>a.id===snap.armyId)||null;
    if(selArmy) S.selected=selArmy.region;
    invalidateStaticMap();
    undoSnapshot=null;
    render();
    updateUndoButton();
    toast(`Đã hoàn tác: ${snap.label}.`);
  }catch(e){ toast('Không thể hoàn tác thao tác này.'); }
}
function updateUndoButton(){
  const b=$('btnUndo');
  if(!b) return;
  b.disabled=!undoSnapshot || !!B || !S || !!S.over;
  b.title=undoSnapshot ? `Hoàn tác: ${undoSnapshot.label}` : 'Không có thao tác để hoàn tác';
}

/* ========================= 4C. TUYỂN QUÂN, XÂY DỰNG ========================= */
const ARMY_CAP = 32;

function recruit(k){
  const a=selArmy; if(!a) return;
  const f=S.factions[S.playerFaction], c=unitCost(k), T=UNIT_TYPES[k];
  if(a.units.length>=ARMY_CAP||f.gold<c.g||f.food<c.f) return;
  captureUndo(`tuyển ${T.name}`);
  f.gold-=c.g; f.food-=c.f;
  a.units.push(newStrategicUnit(k));
  sfx('click'); render();
}
function newStrategicUnit(type){
  const T = UNIT_TYPES[type];
  return {type, hp:T.hp, maxHp:T.hp, level:1, xp:0, veteran:false};
}

function buildingLevel(r, type){
  if(type==='fort') return r.fort||0;
  return r[type]||0;
}
function buildingCost(r, type){
  const def = BUILDING_DEFS[type];
  const cur = buildingLevel(r, type);
  return def.baseCost * (cur+1);
}
function buildInRegion(regionId, type){
  const r = S.regions[regionId];
  const f = S.factions[S.playerFaction];
  if(!r || r.owner !== f.id) return;
  const def = BUILDING_DEFS[type];
  if(!def) return;
  const cur = buildingLevel(r, type);
  if(cur >= def.max){ toast('Đã đạt cấp tối đa.'); return; }
  const cost = buildingCost(r, type);
  if(f.gold < cost){ toast('Không đủ vàng.'); return; }
  captureUndo(`xây ${def.name} tại ${r.name}`);
  f.gold -= cost;
  if(type==='fort') r.fort = cur+1;
  else r[type] = cur+1;
  chron(`${f.short} xây ${def.name} cấp ${cur+1} tại ${r.name}.`);
  logEvent(`🏗 ${def.icon} ${def.name} Lv${cur+1} tại ${r.name}.`, f.id);
  sfx('build');
  render();
}
function setCapital(regionId){
  const r = S.regions[regionId];
  const f = S.factions[S.playerFaction];
  if(!r || r.owner !== f.id) return;
  if(r.capital){ toast('Đây đã là thủ đô của bạn.'); return; }
  const cost = 80;
  if(f.gold < cost){ toast('Cần 80 vàng để dời đô.'); return; }
  captureUndo(`dời đô về ${r.name}`);
  f.gold -= cost;
  if(f.capitalRegion >= 0 && S.regions[f.capitalRegion]){
    S.regions[f.capitalRegion].capital = false;
  }
  r.capital = true;
  f.capitalRegion = r.id;
  f.capital = r.name;
  chron(`🏛 ${f.short} dời đô đến ${r.name}.`);
  logEvent(`🏛 Thủ đô mới của ${f.short}: ${r.name}.`, f.id);
  sfx('capital');
  render();
}
function regionActions(r){
  const f=S.factions[S.playerFaction]; if(r.owner!==f.id) return '';
  let s='<div class="bldGrid">';
  ['farm','market','fort'].forEach(type=>{
    const def = BUILDING_DEFS[type];
    const cur = buildingLevel(r, type);
    const cost = buildingCost(r, type);
    const off = cur>=def.max || f.gold<cost;
    const lvTxt = cur>=def.max ? 'MAX' : 'Lv'+cur+'→'+(cur+1);
    s += `<button class="bld" ${off?'disabled':''} onclick="buildInRegion(${r.id},'${type}')" title="${def.desc}">
      ${def.icon} ${def.name} · ${lvTxt} · ${cur>=def.max?'—':cost+'🪙'}</button>`;
  });
  if(!r.capital){
    const cost = 80;
    s += `<button class="cap" ${f.gold<cost?'disabled':''} onclick="setCapital(${r.id})" title="Đặt làm thủ đô: +50% thu nhập toàn quốc, +phòng thủ. Nếu thất thủ sẽ bị phạt nặng.">🏛 Đặt làm thủ đô (80🪙)</button>`;
  }
  s += '</div>';
  if(!S.armies.some(a=>a.region===r.id&&a.faction===f.id)){
    s += `<div style="margin-top:6px"><button ${f.gold<45||f.food<18?'disabled':''} onclick="raiseArmy(${r.id})">👑 Lập quân đoàn (45🪙 18🌾)</button></div>`;
  }
  return s;
}
function raiseArmy(id){
  const r=S.regions[id], f=S.factions[S.playerFaction];
  if(r.owner!==f.id||f.gold<45||f.food<18) return;
  captureUndo('lập quân đoàn mới');
  f.gold-=45; f.food-=18;
  S.armies.push({id:S.nextArmyId++,faction:f.id,region:id,general:newGeneral(),
    units:[newStrategicUnit('gen'), newStrategicUnit('spear'),
           newStrategicUnit('sword'), newStrategicUnit('archer')],moved:true});
  sfx('click'); render();
}
function newGeneral(){
  const t = shuffle(TRAITS.slice()).slice(0, ri(1,2));
  return {
    name: pick(GENERAL_NAMES),
    age: ri(24,58),
    traits: t,
    level: 1, xp: 0,
    wounded: false, captured: false,
    personality: pick(['aggressive','defensive','cunning'])
  };
}
function genBonus(g){
  const b={atk:0,def:0,mor:0,gold:0};
  if(!g) return b;
  g.traits.forEach(t=>{ b.atk+=t.atk||0; b.def+=t.def||0; b.mor+=t.mor||0; b.gold+=t.gold||0; });
  b.atk += (g.level-1)*0.04; b.def += (g.level-1)*0.03;
  return b;
}
function initGame(seed, playerFactionIdx, difficulty){
  rng = mulberry32(seed);
  const regions = buildMap();
  const factions = FACTION_DEFS.map((d,i)=>({
    id:i, name:d.name, short:d.short, color:d.color, capital:d.capital,
    capitalRegion: -1,
    king:d.king, trait:d.trait, desc:d.desc,
    gold: 40 + ri(0,25), food: 40 + ri(0,25), prestige: 50 + ri(0,20),
    stability: 60 + ri(0,25),
    isPlayer: i===playerFactionIdx, alive:true,
    relations:{}, allies:[], wars:[],
    heir: chance(0.6) ? pick(GENERAL_NAMES) : null,
    kingAge: ri(35,62),
    ai:{ aggression: 0.3+rng()*0.55, caution: 0.2+rng()*0.6 },
    vassalLoyalty: 50+ri(0,30),
    crusader: false
  }));
  Object.keys(START_REGIONS).forEach(short=>{
    const f = factions.find(x=>x.short===short);
    if(!f) return;
    START_REGIONS[short].forEach(rn=>{
      const r = regions.find(x=>x.name===rn);
      if(r) r.owner = f.id;
    });
  });
  factions.forEach(f=>{
    const cap = regions.find(r=>r.name===f.capital);
    if(cap){ cap.capital = true; f.capitalRegion = cap.id; }
  });
  const armies = [];
  let aid=0;
  factions.forEach(f=>{
    const cap = regions.find(r=>r.name===f.capital) || regions.find(r=>r.owner===f.id);
    if(!cap) return;
    const units = [
      newStrategicUnit('gen'),
      newStrategicUnit('spear'), newStrategicUnit('spear'),
      newStrategicUnit('sword'), newStrategicUnit('sword'),
      newStrategicUnit('archer'), newStrategicUnit('archer')
    ];
    if(f.trait==='knight') units.push(newStrategicUnit('hcav'));
    else units.push(newStrategicUnit('lcav'));
    armies.push({
      id: aid++, faction: f.id, region: cap.id,
      general: newGeneral(), units, moved:false
    });
  });
  regions.forEach(r=>{
    if(r.owner===null) r.garrison = ri(2,4);
    else r.garrison = 0;
  });
  S = {
    seed, year: 190, season: 0, turn: 0,
    regions, factions, armies,
    playerFaction: playerFactionIdx,
    selected: null,
    chronicle: [],
    eventLog: [],
    flags: { crusade:false, plague:0, famine:0 },
    objectives: [],
    objectiveIds: [],
    over: false,
    difficulty: difficulty,
    pendingBattle: null,
    nextArmyId: aid,
    sideTab: 'armies',
    autoBattlePreference: false
  };
  factions.forEach(a=>{
    factions.forEach(b=>{
      if(a.id!==b.id) a.relations[b.id] = ri(-30,25);
    });
  });
  for(let k=0;k<3;k++){
    const a=pick(factions), b=pick(factions);
    if(a.id!==b.id){ a.relations[b.id]=-ri(35,60); b.relations[a.id]=-ri(35,60); }
  }
  genInitialStory();
  genObjectives();
  S.armies.forEach(a=>a.moved=false);
  invalidateStaticMap();
  render();
}

/* ========================= 5. STORY ENGINE ========================= */
function logEvent(txt, factionId){
  S.eventLog.unshift({turn:S.turn, year:S.year, season:S.season, text:txt, faction:factionId});
  if(S.eventLog.length>60) S.eventLog.pop();
}
function chron(txt){
  S.chronicle.push({year:S.year, season:S.season, text:txt});
}
function fname(id){ return S.factions[id] ? S.factions[id].short : '?'; }

function genInitialStory(){
  const F = S.factions;
  const types = [
    ()=>{ const f = pick(F); f.heir = null; f.kingAge = ri(58,70);
      chron(`${f.name}: Chúa công ${f.king} tuổi cao, chưa lập người kế vị. Anh em trong tộc đang ngấm ngầm tranh quyền.`);
      F.forEach(o=>{ if(o.id!==f.id && chance(0.4)) o.relations[f.id] -= 10; }); },
    ()=>{ const a=pick(F), b=pick(F.filter(x=>x.id!==a.id)); if(!b) return;
      a.relations[b.id]=-55; b.relations[a.id]=-55;
      chron(`${a.short} và ${b.short} có mối thù truyền kiếp từ vùng biên giới. Chiến tranh có thể bùng nổ bất cứ lúc nào.`); },
    ()=>{ S.flags.crusade = true;
      chron(`Hán đế hạ chiếu Cần Vương, hiệu triệu chư hầu thảo phạt Đổng Trác, giải cứu thiên tử.`); },
    ()=>{ const f = pick(F); f.stability -= 20; f.vassalLoyalty -= 25;
      chron(`${f.name}: Chư hầu bất mãn với mức thuế nặng, âm mưu phản loạn đang lan rộng.`); },
    ()=>{ const f = pick(F); f.gold += 60; f.prestige += 10;
      chron(`${f.name}: Mùa màng bội thu, thương nhân bốn phương nô nức về kinh doanh. Ngân khố đầy ắp.`); },
    ()=>{ const r = pick(S.regions); S.flags.plague = 3;
      chron(`Ôn dịch bùng phát tại ${r.name}. Các tuyến thương mại có thể lan truyền bệnh.`); }
  ];
  shuffle(types).slice(0,3).forEach(fn=>fn());
}
function genObjectives(){
  const p = S.playerFaction;
  const opts = [

/* ========================= 6. LƯỢT CHIẾN LƯỢC ========================= */
function incomeOf(f){
  let g=0, fo=0;
  S.regions.forEach(r=>{
    if(r.owner===f.id){
      const marketMult = r.terrain==='coast' ? 1.5 : 1;
      let rg = r.gold + Math.round((r.market||0)*2*marketMult);
      let rf = r.food + (r.farm||0)*2;
      if(r.capital){ rg = Math.round(rg*1.5); rf = Math.round(rf*1.5); }
      g += rg; fo += rf;
      if(r.fort>=2) g += 1;
    }
  });
  if(f.trait==='vassal') g = Math.round(g*1.15);
  const armies = S.armies.filter(a=>a.faction===f.id);
  const upkeepFood = Math.round(armies.reduce((s,a)=>s+a.units.length,0)*0.35);
  return {gold:g, food:fo, upkeep:upkeepFood};
}
function doIncome(f){
  const inc = incomeOf(f);
  f.gold += inc.gold;
  f.food += inc.food - inc.upkeep;
  if(f.food < 0){
    f.food = 0;
    S.armies.filter(a=>a.faction===f.id).forEach(a=>{ if(a.units.length>1 && chance(0.5)) a.units.pop(); });
    logEvent(`${f.name} thiếu lương thực, quân lính đào ngũ!`, f.id);
  }
  if(f.trait==='vassal') f.gold += 2;
}
function beginPlayerTurn(){
  S.turn++; S.season++;
  if(S.season>3){ S.season=0; S.year++; }
  if(S.season===3){
    S.armies.forEach(a=>{
      const f = S.factions[a.faction];
      if(f.trait==='rus') return;
      if(chance(0.3) && a.units.length>1){ a.units[a.units.length-1].hp -= 15; }
    });
    logEvent('Mùa đông khắc nghiệt. Quân đội tiêu hao lương thảo.', -1);
  }
  doIncome(S.factions[S.playerFaction]);
  S.armies.forEach(a=>{
    const rg=S.regions[a.region];
    if(rg && rg.owner===a.faction){
      a.units.forEach(u=>{
        u.hp = Math.min(u.maxHp, u.hp + Math.round(u.maxHp*.15));
        if(u.hp>0 && u.hp<u.maxHp*0.5) u.hp = Math.max(u.hp, Math.round(u.maxHp*0.2));
      });
    }
  });
  S.armies.forEach(a=>{ if(a.faction===S.playerFaction) a.moved = false; });
  S.regions.forEach(r=>r.movedThisTurn=false);
  if(S.flags.plague>0) S.flags.plague--;
  render();
  toast(`Năm ${S.year} — ${SEASONS[S.season]}`);
  runEvents();
  checkObjectives();
  checkGameOver();
  undoSnapshot=null;
  autosaveGame();
  updateUndoButton();
}
function endPlayerTurn(){
  if(S.over) return;
  sfx('click');
  undoSnapshot=null; updateUndoButton();
  selArmy = null; S.selected = null;
  runAITurns().then(()=>{ beginPlayerTurn(); });
}
async function runAITurns(){
  for(const f of S.factions){
    if(f.id===S.playerFaction || !f.alive) continue;
    await aiTurn(f);
    render();
    await sleep(400/Math.max(.25,GAME_SETTINGS.aiSpeed));
  }
}

/* ========================= 7. AI CHIẾN LƯỢC ========================= */
async function aiTurn(f){
  doIncome(f);
  S.armies.forEach(a=>{ if(a.faction===f.id) a.moved=false; });
  const aggr = f.ai.aggression * (S.difficulty===2 ? 1.3 : S.difficulty===0 ? 0.7 : 1);
  const myRegions = S.regions.filter(r=>r.owner===f.id);
  if(myRegions.length===0){ f.alive=false; return; }
  const armiesOf = S.armies.filter(a=>a.faction===f.id);
  const cap = S.regions.find(r=>r.name===f.capital);
  if(armiesOf.length===0 && cap && cap.owner===f.id){
    S.armies.push({
      id: S.nextArmyId++, faction:f.id, region:cap.id,
      general:newGeneral(),
      units:[newStrategicUnit('gen'), newStrategicUnit('spear'),
             newStrategicUnit('sword'), newStrategicUnit('archer')],
      moved:false
    });
  }
  aiBuildings(f);
  const main = armiesOf.sort((a,b)=>b.units.length-a.units.length)[0];
  if(main){
    const types = f.trait==='knight' ? ['hcav','sword','spear','archer']
               : f.trait==='archer' ? ['archer','xbow','spear','sword']
               : f.trait==='horse'  ? ['lcav','archer','sword','spear']
               : ['spear','sword','archer','lcav'];
    let tries = 8;
    while(tries-- > 0 && main.units.length < ARMY_CAP){
      const t = pick(types);
      const c = UNIT_TYPES[t].cost;
      if(f.gold >= c.g && f.food >= c.f){
        f.gold -= c.g; f.food -= c.f;
        main.units.push(newStrategicUnit(t));
      } else break;
    }
  }
  aiDiplomacy(f);
  for(const a of S.armies.filter(x=>x.faction===f.id && !x.moved)){
    if(!a.units.length) continue;
    const here = S.regions[a.region];
    if(!here) continue;
    const targets = [];
    here.neighbors.forEach(nid=>{
      const r = S.regions[nid];
      const enemy = r.owner!==null && r.owner!==f.id;
      const neutral = r.owner===null;
      const defPower = regionDefensePower(r);
      const myPower = armyPower(a);
      let score = 0;
      if(neutral) score = 40 + (myPower - defPower)*0.6;
      else if(enemy){
        const rel = f.relations[r.owner]||0;
        const atWar = f.wars.includes(r.owner);
        score = (atWar? 30 : rel < -20 ? 5 : -60) + (myPower - defPower)*0.7;
        if(r.capital) score += 40;
        else if(r.name===S.factions[r.owner].capital) score += 25;
      } else return;
      if(defPower===0) score += 60;
      score += R()*20;
      if(score > 10) targets.push({r, score});
    });
    targets.sort((x,y)=>y.score-x.score);
    if(targets.length && chance(0.35 + aggr*0.5)){
      const t = targets[0];
      if(t.r.owner!==null && !f.wars.includes(t.r.owner)){ declareWar(f.id, t.r.owner); }
      a.moved = true;
      await resolveArmyMove(a, t.r, true);
      await sleep(250/Math.max(.25,GAME_SETTINGS.aiSpeed));
    }
  }
}
function aiBuildings(f){
  const my = S.regions.filter(r=>r.owner===f.id);
  if(!my.length) return;
  const candidates = [];
  my.forEach(r=>{
    ['farm','market','fort'].forEach(type=>{
      const def = BUILDING_DEFS[type];
      const cur = buildingLevel(r, type);
      if(cur >= def.max) return;
      const cost = buildingCost(r, type);
      if(cost > f.gold) return;
      let score = 10 - cur*3;
      if(type==='farm' && f.food < 30) score += 8;
      if(type==='market' && f.gold < 40) score += 6;
      if(type==='fort' && (r.capital || r.terrain==='mountains' || r.terrain==='hills')) score += 5;
      if(r.capital) score += 4;
      if(type==='market' && r.terrain==='coast') score += 4;
      score += R()*3;
      candidates.push({r, type, cost, score});
    });
  });
  if(!candidates.length) return;
  candidates.sort((a,b)=>b.score-a.score);
  let built = 0;
  for(const c of candidates){
    if(built >= 2) break;
    if(c.cost > f.gold) continue;
    if(!chance(0.55)) continue;
    f.gold -= c.cost;
    if(c.type==='fort') c.r.fort = (c.r.fort||0)+1;
    else c.r[c.type] = (c.r[c.type]||0)+1;
    chron(`${f.short} xây ${BUILDING_DEFS[c.type].name} tại ${c.r.name}.`);
    built++;
  }
}
function aiDiplomacy(f){
  S.factions.forEach(o=>{
    if(o.id===f.id || !o.alive) return;
    const rel = f.relations[o.id]||0;
    const myP = factionPower(f.id), oP = factionPower(o.id);
    if(f.wars.includes(o.id) && myP < oP*0.75 && chance(0.3)){
      if(o.id===S.playerFaction){ if(chance(0.5)) offerPeaceToPlayer(f.id, o.id); }
      else { makePeace(f.id, o.id); }
    }
    if(!f.wars.includes(o.id) && rel < -35 && myP > oP*1.35 && chance(f.ai.aggression*0.25)){
      declareWar(f.id, o.id);
    }
  });
}
let pendingPeaceOffer = null;
function offerPeaceToPlayer(fromId, toId){
  const f = S.factions[fromId];
  pendingPeaceOffer = {fromId, toId};
  const html = `<h2>🕊 Đề nghị đình chiến</h2>
    <p><b>${f.name}</b> gửi sứ giả cầu hòa. Họ đang ở thế yếu và sẵn sàng nhượng bộ.</p>
    <div class="choices" id="pc"></div>`;
  showModal(html, ()=>{
    const box = $('pc');
    const b1 = document.createElement('button');
    b1.textContent = 'Chấp nhận đình chiến (+10 uy tín, +15 quan hệ)';
    b1.onclick = ()=>{ makePeace(fromId, toId); S.factions[toId].prestige+=10; closeModal(); render(); };
    const b2 = document.createElement('button');
    b2.textContent = 'Từ chối, tiếp tục chiến tranh (-5 uy tín)';
    b2.onclick = ()=>{ S.factions[toId].prestige-=5; closeModal(); render(); };
    box.appendChild(b1); box.appendChild(b2);
  });

function makePeace(a,b){
  const fa=S.factions[a], fb=S.factions[b];
  fa.wars = fa.wars.filter(x=>x!==b);
  fb.wars = fb.wars.filter(x=>x!==a);
  fa.relations[b]=clamp((fa.relations[b]||0)+20,-100,100);
  fb.relations[a]=clamp((fb.relations[a]||0)+20,-100,100);
  chron(`${fa.short} và ${fb.short} ký kết đình chiến.`);
  logEvent(`Hòa ước giữa ${fa.short} và ${fb.short}.`, -1);
}
function declareWar(a,b){
  const fa=S.factions[a], fb=S.factions[b];
  if(!fa.wars.includes(b)) fa.wars.push(b);
  if(!fb.wars.includes(a)) fb.wars.push(a);
  fa.relations[b]=clamp((fa.relations[b]||0)-40,-100,100);
  fb.relations[a]=clamp((fb.relations[a]||0)-40,-100,100);
  chron(`${fa.short} tuyên chiến với ${fb.short}.`);
  logEvent(`⚔ ${fa.short} tuyên chiến với ${fb.short}!`, -1);
}
function factionPower(fid){
  let p = 0;
  S.armies.forEach(a=>{ if(a.faction===fid) p += armyPower(a); });
  S.regions.forEach(r=>{ if(r.owner===fid) p += 8 + r.fort*10; });
  return p;
}
function armyPower(a){
  return a.units.reduce((s,u)=>s+UNIT_TYPES[u.type].atk + u.hp/8 + (u.level||1)*2, 0);
}
function regionDefensePower(r){
  const a = S.armies.find(x=>x.region===r.id && (r.owner===null || x.faction===r.owner));
  let p = a ? armyPower(a) : 0;
  if(r.owner===null) p += (r.garrison||0) * 25;
  p += r.fort*20;
  if(r.capital) p += 25;
  return p;
}
